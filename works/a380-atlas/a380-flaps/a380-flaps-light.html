@media (min-width:900px) and (orientation:landscape){

}
@media (max-width:899.98px), (orientation:portrait){

}
@media (max-width:899.98px), (orientation:portrait) and (max-height:500px){

  main.iso-page .iso-plate{padding:46px 8px 40px}

@media (prefers-reduced-motion:reduce){
  main.iso-page>.iso-figure>.iso-legend{transition:none!important}
}

const G_ = Object.fromEntries(STAGGER.map((id) => [id, els(id)]));
const accents = [...svg.querySelectorAll("[data-acc]")];
const mech = {
  fl: { u: 0, goal: 0, shown: 0, n: FL_N, poses: [...svg.querySelectorAll("[data-fl-pose]")], key: "flPose", button: document.querySelector("[data-fl-toggle]"), labels: ["收起襟翼 (F)", "放下襟翼 (F)"], zone: "flap", info: FL_INFO },

let chosen = "", apart = false, frame = 0, last = 0, clock = 0, tourClock = 0, touring = !still.matches, visible = false, idle = 0;
function describe() {

    const out = m.goal === 1;
    if (!apart && chosen === m.zone && (out || m.u > 0)) text = m.info[out ? 0 : 1];
    if (m.button) { const label = m.labels[out ? 0 : 1]; if (m.button.textContent !== label) m.button.textContent = label; m.button.setAttribute("aria-pressed", out ? "true" : "false"); }

function choose(id, byUser = false) {

}
function setApart(on) {

function setMech(m, out) {

function steerMech(m, dt, calm) {

}
const ease = (f) => f * f * (3 - 2 * f);
function showMech(m, index) {
  if (m.shown === index) return;
  m.shown = index;
  m.poses.forEach((g) => (g.style.display = +g.dataset[m.key] === index ? "" : "none"));
}
function steerSpring(state, dt, calm) {

  if (calm) { state.x = state.target; state.v = 0; return state.pending !== null; }

}
const move = (nodes, by) => nodes.forEach((node) => { if (Math.abs(by[0]) + Math.abs(by[1]) + Math.abs(by[2]) < 1e-3) node.removeAttribute("transform"); else node.setAttribute("transform", translateAlong(P, by)); });
function frameView() {
  const x = Math.min(1, Math.max(0, view.x));

}
function draw() {
  for (const m of Object.values(mech)) showMech(m, Math.round(ease(m.u) * m.n));
  const any = Math.min(1, STAGGER.reduce((a, id) => a + piece[id].x, 0));
  const nudge = (id) => level[id] * (1 - any) * 0.06;
  move(G_.spoiler, [0, 0, (EX.spoiler * piece.spoiler.x + nudge("spoiler") * 0.6) * U]);
  move(G_.shroud, [0, 0, (EX.shroud * piece.shroud.x + nudge("spoiler") * 0.4) * U]);
  move(G_.skin, [0, 0, (EX.skin * piece.skin.x + nudge("spar") * 0.5) * U]);
  move(G_.flap, [0, (EX.flap * piece.flap.x + nudge("flap") * 0.6) * U, EX.flapUp * piece.flap.x * U]);
  move(G_.fairing, [0, EX.fairingAft * piece.fairing.x * U, -(EX.fairing * piece.fairing.x + nudge("fairing") * 0.6) * U]);

  if (f.s === 1 && f.tx === 0 && f.ty === 0) viewEl.removeAttribute("transform");

}
function steerView(dt, calm) {
  const goal = apart ? 1 : 0;
  if (calm) { view.x = goal; view.v = 0; return false; }
  const w = Math.sqrt(SPRING.stiffness) * 0.9;
  for (let i = 0; i < SPRING.substeps; i++) {
    const h = dt / SPRING.substeps;
    view.v += ((goal - view.x) * w * w - 2 * w * view.v) * h;
    view.x += view.v * h;

  if (Math.abs(goal - view.x) < 2e-4 && Math.abs(view.v) < 2e-4) { view.x = goal; view.v = 0; return false; }

}
const TOUR = [[2.4, "pick", "spoiler"], [5.0, "sp-out", "spoiler"], [7.6, "sp-in", "spoiler"], [9.0, "pick", "flap"], [9.4, "fl-out", "flap"], [12.2, "pick", "fairing"], [13.8, "fl-in", "flap"], [15.4, "pick", "spar"], [16.6, "open", "actuator"], [19.6, "pick", "flap"], [21.4, "close", "flap"]];
const TOUR_LEN = 24.4;
let tourStep = 0;
function tourTick(dt) {
  tourClock += dt;
  if (tourClock >= TOUR_LEN) { tourClock -= TOUR_LEN; tourStep = 0; }
  while (tourStep < TOUR.length && tourClock >= TOUR[tourStep][0]) {
    const [, what, id] = TOUR[tourStep++];
    if (what === "open") setApart(true);
    if (what === "close") setApart(false);
    if (what === "fl-out") setMech(mech.fl, true);
    if (what === "fl-in") setMech(mech.fl, false);
    if (what === "sp-out") setMech(mech.sp, true);
    if (what === "sp-in") setMech(mech.sp, false);

  }
}
function tick(now) {

  last = now;
  clock += dt;
  const calm = still.matches;
  if (touring) tourTick(dt);
  let moving = false;
  ORDER.forEach((d) => {
    const want = d === chosen && !apart ? 1 : 0;
    level[d] = calm ? want : level[d] + (want - level[d]) * (1 - Math.exp(-dt / 0.22));
    if (Math.abs(want - level[d]) < 0.002) level[d] = want; else moving = true;
  });
  for (const id in piece) if (steerSpring(piece[id], dt, calm)) moving = true;
  if (steerView(dt, calm)) moving = true;
  for (const m of Object.values(mech)) if (steerMech(m, dt, calm)) moving = true;

  frame = visible && (touring || moving) ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const holdTour = () => { touring = false; clearTimeout(idle); idle = setTimeout(() => { touring = !still.matches; tourClock = 0; tourStep = 0; if (apart) setApart(false); setMech(mech.fl, false); setMech(mech.sp, false); run(); }, 3600); };
const steer = (id) => { holdTour(); if (id) choose(id, true); run(); };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
const zoneAt = (event) => { const z = event.target && event.target.closest && event.target.closest("[data-zone]"); return z ? z.getAttribute("data-zone") : ""; };
stage.addEventListener("pointermove", (event) => steer(zoneAt(event)));
stage.addEventListener("pointerdown", (event) => steer(zoneAt(event)));
stage.addEventListener("click", () => { holdTour(); setApart(!apart); });
const toggle = (m) => { holdTour(); choose(m.zone, true); setMech(m, m.goal !== 1); };
stage.addEventListener("keydown", (event) => {
  const here = ORDER.indexOf(chosen);
  let to = null;
  if (event.key === "e" || event.key === "E" || event.key === " " || event.key === "Enter") { event.preventDefault(); holdTour(); setApart(!apart); return; }

  if (event.key === "f" || event.key === "F") { event.preventDefault(); toggle(mech.fl); return; }
  if (event.key === "s" || event.key === "S") { event.preventDefault(); toggle(mech.sp); return; }

  if (event.key === "ArrowDown" || event.key === "ArrowRight") to = Math.min(ORDER.length - 1, here + 1);
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = ORDER.length - 1;

for (const m of Object.values(mech)) if (m.button) m.button.addEventListener("click", (event) => { event.stopPropagation(); toggle(m); });

choose("flap");
level.flap = 1;
draw();
</script></body></html>
