反推套筒</text><path class="iso-line" data-tone="mid" data-free="start" d="m303 392.4 10.7-114.4"/><g class="iso-dots" data-tone="hi"><circle cx="313.7" cy="278" r="1.1"/></g></g></g></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>所选区域中高亮的部件：吊挂、消声衬垫、整流锥、燃烧室或反推叶栅</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>风扇、核心机转子与吊挂，按同一比例绘制</span><span class="iso-key"><svg class="iso-swatch" data-mark="elec" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>电动反推作动器（ETRAS）：剖切面上可见近侧下部 1 个滚珠丝杠作动筒（每台反推共 6 个）</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>短舱与核心机整流罩；近侧（外侧）一半剖开</span></span><span class="iso-caption">A380 左侧内侧发动机，罗尔斯·罗伊斯 Trent 900，从左前方观察。风扇直径 2.95 m（116 in），24 片后掠宽弦叶片；三转子结构：风扇由 5 级低压涡轮驱动，8 级中压压气机和 6 级高压压气机各由一级涡轮驱动，高压转子反向旋转。涵道比 8.5–8.7，起飞推力 75,152–76,752 lbf（EASA 型号合格证数据单，Trent 970/972），发动机长 5.48 m。A380 只有两台内侧发动机装反推，为叶栅式，由电作动（ETRAS）的平移套筒后移露出叶栅；外侧发动机为固定风扇涵道。按 R 展开反推；拆解时进气道和风扇向前、尾喷管向后、整流罩向外、吊挂与机翼向上。</span></figcaption></figure></main><!--fit:start--><style>

main.iso-page .iso-stage:focus-visible{outline:1px dashed var(--anatomy-mid)!important;outline-offset:-3px!important}
html,body{height:100%}
body.iso{margin:0;overflow:hidden}
main.iso-page{width:100%!important;max-width:none!important;margin:0!important;height:100vh;height:100dvh;
  display:flex;flex-direction:column;padding:56px 20px 20px;overflow:hidden}
main.iso-page>.iso-figure{flex:1 1 auto;min-height:0;margin:0;display:flex;align-items:center;gap:16px;position:relative}
main.iso-page .iso-plate{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;padding:44px 20px 40px}
main.iso-page .iso-plate-corners{inset:16px 18px}
main.iso-page .iso-plate{padding-top:58px;padding-bottom:50px}
main.iso-page .iso-plate>.iso-stage{flex:none;min-width:0;display:flex;align-items:center;justify-content:center;overflow:visible}
main.iso-page .iso-plate>.iso-stage>svg{flex:none;max-width:100%;max-height:100%}
.fit-pill{position:fixed;top:12px;z-index:30;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;
  border:0;border-radius:999px;background:var(--anatomy-card);color:var(--anatomy-strong);box-shadow:0 0 0 1px var(--anatomy-mid);
  font:500 13px/1 "PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;letter-spacing:.02em;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fit-pill:hover{box-shadow:0 0 0 1px var(--anatomy-text)}
.fit-pill:focus-visible{outline:2px solid var(--anatomy-text);outline-offset:2px}
.fit-back{left:20px}
.fit-toggle{right:20px}
.fit-toggle svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6}
.iso-legend .fit-legend-head{display:block;margin:0 0 10px;color:var(--anatomy-strong);font:600 13px/1.4 "PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;letter-spacing:.06em}
@media (min-width:900px) and (orientation:landscape){
  main.iso-page>.iso-figure>.iso-legend{flex:0 0 300px;width:300px;align-self:stretch;margin:0;overflow:auto;padding:18px 18px 20px;
    background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);display:flex;flex-direction:column;gap:14px}
  html.fit-closed main.iso-page>.iso-figure>.iso-legend{display:none}
  main.iso-page .iso-legend .iso-keys{flex-direction:column;flex-wrap:nowrap;gap:8px}
  main.iso-page .iso-legend .iso-key{align-items:flex-start}
  main.iso-page .iso-legend .iso-key .iso-swatch{margin-top:5px}
}
@media (max-width:899.98px), (orientation:portrait){
  main.iso-page{padding:52px 8px 8px}
  main.iso-page .iso-plate{padding:54px 8px 56px}
  main.iso-page .iso-plate-corners{inset:11px 10px}
  .fit-back{left:8px}
  .fit-toggle{right:8px}
  main.iso-page>.iso-figure>.iso-legend{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;max-height:min(60dvh,520px);overflow:auto;

    box-shadow:0 0 0 1px var(--anatomy-mid),0 -12px 32px -12px #0000004d;display:flex;flex-direction:column;gap:12px;
    transform:translateY(0);transition:transform .32s var(--anatomy-ease),visibility 0s linear 0s}
  html.fit-closed main.iso-page>.iso-figure>.iso-legend{transform:translateY(105%);visibility:hidden;
    transition:transform .32s var(--anatomy-ease),visibility 0s linear .32s}
}
@media (max-width:899.98px), (orientation:portrait) and (max-height:500px){
  main.iso-page{padding-top:48px}
  main.iso-page .iso-plate{padding:46px 8px 40px}
  main.iso-page .iso-plate-corners{inset:8px 10px}
}
@media (prefers-reduced-motion:reduce){
  main.iso-page>.iso-figure>.iso-legend{transition:none!important}
}
