lass="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>所选部件高亮：梁、翼肋、蒙皮、前缘与后缘活动面、翼尖小翼或挂架</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>整副左侧机翼，按同一比例绘制；内段上蒙皮剖开</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>剖切面：翼根肋与挂架短段的截断面</span><span class="iso-key"><svg class="iso-swatch" data-mark="cfrp" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>碳纤维复合材料：襟翼、扰流板、副翼和部分翼肋腹板</span><span class="iso-key"><svg class="iso-swatch" data-mark="blue" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>按 T：油箱分区（2 号供油箱、内侧、中间、1 号供油箱、外侧、通气油箱）</span></span><span class="iso-caption">A380 左侧整副机翼，从机身一侧偏后上方沿翼展望出去。全机翼展 79.75 m，单侧从机身侧到翼尖 36.3 m，参考面积 845 m²，1/4 弦线后掠 33.5°，翼根弦长 17.67 m，翼尖弦长 3.98 m。翼盒由前梁、后梁和只在内段的中梁构成，翼肋横跨其间（每副机翼 126 根，46 根为碳纤维复合材料），上下蒙皮壁板带桁条，整个翼盒就是整体油箱。前缘内段是 2 段下垂前缘，中外段是 6 块缝翼；后缘有 3 块襟翼、8 块扰流板和 3 块副翼；翼尖是上下翼刀式小翼；两处挂架连接点距机身侧约 11.2 m 和 22.1 m。梁弦向位置、翼型、厚度、上反角、翼肋间距与材料分布、油箱边界、活动面偏角与小翼外形均为示意。</span></figcaption></figure></main><!--fit:start--><style>
