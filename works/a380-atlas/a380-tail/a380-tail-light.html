 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>APU、方向舵、升降舵与隔框，按同一比例绘制</span><span class="iso-key"><svg class="iso-swatch" data-mark="cfrp" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>碳纤维复合材料：垂尾与方向舵、水平安定面与升降舵、尾锥段</span><span class="iso-key"><svg class="iso-swatch" data-mark="hyd" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>液压作动筒：升降舵作动筒</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>尾锥蒙皮；右侧（近侧）剖开</span></span><span class="iso-caption">A380 尾段，从右后上方观察，尾锥朝向读者。后压力隔框为穹顶形，凸面朝后。垂尾画到轴线以上约 8.6 m 处截断，方向舵分上、下 2 段。左侧水平安定面为可配平水平安定面（THS），由前梁处的配平丝杠驱动、绕后梁枢轴转动；平尾翼展 30.37 m，1/4 弦线后掠约 30°，上反 6°。尾锥内防火墙之后是普惠加拿大 PW980A 辅助动力装置：双转子燃气涡轮，当量功率 1,800 hp 以上，长约 2.01 m，驱动两台 120 kVA 发电机并供应引气；右上方的进气门打开时引入空气，排气从尾锥尖端排出。尾锥外形、结构位置与进气门尺寸为示意。</span></figcaption></figure></main><!--fit:start--><style>

  const text = apart ? "拆解 · " + APART[chosen] : chosen === "apu" && (out || rev.u > 0) ? REV_INFO[out ? 0 : 1] : INFO[chosen];
  if (revButton) { const label = out ? "关闭 APU 进气门 (A)" : "打开 APU 进气门 (A)"; if (revButton.textContent !== label) revButton.textContent = label; revButton.setAttribute("aria-pressed", out ? "true" : "false"); }

  stage.setAttribute("aria-valuenow", String(ORDER.indexOf(chosen) + 1));
}
function choose(id, byUser = false) {
  if (byUser) { if (svg.getAttribute("data-hot") !== id) svg.setAttribute("data-hot", id); } else if (svg.hasAttribute("data-hot")) svg.removeAttribute("data-hot");
  if (chosen === id) return;
  chosen = id;
  accents.forEach((a) => (a.dataset.acc === id ? a.setAttribute("data-lit", "") : a.removeAttribute("data-lit")));

}
function setApart(on) {
  if (apart === on) return;
  apart = on;
  const goal = on ? 1 : 0;
  let index = 0;
  for (const id of on ? STAGGER : [...STAGGER].reverse()) {
    if (piece[id].target === goal) piece[id].pending = null;

}

  const goal = out ? 1 : 0;

  describe();
  run();
}
function steerRev(dt, calm) {
  if (calm) { rev.u = rev.goal; return false; }
  const step = dt / REV_TIME;
  if (Math.abs(rev.goal - rev.u) <= step) { rev.u = rev.goal; return false; }
  rev.u += Math.sign(rev.goal - rev.u) * step;

}
const ease = (f) => f * f * (3 - 2 * f);
function showRev(index) {
  if (rev.shown === index) return;
  rev.shown = index;
  revPoses.forEach((g) => (g.style.display = +g.dataset.revPose === index ? "" : "none"));
}
function steerSpring(state, dt, calm) {
  if (state.pending && clock >= state.pending.at) { state.target = state.pending.value; state.pending = null; }
  if (calm) { state.x = state.target; state.v = 0; return state.pending !== null; }
  for (let i = 0; i < SPRING.substeps; i++) {
    const h = dt / SPRING.substeps;
    state.v += ((state.target - state.x) * SPRING.stiffness - state.v * SPRING.damping) * h;
    state.x += state.v * h;
  }
  if (Math.abs(state.target - state.x) < 2e-4 && Math.abs(state.v) < 2e-4) { state.x = state.target; state.v = 0; return state.pending !== null; }
  return true;
}
const move = (nodes, by) => nodes.forEach((node) => { if (Math.abs(by[0]) + Math.abs(by[1]) + Math.abs(by[2]) < 1e-3) node.removeAttribute("transform"); else node.setAttribute("transform", translateAlong(P, by)); });
function frameView() {
  const x = Math.min(1, Math.max(0, view.x));
  return { s: 1 + (VIEW.s - 1) * x, tx: VIEW.t[0] * x, ty: VIEW.t[1] * x };
}
function draw() {
  const e = ease(rev.u);
  showRev(Math.round(e * REV_N));
  const any = Math.min(1, STAGGER.reduce((a, id) => a + piece[id].x, 0));
  const nudge = (id) => level[id] * (1 - any) * 0.06;
  const sh = (id, dir) => { const m = EX.shell * piece[id].x + nudge("cone") * 0.8; move(G_[id], [dir[0] * m * U, dir[1] * m * U, dir[2] * m * U]); };
  sh("shellT", DIRS.T);
  sh("shellL", DIRS.L);
  sh("shellB", DIRS.B);
  move(G_.fin, [0, 0, (EX.fin * piece.fin.x + nudge("fin")) * U]);
  move(G_.ths, [0, -(EX.ths * piece.ths.x + nudge("ths")) * U, 0]);
  const ap = piece.apu.x + nudge("apu") * 0.6;
  move(G_.apu, [EX.apuQ * ap * U, 0, EX.apuZ * ap * U]);
  
  /*lb:fade*/{ const lbAny = Math.min(1, STAGGER.reduce((a, id) => a + piece[id].x, 0)); for (const g of lbEls) { const h = LB_HIDE[g.dataset.lb]; const o = Math.max(0, 1 - lbAny * 4) * (h ? Math.max(0, Math.min(1, h(g))) : 1); const t = o.toFixed(2); if (g.style.opacity !== t) g.style.opacity = t; g.style.visibility = o > 0 ? "" : "hidden"; } }/*lb:end-fade*/
  const f = frameView();
  if (f.s === 1 && f.tx === 0 && f.ty === 0) viewEl.removeAttribute("transform");
  else viewEl.setAttribute("transform", "matrix(" + f.s.toFixed(5) + " 0 0 " + f.s.toFixed(5) + " " + f.tx.toFixed(2) + " " + f.ty.toFixed(2) + ")");
}
function steerView(dt, calm) {
  const goal = apart ? 1 : 0;
  if (calm) { view.x = goal; view.v = 0; return false; }
  const w = Math.sqrt(SPRING.stiffness) * 0.9;
  for (let i = 0; i < SPRING.substeps; i++) {
    const h = dt / SPRING.substeps;
    view.v += ((goal - view.x) * w * w - 2 * w * view.v) * h;
    view.x += view.v * h;
  }
  if (Math.abs(goal - view.x) < 2e-4 && Math.abs(view.v) < 2e-4) { view.x = goal; view.v = 0; return false; }
  return true;
}
const TOUR = [[1.4, "pick", "fin"], [3.4, "pick", "ths"], [5.4, "pick", "apu"], [5.8, "out", "apu"], [8.6, "in", "apu"], [10.6, "pick", "cone"], [12.4, "open", "cone"], [15.4, "pick", "apu"], [17.4, "close", "fin"]];
const TOUR_LEN = 20.4;
let tourStep = 0;
function tourTick(dt) {
  tourClock += dt;
  if (tourClock >= TOUR_LEN) { tourClock -= TOUR_LEN; tourStep = 0; }
  while (tourStep < TOUR.length && tourClock >= TOUR[tourStep][0]) {
    const [, what, id] = TOUR[tourStep++];
    if (what === "open") setApart(true);
    if (what === "close") setApart(false);
    if (what === "out") setRev(true);
    if (what === "in") setRev(false);

}
function tick(now) {

  const calm = still.matches;
  if (touring) tourTick(dt);
  let moving = false;
  ORDER.forEach((d) => {
    const want = d === chosen && !apart ? 1 : 0;
    level[d] = calm ? want : level[d] + (want - level[d]) * (1 - Math.exp(-dt / 0.22));
    if (Math.abs(want - level[d]) < 0.002) level[d] = want; else moving = true;
  });
  for (const id in piece) if (steerSpring(piece[id], dt, calm)) moving = true;
  if (steerView(dt, calm)) moving = true;
  if (steerRev(dt, calm)) moving = true;
  draw();
  frame = visible && (touring || moving) ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const holdTour = () => { touring = false; clearTimeout(idle); idle = setTimeout(() => { touring = !still.matches; tourClock = 0; tourStep = 0; if (apart) setApart(false); setRev(false); run(); }, 15000); };
const steer = (id) => { holdTour(); if (id) choose(id, true); run(); };
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
const zoneAt = (event) => { const z = event.target && event.target.closest && event.target.closest("[data-zone]"); return z ? z.getAttribute("data-zone") : ""; };
stage.addEventListener("pointermove", (event) => steer(zoneAt(event)));
stage.addEventListener("pointerdown", (event) => steer(zoneAt(event)));
stage.addEventListener("click", () => { holdTour(); setApart(!apart); });
const toggleRev = () => { holdTour(); choose("apu", true); setRev(rev.goal !== 1); };
stage.addEventListener("keydown", (event) => {
  const here = ORDER.indexOf(chosen);
  let to = null;
  if (event.key === "e" || event.key === "E" || event.key === " " || event.key === "Enter") { event.preventDefault(); holdTour(); setApart(!apart); return; }
  if (event.key === "Escape") { holdTour(); setApart(false); setRev(false); return; }
  if (event.key === "a" || event.key === "A") { event.preventDefault(); toggleRev(); return; }
  if (event.key === "ArrowUp" || event.key === "ArrowLeft") to = Math.max(0, here - 1);
  if (event.key === "ArrowDown" || event.key === "ArrowRight") to = Math.min(ORDER.length - 1, here + 1);
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = ORDER.length - 1;
  if (to === null) return;
  event.preventDefault();
  steer(ORDER[to]);
});
if (revButton) revButton.addEventListener("click", (event) => { event.stopPropagation(); toggleRev(); });
still.addEventListener("change", () => { touring = !still.matches; run(); });
choose("apu");
level.apu = 1;
draw();
