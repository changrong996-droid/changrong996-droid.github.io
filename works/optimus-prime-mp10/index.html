<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MP-10 擎天柱 · 卡车与机器人外形</title>
<style>
:root{--ink:#22252b;--mute:#6b6f76;--line:#dcd8cf;--bg:#f4f2ed;--accent:#c41d27}

<div class="kicker">MP-10 · 外形确认稿（第 2 稿）</div>
<h1>擎天柱：同一套零件，两种外形</h1>
<p class="lede">左边是卡车头，右边是机器人。两边用的是同一组零件，只是关节角度不同：车头前脸就是胸口，车厢后侧就是双臂，后底盘就是两条腿。拖动可以转着看，滚轮缩放。</p>
<div class="fig">
<div class="bar"><span class="t">Fig 1 卡车与机器人</span>
<button data-view="both" aria-pressed="true">并排</button><button data-view="truck">卡车</button><button data-view="robot">机器人</button></div>
<div id="stage"></div>
<div class="labels"><span>卡车：长约 200 mm，宽约 90 mm</span><span>机器人：高约 245 mm（含天线）</span></div>
</div>
<p class="note">比例按 Takara Tomy MP-10 Convoy 玩具：机器人约 24 cm 高，车头约 20 × 9 × 10 cm（含烟囱）。这一版只确认外形，变形动画在外形定下后再做。</p>
