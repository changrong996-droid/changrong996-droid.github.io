<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MP-10 擎天柱 · 变形动画</title>
<style>
:root{--ink:#22252b;--mute:#6b6f76;--line:#dcd8cf;--bg:#f4f2ed;--accent:#c41d27}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:28px 20px 40px}
.kicker{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:600}
h1{font-size:28px;line-height:1.25;margin:6px 0 8px;font-weight:700}
.lede{color:var(--mute);max-width:46em;margin:0 0 18px}
.fig{border:1px solid var(--line);border-radius:10px;background:#f7f5f0;overflow:hidden}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .t{font-weight:600;margin-right:auto}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;cursor:pointer;color:var(--ink)}
button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
#stage{height:min(72vh,640px);position:relative;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#cap{position:absolute;left:14px;top:12px;z-index:2;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:14px;font-weight:600;pointer-events:none}
.scrub{padding:8px 14px;border-top:1px solid var(--line)}.scrub input{width:100%;accent-color:var(--accent)}
#steps{list-style:none;margin:0;padding:6px 10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
#steps button{width:100%;text-align:left;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.4;display:flex;gap:8px}
#steps button b{color:var(--accent)}#steps button[aria-current=true]{background:#fff3f0;border-color:var(--accent)}
.labels{display:flex;justify-content:space-around;padding:8px 12px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
.note{color:var(--mute);font-size:13px;margin-top:14px;max-width:60em}
</style></head><body><main>
<div class="kicker">MP-10 · 变形动画（第 4 稿）</div>
<h1>擎天柱：从卡车变成机器人</h1>
<p class="lede">同一个模型，零件按 MP-10 的变形顺序连续运动：车厢两侧变成手臂，车门带着前轮转到背后，头从胸腔里翻上来，后底盘放下成腿，腰再转 180°。拖动可以转着看，滚轮缩放。</p>
<div class="fig">
<div class="bar"><span class="t">Fig 1 变形过程</span>
<button id="play">暂停</button><button data-jump="0">卡车</button><button data-jump="end">机器人</button></div>
<div id="stage"><div id="cap"></div></div>
<div class="scrub"><input id="scrub" type="range" min="0" step="0.01" value="0" aria-label="变形进度"></div>
<ol id="steps"></ol>
</div>
<p class="note">尺寸按 Takara Tomy MP-10 Convoy：机器人约 24 cm 高，车头约 20 × 9 × 10 cm。变形顺序参考 MP-10 的评测分步照片；关节做了简化，零件是按照片重建的近似外形，不是官方图纸。</p>
