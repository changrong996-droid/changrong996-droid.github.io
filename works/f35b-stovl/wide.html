.f35 .iso-plate { padding: 52px 24px 58px; overflow: hidden; }

.f35-strip { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr 1.2fr 1.9fr; gap: 1px; margin: 18px 0 0; background: var(--anatomy-faint); box-shadow: 0 0 0 1px var(--anatomy-faint); }

@media (max-width: 700px) { .f35-strip { grid-template-columns: 1fr 1fr 1fr; } .f35-cell-v { font-size: 13px; } }
@media (prefers-reduced-motion: reduce) { .f35-btn { transition: none; } }
@media (max-width: 700px) { .f35-stage { width: 128%; margin-left: -14%; } .f35 .iso-plate { padding-bottom: 70px; } }

/* ---- 简体中文 ---- CJK-capable stacks: Latin digits stay monospace, Chinese falls back to a CJK sans */

  --anatomy-mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", monospace; }

/* canopy: smoky gold tint (the F-35's indium-tin-oxide coated glass), a highlight streak */

.ac-glint { fill: #ffffff; stroke: none; opacity: .62; }

/* ---- round 3: low-visibility F-35B scheme ----
   Overall mid-grey (FS 36170-like) in the kit's five light bands, so the airframe reads against the light deck;
   panel lines and part outlines darker than the skin; darker radar-absorbent edge bands; low-vis grey markings. */
.f35-ac, .fc-under-ac {
  --anatomy-top: #b3b7ba; --anatomy-shade-3: #a5a9ad; --anatomy-shade-2: #979ba0; --anatomy-shade-1: #8a8e93; --anatomy-shade-0: #7c8085;
  --anatomy-lo: #686c71; --anatomy-mid: #4c5055; --anatomy-faint: #8f9398;
  --f35-cav: #4a4e53; --f35-cav-line: #33363a;
  --f35-tyre-0: #2e3033; --f35-tyre-1: #36383b; --f35-tyre-2: #3f4144; --f35-tyre-3: #484a4e; --f35-tyre-4: #525458;
  --f35-glass-0: #6f6b5f; --f35-glass-1: #7b776b; --f35-glass-2: #878377; --f35-glass-3: #949084; --f35-glass-4: #a29e92;
}
.ac-ram { fill: #3a3e43; fill-opacity: .2; stroke: none; }

.ac-mark { fill: #3b3f44; fill-opacity: .5; stroke: none; font-family: "DejaVu Sans", "Noto Sans", "Helvetica Neue", Arial, sans-serif; }
.ac-mark .ac-mark-line, .ac-mark-line { fill: none; stroke: #3b3f44; stroke-opacity: .5; stroke-width: calc(var(--anatomy-weight) * 1.2); vector-effect: non-scaling-stroke; stroke-linecap: round; }
.ac-part.chrome path[data-s="4"] { fill: #f3f5f6; stroke: #f3f5f6; }
.ac-part.chrome path[data-s="3"] { fill: #dde1e4; stroke: #dde1e4; }
.ac-part.chrome path[data-s="2"] { fill: #8f969c; stroke: #8f969c; }
.ac-part.chrome path[data-s="1"] { fill: #c3c8cc; stroke: #c3c8cc; }

.f35-ac .ac-blade, .fc-under-ac .ac-blade { fill: #a3a7ab; }

/* ---- 一屏适配（fit-viewport）：整页恰好一屏，无页面滚动；图形按宽高同时等比缩放 ---- */
html, body.iso { height: 100%; overflow: hidden; }
body.iso .iso-page { width: 100%; max-width: 1640px; height: 100vh; height: 100dvh; margin: 0 auto; padding: 10px 14px; display: flex; flex-direction: column; }
.f35-fit.iso-figure { margin: 0; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.f35-fit .iso-plate { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 9px 14px 10px; overflow: hidden; }

/* 标题行：图号、标题、操作提示、实时读数排成一行（不再绝对定位到四角） */
.f35-fit .iso-plate-corners { position: static; inset: auto; display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 14px; margin: 0 0 7px; flex: none; }
.f35-fit .iso-plate-corner { position: static; white-space: nowrap; }
.f35-fit .iso-plate-corner[data-corner="hint"] { margin-left: auto; max-width: none; }
.f35-fit .iso-plate-corner[data-corner="readout"] { min-width: 9em; text-align: right; }

/* 图形区：占满剩余高度；舞台保持 1280:800，取宽、高两者中较紧的一边 */
.f35-box { position: relative; flex: 1 1 auto; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.f35-fit .f35-stage { flex: none; width: 100%; aspect-ratio: 1280 / 800; margin: 0; }
@supports (width: 1cqh) { .f35-fit .f35-stage { width: min(100cqw, 160cqh); } }
.f35-fit .fc-mm { width: clamp(96px, 16.4%, 210px); }
.f35-fit .fc-under { width: clamp(180px, 31.25%, 400px); }

/* 读数条与控件：紧凑 */
.f35-fit .f35-strip { margin: 8px 0 0; flex: none; }
.f35-fit .f35-cell { padding: 4px 9px 5px; gap: 2px; }
.f35-fit .f35-cell-k { font-size: 10.5px; }
.f35-fit .f35-cell-v { font-size: 14px; line-height: 1.2; }
.f35-fit .f35-controls { margin-top: 8px; gap: 6px; flex: none; }
.f35-fit .f35-btn { padding: 6px 11px; }

/* 图注与说明：默认收起，展开时浮在图形上方，不推动布局 */
.f35-notes { display: block; flex: none; }
.f35-notes > summary { list-style: none; }
.f35-notes > summary::-webkit-details-marker { display: none; }
.f35-notes > summary::marker { content: ""; }
.f35-notes-chev { width: 6px; height: 6px; border-right: 1.2px solid currentColor; border-bottom: 1.2px solid currentColor; transform: translateY(1px) rotate(-135deg); transition: transform .25s var(--anatomy-ease); }
.f35-notes[open] > summary { color: var(--anatomy-strong); box-shadow: var(--anatomy-lift), inset 0 0 0 1px var(--anatomy-mid); }
.f35-notes[open] .f35-notes-chev { transform: translateY(-2px) rotate(45deg); }
.f35-notes-body { position: absolute; z-index: 6; left: 0; right: 0; margin: 0 auto; width: min(780px, 100% - 28px);
  top: var(--f35-ov-top, 40px); bottom: var(--f35-ov-bot, 60px); display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
.f35-notes-panel { pointer-events: auto; max-height: 100%; overflow: auto; overscroll-behavior: contain; background: color-mix(in srgb, var(--anatomy-card) 96%, transparent); box-shadow: 0 0 0 1px var(--anatomy-faint), 0 8px 24px -10px #0000002e; border-radius: 4px; padding: 12px 16px 13px; }
.f35-fit .f35-notes-panel.iso-legend { margin: 0; gap: 7px; font-size: 12.5px; line-height: 1.65; }
.f35-notes-panel .iso-caption { margin: 0; }
.f35-notes-ops { margin: 0; color: var(--anatomy-muted); font-size: 11.5px; }
.f35-notes-head { font-size: 11.5px; letter-spacing: .06em; color: var(--anatomy-text); }
@media (prefers-reduced-motion: reduce) { .f35-notes-chev { transition: none; } }

/* 中等宽度：读数条两行三列也可 */
@media (max-width: 860px) and (min-width: 701px) { .f35-fit .f35-cell-v { font-size: 13px; } }

/* 手机：上下堆叠；舞台按原设计放大到 128% 并在图形区内裁切；整组内容垂直居中 */
@media (max-width: 700px) {
  body.iso .iso-page { padding: 8px; justify-content: center; position: relative; }
  .f35-fit.iso-figure { flex: 0 1 auto; }
  .f35-fit .iso-plate { flex: 0 1 auto; padding: 8px 10px 9px; position: static; }
  .f35-fit .iso-plate-corner[data-corner="hint"] { display: none; }
  .f35-fit .iso-plate-corner[data-corner="title"] { margin-right: auto; }
  .f35-fit .iso-plate-corner[data-corner="readout"] { min-width: 0; flex: 1 0 100%; text-align: left; }
  .f35-box { flex: 0 1 auto; height: calc((100vw - 36px) * .8); }
  .f35-fit .f35-stage { width: 128%; margin-left: 0; }
  @supports (width: 1cqh) { .f35-fit .f35-stage { width: min(128cqw, 160cqh); } }
  .f35-fit .f35-cell { padding: 5px 7px 6px; }
  .f35-fit .f35-btn { padding: 6px 9px; }
  .f35-notes-body { width: calc(100% - 16px); }
  .f35-notes-panel { box-shadow: 0 0 0 1px var(--anatomy-mid), 0 8px 24px -10px #0000003a; }
}
@media (max-height: 560px) { .f35-fit .f35-cell { padding: 3px 8px 4px; } .f35-fit .f35-controls, .f35-fit .f35-strip { margin-top: 5px; } }
.f35-fit .f35-stage:focus-visible { outline-offset: -2px; }

"图注与说明"><span class="f35-notes-head">图 1 · F-35B 短距起飞/垂直降落循环</span><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>三轴承旋转喷管</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>机体、舱门与起落架</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>飞行甲板与 12° 滑跃甲板</span></span><p class="iso-caption" id="f35-caption">F-35B：机长 15.6 米，翼展 10.7 米。短距起飞/垂直降落模式下，F135-PW-600 发动机经传动轴驱动座舱后方直径 50 英寸的两级升力风扇（冷推力约 89 千牛），三轴承旋转喷管 2.5 秒内可下偏至 95°（热推力约 80 千牛），并从外涵引气至两侧机翼内的滚转喷口（每侧约 8.7 千牛）；短距起飞推力为 181 千牛，喷管偏转时不能开加力。本图甲板滑跑 67 米至 12° 滑跃甲板末端，离舰时相对甲板约 48 节，另加 20 节甲板风。垂直降落先在舷侧 40 英尺高度悬停，横移到降落点上方，以约 5 英尺/秒下降，接地前减至 3 英尺/秒。15 米以上的高度按压缩比例绘制，250 节的通场放慢约 6 倍以便观看，空速含 20 节甲板风，传动轴转速为估计值（离合器在最高约 8,500 转/分时接合）。</p><p class="f35-notes-ops">操作：空格 播放，1–3 阶段，←→ 步进，拖动。</p></div></div></details></div><span class="f35-sr" aria-live="polite" data-live></span></div></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;

let STATIC = null;

const PLANFORM = [NOSE_TIP, [3.6, 1.5, 0], [2.05, 1.66, 0], [-0.56, 5.35, 0], [-2.2, 5.35, 0], [-3.11, 1.6, 0], [-4.75, 1.3, 0], [-6.24, 3.33, 0], [-7.05, 3.33, 0], [-7.58, 1.25, 0], [-7.6, 0, 0]]

function controlSurfaceParts(s, add) {

// lift-fan upper door: a shell on the spine contour (x 0.78…3.05, y ±0.6), 7 cm thick, hinged at its aft edge
const LIFT = { x0: 0.78, x1: 3.05, w: 0.6, thick: 0.07 };

  float hw=sqrt(Rb*Rb-d2);float t0=max(tc-hw,tg);float t1=tc+hw;
  if(t1<=t0)return acc;
  float dt=(t1-t0)/22.;
  float j=hash12(gl_FragCoord.xy+fract(uTime*7.31)*91.);
  for(int i=0;i<22;i++){
    float t=t0+(float(i)+j)*dt;
    vec3 p=p0+t*V;
    float s=dot(p-E,Dj);float u=s/L;
    vec3 a=E+Dj*clamp(s,0.,L);
    float r=length(p-a);
    float R=r0*(1.+grow*clamp(u,0.,1.));
    vec3 qn=p*.055-Dj*uTime*2.4;float n=noise3(qn)*.62+noise3(qn*2.13+7.1)*.38;
    float dens=exp(-r*r/(R*R)*1.8)*smoothstep(-.25*r0,.7*r0,s)*(1.-smoothstep(.35,1.,u));
    dens*=mix(1.,.35+1.25*n,smoothstep(.04,.45,u))*pow(r0/R,1.4);
    float w=dt/(r0*1.77)*amp;
    float T=pow(clamp(1.-u,0.,1.),1.7)*heat;
    acc.x+=dens*w*T*mix(1.,1.35-.6*smoothstep(0.,R,r),uLight);
    acc.y+=dens*w*(1.-.7*T);
    acc.z+=dens*w*(n-.5);
  }
  return acc;
}
// a thin jet seen analytically: distance from the pixel ray to its axis
float slim(vec3 p0,vec3 V,float tg,vec3 E,vec3 Dj,float L,float r0){
  vec3 w0=p0-E;float b=dot(V,Dj);float d=dot(V,w0);float e=dot(Dj,w0);
  float den=max(1.-b*b,1e-4);float t=(b*e-d)/den;float s=clamp((e-b*d)/den,0.,L);
  t=dot(E+Dj*s-p0,V);
  vec3 c=p0+t*V;float r=length(c-(E+Dj*s));
  float R=r0*(1.+1.4*s/L);
  return exp(-r*r/(R*R)*1.6)*(1.-smoothstep(.3*L,L,s))*smoothstep(tg-2.,tg+2.,t)*(r0/R);
}
float groundZ(vec2 p){return (inDeck(p)>.5&&p.y>uRamp.z)?rampZ(p.x):0.;}
// gas spreading over the deck around an impingement point: a thin layer taken analytically at the
// ground hit, and the steam it lifts, marched
vec3 wall(vec3 p0,vec3 V,float tg,vec4 W,float hot){
  vec3 acc=vec3(0.);
  if(W.z<.002||tg<-1e4)return acc;
  vec3 G=p0+tg*V;
  float onDeck=deckSoft(G.xy)*inDeck(p0.xy+vec2(0.));
  vec2 dG=G.xy-W.xy;float rG=length(dG)+1e-3;
  float n0=fbm3(vec3(dG*.028-dG/rG*uTime*1.4,uTime*.3));
  float h=5.+rG*.06;
  float layer=exp(-rG/W.w)*smoothstep(0.,W.w*.3,rG+W.w*.08)*(h/V.z)*(.6+.8*n0)*onDeck;
  acc.x=layer*W.z*hot*exp(-rG/(W.w*.5))*.06;
  acc.y=layer*W.z*.035;
  vec3 mid=p0+V*(tg+30./V.z);
  if(length(mid.xy-W.xy)>W.w*2.2+40.)return acc;
  float dt=(60./V.z)/12.;
  float j=hash12(gl_FragCoord.yx+fract(uTime*5.13)*37.);
  for(int i=0;i<12;i++){
    float t=tg+(float(i)+j)*dt;
    vec3 p=p0+t*V;
    vec2 d=p.xy-W.xy;float rho=length(d)+1e-3;
    float z=max(p.z-groundZ(p.xy),0.);
    vec3 qn=vec3(d*.03-d/rho*uTime*1.5,z*.05-uTime*.55);float n=noise3(qn)*.62+noise3(qn*2.13+3.7)*.38;
    float lift=exp(-pow((z-8.-rho*.08)/(7.+rho*.07),2.))*exp(-rho/(W.w*1.1))*smoothstep(.3,.85,n)*deckSoft(p.xy);
    acc.z+=lift*dt/30.*W.z;
  }
  return acc;
}
vec4 over(vec4 a,vec4 b){return a+b*(1.-a.a);}
vec4 inkFor(vec3 seen,float cover){vec3 ab=1.-seen;float a=max(max(ab.r,max(ab.g,ab.b)),cover);return vec4(vec3(a)-ab,a);}
vec4 hotInk(float e){
  float m=1.-exp(-2.2*e);
  vec3 seen=mix(vec3(1.),vec3(1.,.8,.58),smoothstep(.0,.3,m));
  seen=mix(seen,vec3(.98,.6,.28),smoothstep(.25,.6,m));
  seen=mix(seen,vec3(1.,.9,.72),smoothstep(.62,.95,m));
  return inkFor(seen,.6*smoothstep(.6,.95,m));
}
void main(){
  vec2 vb=viewOf(gl_FragCoord.xy);
  vec3 V=towardViewer();
  vec3 p0=onFloor(vb,0.);
  float tg=groundT(p0,V);
  vec3 hot=jet(p0,V,tg,uJE,uJD,uJ.y,uJ.z,2.6,uJ.w,uJ.x);
  vec3 cold=jet(p0,V,tg,uFE,uFD,uF.y,uF.z,1.9,0.,uF.x);
  float posts=uP>.002?(slim(p0,V,tg,uPL,vec3(0.,0.,-1.),55.,2.2)+slim(p0,V,tg,uPR,vec3(0.,0.,-1.),55.,2.2))*uP:0.;
  vec3 wh=wall(p0,V,tg,uWH,1.);
  vec3 wc=wall(p0,V,tg,uWC,0.);
  float e=hot.x*.5+wh.x*.55;
  float haze=hot.y*.45+posts*.35+wh.y+wc.y*.8;
  float shimmer=hot.z+cold.z*.8+(wh.y+wc.y)*(fbm2(vb*.3+vec2(0.,uTime*3.))-.5)*.8;
  float steam=wh.z+wc.z*.8;
  vec4 hz=vec4(vec3(.8,.82,.85),1.)*clamp((1.-exp(-haze*1.4))*.36+shimmer*.22,0.,.5);
  float ca=clamp((1.-exp(-cold.y*2.4))*.42+cold.z*.25,0.,.45);
  hz=over(vec4(vec3(.76,.81,.88)*ca,ca),hz);
  float sa=(1.-exp(-steam*2.2))*.72;
  vec3 sc=mix(vec3(.74,.77,.81),vec3(.97,.975,.98),smoothstep(.2,.8,fbm2(vb*.08+uTime*.2)));
  vec4 st=vec4(sc*sa,sa);
  vec4 ink=over(hotInk(e),over(hz,st));
  ink.rgb=min(ink.rgb,vec3(ink.a));
  vec2 edge=min(gl_FragCoord.xy,uCanvas-gl_FragCoord.xy);
  ink*=smoothstep(2.,18.,min(edge.x,edge.y))*uFade;
  float nd=(hash12(gl_FragCoord.xy+fract(uTime*.61)*91.)+hash12(gl_FragCoord.yx*1.37+fract(uTime*.37)*57.)-1.)/255.;
  ink=max(ink+nd*smoothstep(0.,1.5/255.,ink.a),0.);
  ink.rgb=min(ink.rgb,vec3(ink.a));
  gl_FragColor=ink;
}`;

const canvas = stage.querySelector(".f35-gl");
let layer = null;
try {
  layer = glLayer({
    canvas, fragment: FRAGMENT, view: [D.W, D.H], camera: D.camera,
    uniforms: ["uJE", "uJD", "uJ", "uFE", "uFD", "uF", "uPL", "uPR", "uP", "uWH", "uWC", "uFade"],
    maxRatio: 1.25,
    fixed: { uDeck: D.deck, uRamp: D.ramp, uHull: [D.hullY, D.hullZ, D.sternX], uLight: LIGHT },
  });
} catch (error) { console.error(error); layer = null; }
if (layer) stage.setAttribute("data-gl", "");

// ---- impingement: where an axis meets the deck, and how much of the jet is left when it does ----
function impinge(E, Dir, L, strength) {
  if (Dir[2] > -0.12 || strength < 1e-3) return [0, 0, 0, 40];
  let tHit = E[2] / -Dir[2];
  for (let i = 0; i < 4; i++) { const q = V3.add(E, V3.mul(Dir, tHit)); tHit = (E[2] - (groundAt(q[0], q[1]) ?? 0)) / -Dir[2]; }
  const H = V3.add(E, V3.mul(Dir, tHit));
  const left = 1 - sm(0.3 * L, 0.95 * L, tHit);
  const edge = Math.min(H[0] - D.deck[0], D.deck[1] - H[0], H[1] - D.deck[2], D.deck[3] - H[1]);
  return [H[0], H[1], strength * left * sm(-18, 28, edge), 34 + tHit * 0.35];
}

// ---- state, clock and controls ----
let T = still.matches ? PHASES[2].key : 0;
let playing = !still.matches;
let fanPhase = 0;
const fade = { x: 1, v: 0 };
let fadeTarget = 1;
let pending = null;
let lastPhase = -1;
let frame = 0, last = 0, visible = false, dirty = true, clock = 0.8;

function phaseOf(t) { for (let i = PHASES.length - 1; i >= 0; i--) if (t >= PHASES[i].start) return i; return 0; }
function jumpTo(t) {
  if (still.matches) { T = t; dirty = true; run(); return; }
  pending = t; fadeTarget = 0; run();
}
function setPlaying(on) {
  playing = on;
  playBtn.setAttribute("aria-label", on ? "暂停" : "播放");
  playLabel.textContent = on ? "暂停" : "播放";
  playBtn.toggleAttribute("data-paused", !on);
  run();
}

const fmt = (v) => Math.round(v).toLocaleString("en-US");
function draw(dt) {
  const s = stateAt(T);
  s.fanPhase = fanPhase;
  const art = renderAircraft(s, P);
  acG.innerHTML = art.svg;
  const show = s.show * fade.x;
  acG.setAttribute("opacity", show.toFixed(3));
  // shadow on the deck: the planform dropped onto the ground under it
  const h = s.z - 21;
  const over = art.planform.map((p) => groundAt(p[0], p[1]) !== null).filter(Boolean).length / art.planform.length;
  const shade = 0.3 * Math.exp(-Math.max(0, h) / 70) * (1 - sm(60, 120, h)) * sm(0.15, 0.85, over) * show;
  if (shade > 0.01) {
    shadow.setAttribute("d", "M" + art.planform.map((p) => at([p[0], p[1], groundAt(p[0], p[1]) ?? 0]).map((v) => v.toFixed(1)).join(" ")).join("L") + "Z");
    shadow.style.opacity = shade.toFixed(3);
    shadow.style.filter = `blur(${(2.2 + Math.max(0, h) * 0.05).toFixed(1)}px)`;
  } else shadow.style.opacity = "0";
  // jets
  const stovl = s.mode === "stovl";
  const jetL = stovl ? 70 + 85 * s.power : 46;
  const heat = stovl ? 0.3 + 0.7 * s.power : 0.32;
  const jAmp = (stovl ? 0.25 + 0.75 * s.power : 0.5) * show;
  const fanAmp = s.fan * s.door * s.power * show;
  const fanL = 150;
  const WH = impinge(art.exit, art.exitDir, jetL, jAmp);
  const WC = impinge(art.fanExit, art.fanDir, fanL, fanAmp * 0.8);
  if (layer) {
    if (jAmp + fanAmp > 0.002) {
      layer.draw({
        uJE: art.exit, uJD: art.exitDir, uJ: [jAmp, jetL, art.exitR * 0.92, heat],
        uFE: art.fanExit, uFD: art.fanDir, uF: [fanAmp * 0.9, fanL, 6.4, 0],
        uPL: art.posts[0], uPR: art.posts[1], uP: s.posts * s.power * show * 0.7,
        uWH: WH, uWC: WC, uFade: 1,
      }, still.matches ? 0.8 : clock);
    } else layer.clear();
  } else {
    // SVG fallback: a tapered jet and a ring where it meets the deck
    const e = at(art.exit), f = at(V3.add(art.exit, V3.mul(art.exitDir, jetL * 0.7)));
    const dx = f[0] - e[0], dy = f[1] - e[1], l = Math.hypot(dx, dy) || 1;
    const nx = -dy / l, ny = dx / l, r0 = art.exitR * 0.9 * P.scale * 1.26, r1 = r0 * 2.6;
    fbJet.setAttribute("d", `M${(e[0] + nx * r0).toFixed(1)} ${(e[1] + ny * r0).toFixed(1)}L${(f[0] + nx * r1).toFixed(1)} ${(f[1] + ny * r1).toFixed(1)}L${(f[0] - nx * r1).toFixed(1)} ${(f[1] - ny * r1).toFixed(1)}L${(e[0] - nx * r0).toFixed(1)} ${(e[1] - ny * r0).toFixed(1)}Z`);
    fbJet.style.opacity = (jAmp * 0.6).toFixed(3);
    fbWash.setAttribute("d", WH[2] > 0.02 ? ring(WH[0], WH[1], WH[3] * 1.4) : "");
    fbWash.style.opacity = Math.min(1, WH[2]).toFixed(3);
  }
  // readout
  const ph = PHASES[s.phase];
  readout.textContent = `${ph.name} · ${s.word}`;
  cell.phase.textContent = `${s.phase + 1} · ${ph.name}`;
  cell.kt.textContent = fmt(s.kt);
  cell.ft.textContent = fmt(s.ft);
  cell.noz.textContent = `${Math.round(s.nozzle)}°`;
  cell.fan.innerHTML = s.door < 0.03 ? "停转 · 舱门关闭" : s.fan < 0.04 ? "舱门打开中" : `${fmt(s.rpm)}<small>转/分</small>`;
  cell.kn.innerHTML = stovl && s.phase === 2
    ? `${fmt(s.kN)}<small>风扇 ${fmt(s.fanKN)} · 喷管 ${fmt(s.nozKN)} · 滚转喷口 ${fmt(s.postKN)}</small>`
    : stovl ? `${fmt(s.kN)}<small>短距起飞 · 最大干推力</small>` : `${fmt(s.kN)}<small>部分功率</small>`;
  trackFill.style.width = `${((T / CYCLE) * 100).toFixed(2)}%`;
  phaseBtns.forEach((b, i) => b.toggleAttribute("data-on", i === s.phase));
  if (s.phase !== lastPhase) {
    if (lastPhase !== -1) liveRegion.textContent = ph.name;
    lastPhase = s.phase;
  }
}
function ring(x, y, r) {
  const pts = [];
  for (let i = 0; i <= 40; i++) { const a = (i / 40) * Math.PI * 2; pts.push(at([x + Math.cos(a) * r, y + Math.sin(a) * r, 0])); }
  return "M" + pts.map((p) => p.map((v) => v.toFixed(1)).join(" ")).join("L") + "Z";
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  let moving = false;
  if (!calm) {
    moving = settle(fade, fadeTarget, dt, 0.06, false) || moving;
    if (pending !== null && fade.x < 0.02) { T = pending; pending = null; fadeTarget = 1; moving = true; }
  } else { fade.x = 1; }
  if (playing && !calm && pending === null) { T = (T + dt) % CYCLE; moving = true; }
  if (!calm) {
    const s = stateAt(T);
    fanPhase += dt * 4.2 * s.fan * (playing ? 1 : 0);
    clock += dt;
  }
  if (moving || dirty || playing) { draw(dt); dirty = false; }
  frame = visible && (moving || playing || pending !== null) ? requestAnimationFrame(tick) : 0;
}
function run() { dirty = true; if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } }
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
addEventListener("resize", () => run());
still.addEventListener?.("change", () => { if (still.matches) { setPlaying(false); T = PHASES[phaseOf(T)].key; } run(); });

playBtn.addEventListener("click", () => setPlaying(!playing));
phaseBtns.forEach((b) => b.addEventListener("click", () => {
  const i = Number(b.dataset.phase);
  jumpTo(still.matches || !playing ? PHASES[i].key : PHASES[i].start);
}));
stage.addEventListener("keydown", (event) => {
  const key = event.key;
  if (key === " " || key === "Enter") { event.preventDefault(); setPlaying(!playing); }
  else if (key === "1" || key === "2" || key === "3") { const i = Number(key) - 1; jumpTo(!playing || still.matches ? PHASES[i].key : PHASES[i].start); }
  else if (key === "ArrowRight" || key === "ArrowLeft") {
    event.preventDefault();
    setPlaying(false);
    T = (T + (key === "ArrowRight" ? 0.5 : -0.5) * (event.shiftKey ? 4 : 1) + CYCLE) % CYCLE;
    run();
  } else if (key === "Home") { event.preventDefault(); jumpTo(0); }
});
// drag across the stage scrubs through the phase on screen
let drag = null;
stage.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  const i = phaseOf(T);
  drag = { id: event.pointerId, i, x: event.clientX, moved: false };
});
stage.addEventListener("pointermove", (event) => {
  if (!drag || event.pointerId !== drag.id) return;
  if (!drag.moved && Math.abs(event.clientX - drag.x) < 4) return;
  if (!drag.moved) { drag.moved = true; try { stage.setPointerCapture(event.pointerId); } catch {} setPlaying(false); }
  const box = stage.getBoundingClientRect();
  const u = Math.min(1, Math.max(0, (event.clientX - box.left) / box.width));
  const ph = PHASES[drag.i];
  T = ph.start + u * (ph.end - ph.start - 0.01);
  run();
});
const endDrag = (event) => { if (drag && event.pointerId === drag.id) { try { stage.releasePointerCapture(event.pointerId); } catch {} drag = null; } };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
setPlaying(playing);
run();

}
// 一屏适配：说明浮层的上下边界、Esc/点外部收起、舞台尺寸变化时让渲染与 WebGL 重新对位
{
  const fig = document.querySelector(".f35-fit");
  const plate = fig && fig.querySelector(".iso-plate");
  const head = fig && fig.querySelector(".iso-plate-corners");
  const controls = fig && fig.querySelector(".f35-controls");
  const strip = fig && fig.querySelector(".f35-strip");
  const notes = fig && fig.querySelector(".f35-notes");
  const stage = fig && fig.querySelector(".f35-stage");
  const box = fig && fig.querySelector(".f35-box");
  if (fig && plate && notes) {
    const place = () => {
      // 浮层的定位容器：桌面为图卡，手机（图卡不定位）为整页，可用图卡上方的空白
      const host = getComputedStyle(plate).position === "static" ? plate.closest(".iso-page") : plate;
      const p = host.getBoundingClientRect();
      const top = host === plate ? head.getBoundingClientRect().bottom - p.top + 4 : 8;
      const below = Math.min(controls.getBoundingClientRect().top, strip.getBoundingClientRect().top);
      host.style.setProperty("--f35-ov-top", `${Math.max(0, top).toFixed(0)}px`);
      host.style.setProperty("--f35-ov-bot", `${Math.max(0, p.bottom - below + 6).toFixed(0)}px`);
      // 不支持容器查询单位的浏览器：用脚本算出舞台宽度
      if (!CSS.supports("width: 1cqh")) {
        const narrow = matchMedia("(max-width: 700px)").matches;
        const w = Math.min(box.clientWidth * (narrow ? 1.28 : 1), box.clientHeight * 1.6);
        stage.style.width = `${Math.floor(w)}px`;
      }
    };
    notes.addEventListener("toggle", place);
    notes.addEventListener("keydown", (e) => { if (e.key === "Escape" && notes.open) { notes.open = false; notes.querySelector("summary").focus(); } });
    document.addEventListener("pointerdown", (e) => { if (notes.open && !notes.contains(e.target)) notes.open = false; });
    let last = "";
    new ResizeObserver(() => {
      place();
      const r = stage.getBoundingClientRect();
      const key = `${r.width.toFixed(1)}x${r.height.toFixed(1)}`;
      if (key !== last) { last = key; dispatchEvent(new Event("resize")); }
    }).observe(box);
    addEventListener("resize", place);
    place();
  }
}
</script></body></html>
