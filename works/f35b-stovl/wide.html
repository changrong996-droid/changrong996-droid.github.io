/* ---- round 3: low-visibility F-35B scheme ----

.f35-ac, .fc-under-ac, .fc-door-ac {
  --anatomy-top: #b3b7ba; --anatomy-shade-3: #a5a9ad; --anatomy-shade-2: #979ba0; --anatomy-shade-1: #8a8e93; --anatomy-shade-0: #7c8085;

  --f35-glass-0: #6f6b5f; --f35-glass-1: #7b776b; --f35-glass-2: #878377; --f35-glass-3: #949084; --f35-glass-4: #a29e92;
}

/* ---- 一屏适配（fit-viewport）：整页恰好一屏，无页面滚动；图形按宽高同时等比缩放 ---- */
html, body.iso { height: 100%; overflow: hidden; }
body.iso .iso-page { width: 100%; max-width: 1640px; height: 100vh; height: 100dvh; margin: 0 auto; padding: 10px 14px; display: flex; flex-direction: column; }
.f35-fit.iso-figure { margin: 0; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.f35-fit .iso-plate { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 9px 14px 10px; overflow: hidden; }

/* 标题行：图号、标题、操作提示、实时读数排成一行（不再绝对定位到四角） */
.f35-fit .iso-plate-corners { position: static; inset: auto; display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 14px; margin: 0 0 7px; flex: none; }
.f35-fit .iso-plate-corner { position: static; white-space: nowrap; }
.f35-fit .iso-plate-corner[data-corner="hint"] { margin-left: auto; max-width: none; }
.f35-fit .iso-plate-corner[data-corner="readout"] { min-width: 9em; text-align: right; }

/* 图形区：占满剩余高度；舞台保持 1280:800，取宽、高两者中较紧的一边 */
.f35-box { position: relative; flex: 1 1 auto; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.f35-fit .f35-stage { flex: none; width: 100%; aspect-ratio: 1280 / 800; margin: 0; }
@supports (width: 1cqh) { .f35-fit .f35-stage { width: min(100cqw, 160cqh); } }
.f35-fit .fc-mm { width: clamp(96px, 16.4%, 210px); }
.f35-fit .fc-under { width: clamp(180px, 31.25%, 400px); }
.f35-fit .fc-door { width: clamp(130px, 20.3%, 260px); }

/* 读数条与控件：紧凑 */
.f35-fit .f35-strip { margin: 8px 0 0; flex: none; }
.f35-fit .f35-cell { padding: 4px 9px 5px; gap: 2px; }
.f35-fit .f35-cell-k { font-size: 10.5px; }
.f35-fit .f35-cell-v { font-size: 14px; line-height: 1.2; }
.f35-fit .f35-controls { margin-top: 8px; gap: 6px; flex: none; }
.f35-fit .f35-btn { padding: 6px 11px; }

/* 图注与说明：默认收起，展开时浮在图形上方，不推动布局 */
.f35-notes { display: block; flex: none; }
.f35-notes > summary { list-style: none; }
.f35-notes > summary::-webkit-details-marker { display: none; }
.f35-notes > summary::marker { content: ""; }
.f35-notes-chev { width: 6px; height: 6px; border-right: 1.2px solid currentColor; border-bottom: 1.2px solid currentColor; transform: translateY(1px) rotate(-135deg); transition: transform .25s var(--anatomy-ease); }
.f35-notes[open] > summary { color: var(--anatomy-strong); box-shadow: var(--anatomy-lift), inset 0 0 0 1px var(--anatomy-mid); }
.f35-notes[open] .f35-notes-chev { transform: translateY(-2px) rotate(45deg); }
.f35-notes-body { position: absolute; z-index: 6; left: 0; right: 0; margin: 0 auto; width: min(780px, 100% - 28px);
  top: var(--f35-ov-top, 40px); bottom: var(--f35-ov-bot, 60px); display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
.f35-notes-panel { pointer-events: auto; max-height: 100%; overflow: auto; overscroll-behavior: contain; background: color-mix(in srgb, var(--anatomy-card) 96%, transparent); box-shadow: 0 0 0 1px var(--anatomy-faint), 0 8px 24px -10px #0000002e; border-radius: 4px; padding: 12px 16px 13px; }
.f35-fit .f35-notes-panel.iso-legend { margin: 0; gap: 7px; font-size: 12.5px; line-height: 1.65; }
.f35-notes-panel .iso-caption { margin: 0; }
.f35-notes-ops { margin: 0; color: var(--anatomy-muted); font-size: 11.5px; }
.f35-notes-head { font-size: 11.5px; letter-spacing: .06em; color: var(--anatomy-text); }
@media (prefers-reduced-motion: reduce) { .f35-notes-chev { transition: none; } }

/* 中等宽度：读数条两行三列也可 */
@media (max-width: 860px) and (min-width: 701px) { .f35-fit .f35-cell-v { font-size: 13px; } }

/* 手机：上下堆叠；舞台按原设计放大到 128% 并在图形区内裁切；整组内容垂直居中 */
@media (max-width: 700px) {
  body.iso .iso-page { padding: 8px; justify-content: center; position: relative; }
  .f35-fit.iso-figure { flex: 0 1 auto; }
  .f35-fit .iso-plate { flex: 0 1 auto; padding: 8px 10px 9px; position: static; }
  .f35-fit .iso-plate-corner[data-corner="hint"] { display: none; }
  .f35-fit .iso-plate-corner[data-corner="title"] { margin-right: auto; }
  .f35-fit .iso-plate-corner[data-corner="readout"] { min-width: 0; flex: 1 0 100%; text-align: left; }
  .f35-box { flex: 0 1 auto; height: calc((100vw - 36px) * .8); }
  .f35-fit .f35-stage { width: 128%; margin-left: 0; }
  @supports (width: 1cqh) { .f35-fit .f35-stage { width: min(128cqw, 160cqh); } }
  .f35-fit .f35-cell { padding: 5px 7px 6px; }
  .f35-fit .f35-btn { padding: 6px 9px; }
  .f35-notes-body { width: calc(100% - 16px); }
  .f35-notes-panel { box-shadow: 0 0 0 1px var(--anatomy-mid), 0 8px 24px -10px #0000003a; }
}
@media (max-height: 560px) { .f35-fit .f35-cell { padding: 3px 8px 4px; } .f35-fit .f35-controls, .f35-fit .f35-strip { margin-top: 5px; } }

5-btn xr-btn" data-xray aria-pressed="false" aria-label="透视：关。按下显示机体内部的升力系统（X）"><span class="xr-icon" aria-hidden="true"></span><span>透视<span class="xr-colon">：</span><span data-xray-state>关</span></span><span class="f35-num">X</span></button><span class="f35-track" aria-hidden="true"><span class="f35-track-fill"></span><span class="f35-tick" style="left:0.00%"></span><span class="f35-tick" style="left:25.93%"></span><span class="f35-tick" style="left:44.56%"></span></span><details class="f35-notes"><summary class="f35-btn f35-notes-btn" aria-controls="f35-notes" title="展开或收起图注与说明（Esc 收起）"><span class="f35-notes-chev" aria-hidden="true"></span>说明</summary><div class="f35-notes-body" id="f35-notes"><div class="f35-notes-panel iso-legend" role="region" aria-label="图注与说明"><span class="f35-notes-head">图 1 · F-35B 短距起飞/垂直降落循环</span><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>三轴承旋转喷管</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>机体、舱门与起落架</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>的里雅斯特号飞行甲板与 12° 滑跃甲板</span></span><p class="iso-caption" id="f35-caption">F-35B：机长 15.6 米，翼展 10.7 米。短距起飞/垂直降落模式下，F135-PW-600 发动机经传动轴驱动座舱后方直径 50 英寸的两级升力风扇（冷推力约 89 千牛），三轴承旋转喷管 2.5 秒内可下偏至 95°（热推力约 80 千牛），并从外涵引气至两侧机翼内的滚转喷口（每侧约 8.7 千牛）；短距起飞推力为 181 千牛，喷管偏转时不能开加力。本图甲板滑跑 67 米至 12° 滑跃甲板末端，离舰时相对甲板约 48 节，另加 20 节甲板风。垂直降落先在舷侧 40 英尺高度悬停，横移到降落点上方，以约 5 英尺/秒下降，接地前减至 3 英尺/秒。15 米以上的高度按压缩比例绘制，250 节的通场放慢约 6 倍以便观看，空速含 20 节甲板风，传动轴转速为估计值（离合器在最高约 8,500 转/分时接合）。</p><p class="f35-notes-ops">舰船：意大利海军「的里雅斯特号」两栖攻击舰（L 9890，LHD，带坞舱的两栖攻击舰，不是航空母舰）。全长 245 米；全通式飞行甲板长 230 米、宽 36 米（约 7,400 平方米），舰艏左舷为 12° 滑跃甲板；型深 27.7 米、吃水 7.2 米，飞行甲板高出水线约 20.5 米。右舷舰岛分为前后两座：前舰岛是航海舰桥和平台指挥中心（舷号 L 9890），顶部是旋转的 Kronos Power Shield L 波段有源相控阵对空搜索雷达，另有四面固定的 Kronos StarFire X 波段雷达阵面；后舰岛是飞行管制塔，玻璃窗朝向甲板，上面立着通信与电子战桅杆；后舰岛之后两舷各有一部 15 × 15 米的舷侧升降机（展开时全宽 55 米）。甲板左舷 6 个、右舷 3 个起降点（含舰艏右舷的搜救起降点），舰艉是坞舱门。武器为 3 门莱昂纳多 76/62 毫米「超快速」舰炮（舰艏左右舷各 1 门、舰艉 1 门，各配 NA-30S Mk2 火控指挥仪）、3 座 KBA 25 毫米遥控炮和 2 具 ODLS-20 诱饵发射器；右舷预留的垂直发射装置尚未安装，图中不画。舰岛、桅杆、舷台和炮位的位置与高度按照片简化绘制，StarFire 阵面画在前舰岛上层四角、排烟格栅位置均为估计，起降点编号仅为示意。该舰的舰载机包括 AW101、NH90（意大利海军编号 SH90A）、AW129D 直升机和 F-35B 战斗机；甲板上停放了一架 AW101 和一架 SH90A（旋翼向后折叠）、后舰岛旁一架 F-35B，以及一辆牵引车、一辆消防车和几名穿不同颜色背心的甲板人员——停放位置、朝向和车辆外观均为示意，全部在右舷后部，避开 F-35B 的滑跑道、悬停点和尾焰。舰艉是铰接在底边的坞舱跳板门；艉部舷侧的舰名「TRIESTE」照片上见于右舷，左舷按对称画出。</p><p class="f35-notes-ops">透视（X）：机体蒙皮半透明，显示升力系统——F135 发动机、传动轴（带两个挠性联轴节）、离合器、锥齿轮箱、升力风扇（两级对转）和两侧滚转管路；以及进气系统——两侧进气道（DSI，无附面层隔道的鼓包进气口）、向内向上弯折并在发动机风扇前汇合的 S 形进气道（从正前方看不到风扇面，利于隐身）、升力风扇门后方的辅助进气口及其通往进气道汇合段的短管，和发动机核心机外的外涵道（滚转管路的气源）。升力风扇工作时离合器接合，传动轴随之转动；常规飞行时离合器分离，传动轴静止；滚转喷口工作时管路内显示气流；发动机运转时进气道内始终有气流（随油门加快），辅助进气门打开时辅助进气管内显示气流。</p><p class="f35-notes-ops">操作：空格 播放，1–3 阶段，X 透视，←→ 步进，拖动。</p></div></div></details></div><span class="f35-sr" aria-live="polite" data-live></span></div></figure></main><script type="module">const AZIMUTH = 45;

    state.v = 0;

// a thin lifting surface: root and tip chords (3D), a thickness normal, an airfoil-like section
// us: chord stations (0 = leading edge, 1 = trailing edge); vs: span stations. Root left open (it is buried).
function foilMesh({ rootLE, rootTE, tipLE, tipTE, up, thick: [tr, tt], us, vs, camber = 0.62, rootFix = null }) {
  const n = V3.unit(up);
  const nu = us.length;
  const tdist = (u) => (u <= 0 || u >= 1 ? 0 : (Math.sqrt(u) * (1 - u)) / 0.385);
  const rings = [], centres = [];
  for (const vv of vs) {
    const le = V3.add(V3.mul(rootLE, 1 - vv), V3.mul(tipLE, vv)), te = V3.add(V3.mul(rootTE, 1 - vv), V3.mul(tipTE, vv));
    const th = lerp(tr, tt, vv);
    const mid = (u) => V3.add(V3.mul(le, 1 - u), V3.mul(te, u));
    const ring = [];
    for (let i = 0; i < nu; i++) ring.push(V3.add(mid(us[i]), V3.mul(n, tdist(us[i]) * th * camber)));
    for (let i = nu - 2; i >= 1; i--) ring.push(V3.sub(mid(us[i]), V3.mul(n, tdist(us[i]) * th * (1 - camber))));
    rings.push(vv === 0 && rootFix ? ring.map(rootFix) : ring); centres.push(mid(0.4));
  }
  const L = loftRings(rings, centres, { capEnd: true });
  // faces: fix the winding by which skin they are on (centres lie in the mid-plane, so loftRings' test is weak at the edges)
  const R = rings[0].length;
  L.f.forEach((face, fi) => {
    if (face.length === R) return;
    const pts = face.map((k) => L.v[k]);
    const idx = face.map((k) => (k - L.base[0]) % R);
    const top = idx.every((i) => i <= nu - 1);
    const want = top ? n : V3.mul(n, -1);
    if (V3.dot(newell(pts), want) < 0) L.f[fi] = face.slice().reverse();
  });
  const topLine = (iu, v0 = 0, v1 = vs.length - 1) => alongX(L, iu, v0, v1);
  const botLine = (iu, v0 = 0, v1 = vs.length - 1) => alongX(L, R - iu, v0, v1);
  return { v: L.v, f: L.f, L, R, nu, topLine, botLine, rootBoundary: true };
}

const BOOM = { y: 1.08 };
const WING_US = [0, 0.025, 0.08, 0.16, 0.3, 0.45, 0.6, 0.72, 0.8, 0.9, 1];
const WING_VS = [0, 0.15, 0.35, 0.55, 0.75, 0.9, 1];
// Roll posts: bypass air ducted to a downward nozzle in each wing root, just outboard of the main-gear bays

function postDoor(side, z) {

function boomMesh(side) {

  const keys = [[-7.42, 0.09, 0.1, 0.16, 0.03], [-7.1, 0.15, 0.1, 0.24, -0.06], [-6.75, 0.19, 0.1, 0.31, -0.16], [-6.4, 0.2, 0.1, 0.37, -0.25]];

    for (let k = 1; k <= NUb; k++) { const y = w * Math.cos((k / NUb) * Math.PI / 2); pts.push([k === NUb ? 0 : y, upperZ(st, y)]); }

// ---- Round 3 geometry: fins with rudders, moving stabilators, shell doors, round gear, markings ---------------
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const tdist = (u) => (u <= 0 || u >= 1 ? 0 : (Math.sqrt(u) * (1 - u)) / 0.385);
const ekey = (a, b) => (a < b ? a + "," + b : b + "," + a);

// A lifting surface over a chord range [us[0], us[last]] of a symmetric section (full thickness th at the
// thickest point). A range that stops short of the leading or trailing edge closes with a flat face across the
// thickness (the rudder hinge face). Faces are wound by which skin they lie on; topFace/botFace(r, i) name the
// face of span strip r between chord stations i and i+1 on each skin (for the radar-absorbent edge bands).
function foilRange({ rootLE, rootTE, tipLE, tipTE, up, thick: [tr, tt], us, vs, capRoot = false, camber = 0.5 }) {
  const n = V3.unit(up);
  const nu = us.length;
  const z0 = tdist(us[0]) === 0, z1 = tdist(us[nu - 1]) === 0;
  const tag = [];
  const rings = [], centres = [];
  vs.forEach((vv, r) => {
    const le = lerp3(rootLE, tipLE, vv), te = lerp3(rootTE, tipTE, vv);
    const th = lerp(tr, tt, vv);
    const mid = (u) => lerp3(le, te, u);
    const ring = [];
    for (let i = 0; i < nu; i++) { ring.push(V3.add(mid(us[i]), V3.mul(n, tdist(us[i]) * th * camber))); if (!r) tag.push((i === 0 && z0) || (i === nu - 1 && z1) ? "E" : "T"); }
    for (let i = nu - 1; i >= 0; i--) {
      if ((i === nu - 1 && z1) || (i === 0 && z0)) continue;
      ring.push(V3.sub(mid(us[i]), V3.mul(n, tdist(us[i]) * th * (1 - camber)))); if (!r) tag.push("B");
    }
    rings.push(ring); centres.push(mid((us[0] + us[nu - 1]) / 2));
  });
  const L = loftRings(rings, centres, { capEnd: true, capStart: capRoot });
  const R = rings[0].length;
  const chord = V3.unit(V3.sub(lerp3(rootTE, tipTE, 0.5), lerp3(rootLE, tipLE, 0.5)));
  const strips = (vs.length - 1) * R;
  L.f.forEach((face, fi) => {
    if (fi >= strips) return; // tip / root caps: loftRings already wound them
    const j = fi % R, j1 = (j + 1) % R;
    const a = tag[j], b = tag[j1];
    let want;
    if ((a === "T" || a === "E") && (b === "T" || b === "E") && !(a === "E" && b === "E")) want = n;
    if ((a === "B" || a === "E") && (b === "B" || b === "E") && !(a === "E" && b === "E")) want = V3.mul(n, -1);
    if ((a === "T" && b === "B") || (a === "B" && b === "T")) want = j === nu - 1 ? chord : V3.mul(chord, -1);
    if (a === "T" && b === "T") want = n;
    if (a === "B" && b === "B") want = V3.mul(n, -1);
    const pts = face.map((k) => L.v[k]);
    if (want && V3.dot(newell(pts), want) < 0) L.f[fi] = face.slice().reverse();
  });

  const topLine = (iu, v0 = 0, v1 = vs.length - 1) => alongX(L, iu, v0, v1);
  const botLine = (iu, v0 = 0, v1 = vs.length - 1) => alongX(L, iu === 0 && z0 ? 0 : bIdx(iu), v0, v1);
  return { v: L.v, f: L.f, L, R, nu, topFace, botFace, topLine, botLine, rings: vs.length };
}
// radar-absorbent edge bands: the leading-edge strips (first `le` chord cells) and trailing-edge strips (last `te`)
function ramBands(m, le, te) {
  const out = new Set();
  for (let r = 0; r < m.rings - 1; r++) {
    for (let i = 0; i < le; i++) { out.add(m.topFace(r, i)); out.add(m.botFace(r, i)); }
    for (let i = m.nu - 1 - te; i < m.nu - 1; i++) { out.add(m.topFace(r, i)); out.add(m.botFace(r, i)); }
  }
  return out;
}

// A curved panel with real thickness: outer skin surf(u, v), inner skin offset `thick` along -normal, side walls.
// inner: the faces of the inner skin (drawn darker); edge: the outer-skin cells round the rim (edge treatment).
function shellMesh(surf, us, vs, thick, outward) {
  const NU = us.length, NV = vs.length;
  const v = [], f = [], want = [];
  const nrmAt = (u, w) => {
    const e = 1e-3;
    const du = V3.sub(surf(Math.min(1, u + e), w), surf(Math.max(0, u - e), w));
    const dv = V3.sub(surf(u, Math.min(1, w + e)), surf(u, Math.max(0, w - e)));
    let n = V3.unit(V3.cross(du, dv));
    if (V3.dot(n, outward) < 0) n = V3.mul(n, -1);
    return n;
  };
  const T = (i, j) => i * NV + j, B = (i, j) => NU * NV + i * NV + j;
  for (const u of us) for (const w of vs) v.push(surf(u, w));
  for (const u of us) for (const w of vs) v.push(V3.sub(surf(u, w), V3.mul(nrmAt(u, w), thick)));
  const inner = new Set(), edge = new Set();
  for (let i = 0; i < NU - 1; i++) for (let j = 0; j < NV - 1; j++) {
    const n = nrmAt((us[i] + us[i + 1]) / 2, (vs[j] + vs[j + 1]) / 2);
    f.push([T(i, j), T(i + 1, j), T(i + 1, j + 1), T(i, j + 1)]); want.push(n);
    if (i === 0 || j === 0 || i === NU - 2 || j === NV - 2) edge.add(f.length - 1);
    f.push([B(i, j), B(i, j + 1), B(i + 1, j + 1), B(i + 1, j)]); want.push(V3.mul(n, -1)); inner.add(f.length - 1);
  }
  const mid = surf(0.5, 0.5);
  const wall = (a, b) => { f.push([a[0], a[1], b[1], b[0]]); const c = centroid([v[a[0]], v[a[1]]]); want.push(V3.sub(c, mid)); };
  for (let j = 0; j < NV - 1; j++) { wall([T(0, j), T(0, j + 1)], [B(0, j), B(0, j + 1)]); wall([T(NU - 1, j), T(NU - 1, j + 1)], [B(NU - 1, j), B(NU - 1, j + 1)]); }
  for (let i = 0; i < NU - 1; i++) { wall([T(i, 0), T(i + 1, 0)], [B(i, 0), B(i + 1, 0)]); wall([T(i, NV - 1), T(i + 1, NV - 1)], [B(i, NV - 1), B(i + 1, NV - 1)]); }
  f.forEach((face, fi) => { if (V3.dot(newell(face.map((k) => v[k])), want[fi]) < 0) f[fi] = face.slice().reverse(); });
  return { v, f, inner, ram: edge, nrmAt, T, NU, NV };
}

// a ring torus (the tyre): major radius R0 to the tube centre, radial half-height rr, half-width hw along the axle
function torus(c, axis, R0, rr, hw, nT = 24, nP = 10) {
  const a = V3.unit(axis);
  const e1 = V3.unit(V3.cross(a, Math.abs(a[2]) > 0.9 ? [1, 0, 0] : [0, 0, 1])), e2 = V3.cross(a, e1);

function auxDoorBase(side) {

        if (p.name === "gear.hub") opt.rel = { to: [g.id + ".tyre"], d: 0.02, side: X.Ld([0, p.hubSide, 0]) };
        if (p.name === "gear.fork") opt.rel = { to: [g.id + ".tyre"], d: 0.03, side: X.Ld([0, p.forkSide, 0]) };
        add(p.name, opt.mesh, opt);
      }
      // chrome piston from the gland nut to the lower collar: exposed length = loaded length + stroke
      {
        const e = OLEO * (g.side ? s.oleoM ?? 1 : s.oleoN ?? 1), L = R.Lo0 + e;
        const T = R.oleoT || (R.oleoT = (() => { const t = latheAlong([0, 0, 0], [0, 0, -1], [[0, 1], [0.5, 1], [0.6, 1.3], [1, 1.3]], 12); edgesOf(t); cornerGroups(t); return t; })());
        const m = latheAlong(X.U(R.knee), X.Lo(R.bot), [[0, g.ro], [L - 0.07, g.ro], [L - 0.06, g.ro * 1.35], [L, g.ro * 1.35]], 12);
        m._edges = T._edges; m._groups = T._groups; m._gid = T._gid;
        add("gear.oleo", m, { tone: "hi", cls: "chrome", id: g.id + ".oleo", bias: -45 });
      }
      // torque links: upper lug turns with the steering collar, lower lug rides the piston; the apex keeps arm length
      const ua = X.Lo(V3.sub(R.ua, V3.mul(R.ax, OLEO * (g.side ? s.oleoM ?? 1 : s.oleoN ?? 1))));
      const la = X.Lo(R.la);
      const aft = X.Ld([-1, 0, 0]);
      const mid = lerp3(ua, la, 0.5), half = V3.len(V3.sub(la, ua)) / 2;
      const apex = V3.add(mid, V3.mul(aft, Math.sqrt(Math.max(0, R.lk * R.lk - half * half))));
      const lrel = { to: [g.id + ".oleo", g.id + ".strut"], d: 0.01, side: aft };
      add("gear.link", grod(ua, apex, 0.02, 6), { tone: "mid", bias: -45, rel: lrel });
      add("gear.link", grod(apex, la, 0.02, 6), { tone: "mid", bias: -45, rel: lrel });
      // drag brace: fixed airframe end, strut end moves with the leg, the knee folds between them
      const S = X.U(R.S0);
      const fwdSide = X.Ud([1, 0, 0]);
      const J = braceJoint3(g.brace, S, R.l, [0, 0, 1]); // knee breaks upward, into the bay
      add("gear.brace", grod(g.brace, J, 0.034, 8), { tone: "mid", bias: -45, rel: { to: [g.id + ".strut"], d: 0.02, side: fwdSide } });
      add("gear.brace", grod(J, S, 0.03, 8), { tone: "mid", bias: -45, rel: { to: [g.id + ".strut"], d: 0.02, side: fwdSide } });
      if (g.sideBrace) { // side brace breaks upward at its knee; the lock link folds first and leads it
        const T = X.U(R.T0), K = braceJoint3(g.sideBrace, T, R.sl, [0, 0, 1]);
        const inSide = [0, -g.side, 0];
        add("gear.brace", grod(g.sideBrace, K, 0.03, 8), { tone: "mid", bias: -45, rel: { to: [g.id + ".strut"], d: 0.015, side: inSide } });
        add("gear.brace", grod(K, T, 0.028, 8), { tone: "mid", bias: -45, rel: { to: [g.id + ".strut"], d: 0.015, side: inSide } });
        const Lk = R.L0, LJ = braceJoint3(K, Lk, R.ll, [-1, 0, -0.3]);
        add("gear.link", grod(K, LJ, 0.018, 6), { tone: "mid", bias: -45, rel: { to: [g.id + ".strut"], d: 0.012, side: inSide } });
        add("gear.link", grod(LJ, Lk, 0.018, 6), { tone: "mid", bias: -45, rel: { to: [g.id + ".strut"], d: 0.012, side: inSide } });
      }
      add = add0;
    }
  }
  // doors: the main doors and nose leaves hang open with the leg down (nose leaves swing a further 6° before it
  // moves) and close once it is stowed; the main bays' inboard leaves open before the leg moves and shut after
  const mAng = 62 * (1 - q.close), nAng = (84 + 6 * q.over) * (1 - q.close);
  const lAng = 80 * smooth(0.0, 0.1, q.r) * (1 - q.close);
  const open = Math.min(1, mAng / 62);
  if (lAng > 0.1) for (const side of [1, -1]) {
    const k = side > 0 ? "port" : "stbd", ld = B["gdoor.leaf." + k], m = side > 0 ? "mp" : "ms";
    add("gear.door", rotMesh(ld, ld.hinge, [1, 0, 0], -side * lAng * D2R), { tone: "mid", bias: -45, smooth: true, rel: { to: [m + ".tyre", m + ".strut", m + ".oleo"], d: 0.06, side: [0, -side, 0] } });
    const outline = ld.outline.map((p) => V3.add(p, [0, 0, 0.006]));
    add("gear.well", { v: [], f: [], custom: (ctx) => {
      if (V3.dot(V3.unit(ctx.dW([0, 0, -1])), ctx.V) <= 0.02) return "";
      return `<g class="ac-part" opacity="${smooth(0, 30, lAng).toFixed(2)}"><path class="ac-cav" d="${ctx.path(outline.map(ctx.pr))}"/></g>`;
    } }, { bias: -45.5, at: [0.2, side * 0.83, -0.7], rel: wellRel(m) });
  }
  if (open > 0.002) {
    for (const side of [1, -1]) {
      const k = side > 0 ? "port" : "stbd";
      const md = B["gdoor.main." + k];
      add("gear.door", rotMesh(md, md.hinge, [1, 0, 0], side * mAng * D2R), { tone: "mid", bias: -45, smooth: true, rel: { to: ["tyre", "strut", "oleo"].map((n) => (side > 0 ? "mp." : "ms.") + n), d: 0.06, side: [0, side, 0] } });
      const nd = B["gdoor.nose." + k];
      add("gear.door", rotMesh(nd, nd.hinge, [1, 0, 0], side * nAng * D2R), { tone: "mid", bias: -45, smooth: true, rel: { to: ["ng.tyre", "ng.strut", "ng.oleo"], d: 0.06, side: [0, side, 0] } });
      // the well behind each open door: dark, on the lower skin, only from a camera that sees the belly
      const outline = md.outline.map((p) => V3.add(p, [0, 0, 0.006]));
      add("gear.well", { v: [], f: [], custom: (ctx) => {
        const nW = V3.unit(ctx.dW([0, side * 0.45, -1]));
        if (V3.dot(nW, ctx.V) <= 0.02) return "";
        return `<g class="ac-part" opacity="${smooth(0.0, 0.5, open).toFixed(2)}"><path class="ac-cav" d="${ctx.path(outline.map(ctx.pr))}"/></g>`;
      } }, { bias: -45.5, at: [0.12, side * 1.3, -0.7], rel: wellRel(side > 0 ? "mp" : "ms") });
    }
    const nOut = [];
    for (let i = 0; i <= 8; i++) { const x = lerp(6.5, 4.4, i / 8); nOut.push([x, 0.235, skinZ(x, 0.235, false) - 0.002]); }
    for (let i = 8; i >= 0; i--) { const x = lerp(6.5, 4.4, i / 8); nOut.push([x, -0.235, skinZ(x, -0.235, false) - 0.002]); }
    add("gear.well", { v: [], f: [], custom: (ctx) => {
      if (V3.dot(V3.unit(ctx.dW([0, 0, -1])), ctx.V) <= 0.02) return "";
      return `<g class="ac-part" opacity="${smooth(0.0, 0.5, open).toFixed(2)}"><path class="ac-cav" d="${ctx.path(nOut.map(ctx.pr))}"/></g>`;
    } }, { bias: -45.5, at: [5.4, 0, -0.5], rel: wellRel("ng") });
  }
  // seam of the shut inboard leaf on the lower skin beside the open bay (leg down): drawn just over the fuselage,
  // only from a camera that sees the belly. (With the bay closed neither door's seam is drawn, as before.)
  if (lAng <= 0.1 && open > 0.002) for (const side of [1, -1]) {
    const loops = [B["gdoor.leaf." + (side > 0 ? "port" : "stbd")].outline];
    add("gear.seam", { v: [], f: [], custom: (ctx) => {
      if (V3.dot(V3.unit(ctx.dW([0, 0, -1])), ctx.V) <= 0.02) return "";
      const d = loops.map((o) => "M" + o.map((p) => { const q = ctx.pr(p); return q[0].toFixed(2) + " " + q[1].toFixed(2); }).join("L") + "Z").join("");
      return `<path class="iso-line" data-tone="lo" d="${d}"/>`;
    } }, { at: [0.15, side * 1.1, -0.7], rel: { to: ["fuselage"], d: 0.004, side: [0, 0, -1] } });
  }
}

// depth order: centroid along the view + bias, then parts that hang on others (fillets, wheels, hubs, links,
// braces, gear doors) are placed just after the parts they name when their own side faces the camera, else just
// before. One rule for both renderers and for the underside camera.
function orderParts(drawn, V, dW) {
  const by = new Map();
  for (const d of drawn) if (d.part.id) by.set(d.part.id, d);
  for (let pass = 0; pass < 2; pass++) for (const d of drawn) {
    const r = d.part.rel; if (!r) continue;
    const vis = r.side ? V3.dot(dW(r.side), V) > 0 : true;
    const pool = (vis || !r.hidTo ? r.to : r.hidTo).map((id) => by.get(id)).filter(Boolean);
    if (!pool.length) continue;
    d.key = vis ? Math.max(...pool.map((b) => b.key)) + r.d : Math.min(...pool.map((b) => b.key)) - r.d;
  }
  drawn.sort((a, b) => a.key - b.key);
  return drawn;
}

// moving parts for a state, in body metres
function movingParts(s) {
  const parts = [];
  const add = (name, mesh, opt = {}) => parts.push({ name, mesh, ...opt });
  // lift-fan upper door (shell, rams, hinge) and aux inlet doors: shared with the follow view
  doorParts(s, add);
  // the fan well and blades under it
  const doorZ = topAt(1.9) + 0.02;
  if (s.door > 0.02) add("fan.well", fanWell(s, doorZ - 0.03), { bias: 7, flat: true, alpha: smooth(0.02, 0.35, s.door) });
  // lower lift-fan doors: hinged on their outer edges, swing down 80 deg
  for (const side of [1, -1]) {
    const z = -0.8;
    const low = plate([[2.75, side * 0.12, z], [2.75, side * 0.62, z], [0.95, side * 0.62, z], [0.95, side * 0.12, z]], [0, 0, 1], 0.04);
    add("door.lower", rotMesh(low, [0, side * 0.62, z], [1, 0, 0], side * s.door * 82 * D2R), { tone: "mid", bias: -40 });
  }
  // roll-post doors under each wing
  for (const side of [1, -1]) {
    const z = wingBottomZ(POST.x, POST.y) - 0.018;
    if (s.posts > 0.02) add("post.nozzle", postNozzle(side, z), { tone: "mid", bias: -21, cls: "xr-keep" });
    add("door.post", rotMesh(postDoor(side, z), [0, side * POST.hingeY, z], [1, 0, 0], side * s.posts * 70 * D2R), { tone: "mid", bias: -20 });
  }
  // landing gear, gear doors and wells; stabilators and rudders
  gearParts(s, add);
  controlSurfaceParts(s, add);
  // three-bearing swivel module: three segments on a bend of s.nozzle degrees, then the exit petals
  const noz = nozzleGeometry(s.nozzle);
  noz.segments.forEach((seg, i) => add(`nozzle.${i}`, seg, { tone: "hi", lit: true, bias: 3 + i * 0.01, seams: true, smooth: true, cls: "xr-keep" }));
  return { parts, noz };
}

function nozzleGeometry(deg) {
  const th = Math.max(1e-4, deg * D2R);
  const base = [-6.42, 0, 0.04];
  const L = [0, 0.42, 0.82, 1.22, 1.45];
  const radius = [0.62, 0.6, 0.57, 0.54, 0.47];
  const Ltot = L[3];
  const R = Ltot / th;
  const at = (s) => { const f = s / R; return [V3.add(base, [-R * Math.sin(f), 0, -R * (1 - Math.cos(f))]), [-Math.cos(f), 0, -Math.sin(f)]]; };
  const rings = [];
  for (let i = 0; i < 4; i++) { const [c, d] = at(L[i]); rings.push({ c, axis: d, r: radius[i] }); }
  const exitDir = rings[3].axis;
  const exitC = V3.add(rings[3].c, V3.mul(exitDir, L[4] - L[3]));
  const segs = [];
  const SIDES = 28;
  for (let i = 0; i < 3; i++) segs.push(tube([rings[i], rings[i + 1]], SIDES));
  // exit petals: converging, with the sawtooth (serrated) trailing edge of the production nozzle
  const midC = V3.add(rings[3].c, V3.mul(exitDir, (L[4] - L[3]) * 0.55));
  const petals = tube([rings[3], { c: midC, axis: exitDir, r: (radius[3] + radius[4]) / 2 + 0.01 }, { c: exitC, axis: exitDir, r: radius[4] }], SIDES, { capEnd: true });
  for (let i = 0; i < SIDES; i++) if (i % 2) { const k = 2 * SIDES + i; petals.v[k] = V3.sub(petals.v[k], V3.mul(exitDir, 0.1)); }
  segs.push(petals);
  return { segments: segs, exit: exitC, dir: exitDir, r: radius[4] };
}

function fanWell(s, z) {
  // an elliptical opening (the fan face) with blades, flat in the door's plane
  const c = [1.92, 0, z], r = 0.56;
  const v = [], f = [[]];
  const N = 28;
  for (let i = 0; i < N; i++) { const a = (i / N) * Math.PI * 2; v.push([c[0] + Math.cos(a) * r * 1.02, Math.sin(a) * r, z]); f[0].push(i); }
  return { v, f, fan: { c, r, phase: s.fanPhase || 0 } };
}

// ---- X-ray view (interactive round 4): the LiftSystem inside the airframe ------------------
// Drawn only when the page's 「透视」 toggle is on (opts.xray.x > 0); both renderers add these parts to their depth
// sort, so they order with the opaque 3BSM, roll-post nozzles and fan bay, while the CSS draws the skin translucent.
// Stations come from the airframe already modelled: the lift-fan bay (fan centre x 1.92, casing radius 0.6, under the
// door), the engine fan face just aft of the auxiliary inlet doors (x -0.3) and the 3BSM flange (x -6.42, z 0.04),
// the roll-post nozzles at POST. The drive shaft runs forward from the engine fan (LP spool) to a clutch and then a
// bevel gearbox mounted on the aft face of the LiftFan casing (Rolls-Royce LiftFan layout). The two-stage fan
// counter-rotates inside the casing. Bypass air leaves the engine's fan duct on each side and runs out through the
// wing root to the roll-post nozzle.
const XRAY = {
  fan: { x: 1.92, r: 0.6, top: 0.9, bot: -0.06, z1: 0.66, z2: 0.36 },
  eng: { x0: -0.3, x1: -6.4, z0: 0.12, z1: 0.04 },
  gear: { x0: 1.1, x1: 1.31 }, // bevel gearbox housing against the casing's aft face (x = 1.92 - 0.6)
  clutch: { x0: 0.88, x1: 1.1, gap: 0.045 },
};
const engZ = (x) => lerp(XRAY.eng.z0, XRAY.eng.z1, (XRAY.eng.x0 - x) / (XRAY.eng.x0 - XRAY.eng.x1));
// shaft axis: from the engine fan hub to the gearbox input, rising gently to the fan's mid-height
const SH_A = [XRAY.eng.x0, 0, XRAY.eng.z0];
const SH_G = [1.21, 0, 0.44];
const SH_D = V3.unit(V3.sub(SH_G, SH_A));
const onShaft = (x) => V3.add(SH_A, V3.mul(SH_D, (x - SH_A[0]) / SH_D[0]));
const shRing = (x, r) => ({ c: onShaft(x), axis: SH_D, r });
// roll-post duct centreline (one side): off the fan duct, out along the wing root's thickest part, down into the post
function ductLine(side) {
  const zN = wingBottomZ(POST.x, POST.y) - 0.008;
  return [[-1.42, side * 0.52, 0.16], [-1.48, side * 0.95, 0.165], [-1.58, side * 1.5, 0.162], [-1.68, side * 1.98, 0.158], [-1.74, side * 2.27, 0.15], [-1.75, side * 2.37, 0.125], [-1.75, side * POST.y, zN]];
}
const DUCT_R = [0.085, 0.08, 0.07, 0.052, 0.048, 0.05, 0.1];
// ---- intakes, auxiliary inlet and bypass duct (interactive round 5) ----
// Each DSI mouth (intakeMesh: lip x 3.27…3.96, |y| ≈ 1.05…1.5, z −0.5…0.21) feeds an S-shaped duct: aft past the
// lift-fan bay (casing |y| ≤ 0.6 at x 1.32…2.52) and over the main-gear bays, then inward and upward, its tangent
// axial at both ends. The two ducts meet in a common section ahead of the engine fan face (x −0.3, r 0.55, centre
// z 0.12), where the drive shaft passes through a fairing. Offset in plan by about twice the fan radius, a straight
// line of sight from the mouth cannot reach the fan face.
// centreline (port side; y mirrors) and oval half-axes [lateral, vertical]
const INLET = [[3.32, 1.27, -0.15, 0.17, 0.3], [2.95, 1.29, -0.14, 0.2, 0.3], [2.45, 1.21, -0.12, 0.23, 0.27], [1.92, 1.06, -0.06, 0.25, 0.28], [1.35, 0.9, -0.01, 0.26, 0.28], [0.8, 0.7, 0.05, 0.27, 0.29], [0.38, 0.48, 0.09, 0.28, 0.31], [0.16, 0.34, 0.105, 0.28, 0.32]];
// common section: wide oval → the round fan face
const PLENUM = [[0.16, 0, 0.11, 0.6, 0.36], [-0.05, 0, 0.115, 0.58, 0.46], [-0.29, 0, 0.12, 0.55, 0.53]];
// auxiliary inlet ducts: under each aux door (x −0.35…0.55, |y| 0.12…0.5, hinged aft), down into the common section
const AUXD = (side) => [[0.12, side * 0.31, skinZ(0.12, 0.31) - 0.02, 0.15, 0.3], [0.04, side * 0.3, 0.78, 0.14, 0.27], [-0.06, side * 0.28, 0.58, 0.13, 0.23], [-0.12, side * 0.26, 0.46, 0.12, 0.2]];
// bypass duct: a thin outer wall round the fan's aft section and the core, from behind the fan to the mixer
const BYPASS = [[-0.5, 0.64], [-1.2, 0.655], [-1.9, 0.655], [-2.6, 0.6], [-3.6, 0.6], [-4.3, 0.6]];
// oval loft: rings { c, axis, a (lateral), b (vertical) }; lateral = horizontal normal of the axis
function ovalTube(rings, sides = 18) {
  const v = [], f = [];
  for (const ring of rings) {
    const ax = V3.unit(ring.axis);
    const u = V3.unit(Math.abs(ax[2]) > 0.9 ? V3.cross(ax, [1, 0, 0]) : V3.cross([0, 0, 1], ax));
    const w = V3.unit(V3.cross(ax, u));
    for (let i = 0; i < sides; i++) {
      const g = (i / sides) * Math.PI * 2;
      v.push(V3.add(ring.c, V3.add(V3.mul(u, Math.cos(g) * ring.a), V3.mul(w, Math.sin(g) * ring.b))));
    }
  }
  for (let r = 0; r < rings.length - 1; r++) for (let i = 0; i < sides; i++) {
    const j = (i + 1) % sides, a = r * sides, b = (r + 1) * sides;
    f.push([a + i, b + i, b + j, a + j]);
  }
  const mesh = orient({ v, f }, (c) => {
    let best = rings[0].c, dist = Infinity;
    for (const ring of rings) { const d = V3.len(V3.sub(ring.c, c)); if (d < dist) { dist = d; best = ring.c; } }
    return best;
  });
  mesh.caps = [];
  return mesh;
}
// rings along a list of [x, y, z, a, b] stations, axis from the neighbours (smoothed by Catmull-Rom subdivision)
function stationRings(keys, sub = 3) {
  const P = keys.map((k) => k.slice(0, 3)), pts = [];
  for (let i = 0; i < keys.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let k = 0; k < sub; k++) {
      const t = k / sub, t2 = t * t, t3 = t2 * t;
      const c = [0, 1, 2].map((j) => 0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3));
      pts.push({ c, a: lerp(keys[i][3], keys[i + 1][3], t), b: lerp(keys[i][4], keys[i + 1][4], t) });
    }
  }
  const L = keys[keys.length - 1];
  pts.push({ c: L.slice(0, 3), a: L[3], b: L[4] });
  return pts.map((r, i) => ({ ...r, axis: V3.sub(pts[Math.min(pts.length - 1, i + 1)].c, pts[Math.max(0, i - 1)].c) }));
}
const sideKeys = (keys, side) => keys.map(([x, y, z, a, b]) => [x, side * y, z, a, b]);
let XR_STATIC = null;
function xrayStatic() {
  const parts = [];
  const add = (name, mesh, opt = {}) => parts.push({ name, mesh, xr: true, ...opt, cls: "xr " + (opt.cls || "") });
  // F135: fan section with its face, core, turbine, augmentor duct to the 3BSM flange
  const er = (x, r) => ({ c: [x, 0, engZ(x)], axis: [-1, 0, 0], r });
  const fan = tube([er(-0.3, 0.55), er(-0.42, 0.6), er(-1.85, 0.6), er(-2.35, 0.5)], 26, { capStart: true });
  add("xr.eng.fan", fan, { tone: "hi", smooth: true, cls: "xr-eng" });
  add("xr.eng.core", tube([er(-2.35, 0.5), er(-3.45, 0.47), er(-3.7, 0.5)], 26), { tone: "hi", smooth: true, cls: "xr-core" });
  add("xr.eng.turb", tube([er(-3.7, 0.52), er(-4.35, 0.54)], 26), { tone: "hi", smooth: true, cls: "xr-turb" });
  add("xr.eng.aug", tube([er(-4.35, 0.55), er(-6.4, 0.615)], 26), { tone: "hi", smooth: true, cls: "xr-eng" });
  // LiftFan casing (open drum: the two rotors show through it), the bevel gearbox cone on its aft face
  const F = XRAY.fan;
  const fr = (z, r) => ({ c: [F.x, 0, z], axis: [0, 0, 1], r });
  const caseM = tube([fr(F.bot, F.r - 0.02), fr(F.bot + 0.12, F.r), fr(F.top - 0.06, F.r), fr(F.top, F.r - 0.03)], 32);
  add("xr.fan.case", caseM, { tone: "hi", smooth: true, cls: "xr-case", at: [F.x, 0, (F.top + F.bot) / 2] });
  const gb = tube([shRing(XRAY.gear.x0, 0.12), shRing(1.17, 0.19), shRing(XRAY.gear.x1, 0.21)], 20, { capStart: true, capEnd: true });

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
addEventListener("resize", () => run());
still.addEventListener?.("change", () => { if (still.matches) { setPlaying(false); T = PHASES[phaseOf(T)].key; } run(); });

playBtn.addEventListener("click", () => setPlaying(!playing));
phaseBtns.forEach((b) => b.addEventListener("click", () => {
  const i = Number(b.dataset.phase);
  jumpTo(still.matches || !playing ? PHASES[i].key : PHASES[i].start);
}));
stage.addEventListener("keydown", (event) => {
  const key = event.key;
  if (key === " " || key === "Enter") { event.preventDefault(); setPlaying(!playing); }
  else if (key === "1" || key === "2" || key === "3") { const i = Number(key) - 1; jumpTo(!playing || still.matches ? PHASES[i].key : PHASES[i].start); }
  else if (key === "ArrowRight" || key === "ArrowLeft") {
    event.preventDefault();
    setPlaying(false);
    T = (T + (key === "ArrowRight" ? 0.5 : -0.5) * (event.shiftKey ? 4 : 1) + CYCLE) % CYCLE;
    run();
  } else if (key === "Home") { event.preventDefault(); jumpTo(0); }
});
// drag across the stage scrubs through the phase on screen
let drag = null;
stage.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  const i = phaseOf(T);
  drag = { id: event.pointerId, i, x: event.clientX, moved: false };
});
stage.addEventListener("pointermove", (event) => {
  if (!drag || event.pointerId !== drag.id) return;
  if (!drag.moved && Math.abs(event.clientX - drag.x) < 4) return;
  if (!drag.moved) { drag.moved = true; try { stage.setPointerCapture(event.pointerId); } catch {} setPlaying(false); }
  const box = stage.getBoundingClientRect();
  const u = Math.min(1, Math.max(0, (event.clientX - box.left) / box.width));
  const ph = PHASES[drag.i];
  T = ph.start + u * (ph.end - ph.start - 0.01);
  run();
});
const endDrag = (event) => { if (drag && event.pointerId === drag.id) { try { stage.releasePointerCapture(event.pointerId); } catch {} drag = null; } };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
setPlaying(playing);
run();

}
// 一屏适配：说明浮层的上下边界、Esc/点外部收起、舞台尺寸变化时让渲染与 WebGL 重新对位
{
  const fig = document.querySelector(".f35-fit");
  const plate = fig && fig.querySelector(".iso-plate");
  const head = fig && fig.querySelector(".iso-plate-corners");
  const controls = fig && fig.querySelector(".f35-controls");
  const strip = fig && fig.querySelector(".f35-strip");
  const notes = fig && fig.querySelector(".f35-notes");
  const stage = fig && fig.querySelector(".f35-stage");
  const box = fig && fig.querySelector(".f35-box");
  if (fig && plate && notes) {
    const place = () => {
      // 浮层的定位容器：桌面为图卡，手机（图卡不定位）为整页，可用图卡上方的空白
      const host = getComputedStyle(plate).position === "static" ? plate.closest(".iso-page") : plate;
      const p = host.getBoundingClientRect();
      const top = host === plate ? head.getBoundingClientRect().bottom - p.top + 4 : 8;
      const below = Math.min(controls.getBoundingClientRect().top, strip.getBoundingClientRect().top);
      host.style.setProperty("--f35-ov-top", `${Math.max(0, top).toFixed(0)}px`);
      host.style.setProperty("--f35-ov-bot", `${Math.max(0, p.bottom - below + 6).toFixed(0)}px`);
      // 不支持容器查询单位的浏览器：用脚本算出舞台宽度
      if (!CSS.supports("width: 1cqh")) {
        const narrow = matchMedia("(max-width: 700px)").matches;
        const w = Math.min(box.clientWidth * (narrow ? 1.28 : 1), box.clientHeight * 1.6);
        stage.style.width = `${Math.floor(w)}px`;
      }
    };
    notes.addEventListener("toggle", place);
    notes.addEventListener("keydown", (e) => { if (e.key === "Escape" && notes.open) { notes.open = false; notes.querySelector("summary").focus(); } });
    document.addEventListener("pointerdown", (e) => { if (notes.open && !notes.contains(e.target)) notes.open = false; });
    let last = "";
    new ResizeObserver(() => {
      place();
      const r = stage.getBoundingClientRect();
      const key = `${r.width.toFixed(1)}x${r.height.toFixed(1)}`;
      if (key !== last) { last = key; dispatchEvent(new Event("resize")); }
    }).observe(box);
    addEventListener("resize", place);
    place();
  }
}
