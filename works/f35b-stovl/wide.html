/* ---- round 3: low-visibility F-35B scheme ----

.f35-ac, .fc-under-ac, .fc-door-ac {
  --anatomy-top: #b3b7ba; --anatomy-shade-3: #a5a9ad; --anatomy-shade-2: #979ba0; --anatomy-shade-1: #8a8e93; --anatomy-shade-0: #7c8085;

  --f35-glass-0: #6f6b5f; --f35-glass-1: #7b776b; --f35-glass-2: #878377; --f35-glass-3: #949084; --f35-glass-4: #a29e92;
}

.ac-part.hub path[data-s="c"] { fill: #6b6f74; stroke: #6b6f74; }
.f35-ac .ac-blade2, .fc-under-ac .ac-blade2, .fc-door-ac .ac-blade2 { fill: #6c7075; stroke: #45484c; }
.f35-ac .ac-well, .fc-under-ac .ac-well, .fc-door-ac .ac-well { fill: #3c4044; }
.f35-ac .ac-blade, .fc-under-ac .ac-blade, .fc-door-ac .ac-blade { fill: #a3a7ab; }

/* ---- 一屏适配（fit-viewport）：整页恰好一屏，无页面滚动；图形按宽高同时等比缩放 ---- */
html, body.iso { height: 100%; overflow: hidden; }
body.iso .iso-page { width: 100%; max-width: 1640px; height: 100vh; height: 100dvh; margin: 0 auto; padding: 10px 14px; display: flex; flex-direction: column; }
.f35-fit.iso-figure { margin: 0; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.f35-fit .iso-plate { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 9px 14px 10px; overflow: hidden; }

/* 标题行：图号、标题、操作提示、实时读数排成一行（不再绝对定位到四角） */
.f35-fit .iso-plate-corners { position: static; inset: auto; display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 14px; margin: 0 0 7px; flex: none; }
.f35-fit .iso-plate-corner { position: static; white-space: nowrap; }
.f35-fit .iso-plate-corner[data-corner="hint"] { margin-left: auto; max-width: none; }
.f35-fit .iso-plate-corner[data-corner="readout"] { min-width: 9em; text-align: right; }

/* 图形区：占满剩余高度；舞台保持 1280:800，取宽、高两者中较紧的一边 */
.f35-box { position: relative; flex: 1 1 auto; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.f35-fit .f35-stage { flex: none; width: 100%; aspect-ratio: 1280 / 800; margin: 0; }
@supports (width: 1cqh) { .f35-fit .f35-stage { width: min(100cqw, 160cqh); } }
.f35-fit .fc-mm { width: clamp(96px, 16.4%, 210px); }
.f35-fit .fc-under { width: clamp(180px, 31.25%, 400px); }
.f35-fit .fc-door { width: clamp(130px, 20.3%, 260px); }

/* 读数条与控件：紧凑 */
.f35-fit .f35-strip { margin: 8px 0 0; flex: none; }
.f35-fit .f35-cell { padding: 4px 9px 5px; gap: 2px; }
.f35-fit .f35-cell-k { font-size: 10.5px; }
.f35-fit .f35-cell-v { font-size: 14px; line-height: 1.2; }
.f35-fit .f35-controls { margin-top: 8px; gap: 6px; flex: none; }
.f35-fit .f35-btn { padding: 6px 11px; }

/* 图注与说明：默认收起，展开时浮在图形上方，不推动布局 */
.f35-notes { display: block; flex: none; }
.f35-notes > summary { list-style: none; }
.f35-notes > summary::-webkit-details-marker { display: none; }
.f35-notes > summary::marker { content: ""; }
.f35-notes-chev { width: 6px; height: 6px; border-right: 1.2px solid currentColor; border-bottom: 1.2px solid currentColor; transform: translateY(1px) rotate(-135deg); transition: transform .25s var(--anatomy-ease); }
.f35-notes[open] > summary { color: var(--anatomy-strong); box-shadow: var(--anatomy-lift), inset 0 0 0 1px var(--anatomy-mid); }
.f35-notes[open] .f35-notes-chev { transform: translateY(-2px) rotate(45deg); }
.f35-notes-body { position: absolute; z-index: 6; left: 0; right: 0; margin: 0 auto; width: min(780px, 100% - 28px);
  top: var(--f35-ov-top, 40px); bottom: var(--f35-ov-bot, 60px); display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
.f35-notes-panel { pointer-events: auto; max-height: 100%; overflow: auto; overscroll-behavior: contain; background: color-mix(in srgb, var(--anatomy-card) 96%, transparent); box-shadow: 0 0 0 1px var(--anatomy-faint), 0 8px 24px -10px #0000002e; border-radius: 4px; padding: 12px 16px 13px; }
.f35-fit .f35-notes-panel.iso-legend { margin: 0; gap: 7px; font-size: 12.5px; line-height: 1.65; }
.f35-notes-panel .iso-caption { margin: 0; }
.f35-notes-ops { margin: 0; color: var(--anatomy-muted); font-size: 11.5px; }
.f35-notes-head { font-size: 11.5px; letter-spacing: .06em; color: var(--anatomy-text); }
@media (prefers-reduced-motion: reduce) { .f35-notes-chev { transition: none; } }

/* 中等宽度：读数条两行三列也可 */
@media (max-width: 860px) and (min-width: 701px) { .f35-fit .f35-cell-v { font-size: 13px; } }

/* 手机：上下堆叠；舞台按原设计放大到 128% 并在图形区内裁切；整组内容垂直居中 */
@media (max-width: 700px) {
  body.iso .iso-page { padding: 8px; justify-content: center; position: relative; }
  .f35-fit.iso-figure { flex: 0 1 auto; }
  .f35-fit .iso-plate { flex: 0 1 auto; padding: 8px 10px 9px; position: static; }
  .f35-fit .iso-plate-corner[data-corner="hint"] { display: none; }
  .f35-fit .iso-plate-corner[data-corner="title"] { margin-right: auto; }
  .f35-fit .iso-plate-corner[data-corner="readout"] { min-width: 0; flex: 1 0 100%; text-align: left; }
  .f35-box { flex: 0 1 auto; height: calc((100vw - 36px) * .8); }
  .f35-fit .f35-stage { width: 128%; margin-left: 0; }
  @supports (width: 1cqh) { .f35-fit .f35-stage { width: min(128cqw, 160cqh); } }
  .f35-fit .f35-cell { padding: 5px 7px 6px; }
  .f35-fit .f35-btn { padding: 6px 9px; }
  .f35-notes-body { width: calc(100% - 16px); }
  .f35-notes-panel { box-shadow: 0 0 0 1px var(--anatomy-mid), 0 8px 24px -10px #0000003a; }
}
@media (max-height: 560px) { .f35-fit .f35-cell { padding: 3px 8px 4px; } .f35-fit .f35-controls, .f35-fit .f35-strip { margin-top: 5px; } }
.f35-fit .f35-stage:focus-visible { outline-offset: -2px; }

/* ---- 透视（X 光）视图 · 交互轮 4：机体半透明 + 轮廓线，升力系统内部件不透明 ---- */
.xr-icon { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1px currentColor; position: relative; }

@media (max-width: 700px) { .xr-btn .xr-colon, .xr-btn [data-xray-state], .xr-btn .f35-num { display: none; } }
.xr-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; opacity: 0; }

-xray-state>关</span></span><span class="f35-num">X</span></button><span class="f35-track" aria-hidden="true"><span class="f35-track-fill"></span><span class="f35-tick" style="left:0.00%"></span><span class="f35-tick" style="left:25.93%"></span><span class="f35-tick" style="left:44.56%"></span></span><details class="f35-notes"><summary class="f35-btn f35-notes-btn" aria-controls="f35-notes" title="展开或收起图注与说明（Esc 收起）"><span class="f35-notes-chev" aria-hidden="true"></span>说明</summary><div class="f35-notes-body" id="f35-notes"><div class="f35-notes-panel iso-legend" role="region" aria-label="图注与说明"><span class="f35-notes-head">图 1 · F-35B 短距起飞/垂直降落循环</span><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>三轴承旋转喷管</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>机体、舱门与起落架</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>飞行甲板与 12° 滑跃甲板</span></span><p class="iso-caption" id="f35-caption">F-35B：机长 15.6 米，翼展 10.7 米。短距起飞/垂直降落模式下，F135-PW-600 发动机经传动轴驱动座舱后方直径 50 英寸的两级升力风扇（冷推力约 89 千牛），三轴承旋转喷管 2.5 秒内可下偏至 95°（热推力约 80 千牛），并从外涵引气至两侧机翼内的滚转喷口（每侧约 8.7 千牛）；短距起飞推力为 181 千牛，喷管偏转时不能开加力。本图甲板滑跑 67 米至 12° 滑跃甲板末端，离舰时相对甲板约 48 节，另加 20 节甲板风。垂直降落先在舷侧 40 英尺高度悬停，横移到降落点上方，以约 5 英尺/秒下降，接地前减至 3 英尺/秒。15 米以上的高度按压缩比例绘制，250 节的通场放慢约 6 倍以便观看，空速含 20 节甲板风，传动轴转速为估计值（离合器在最高约 8,500 转/分时接合）。</p><p class="f35-notes-ops">透视（X）：机体蒙皮半透明，显示升力系统——F135 发动机、传动轴（带两个挠性联轴节）、离合器、锥齿轮箱、升力风扇（两级对转）和两侧滚转管路；以及进气系统——两侧进气道（DSI，无附面层隔道的鼓包进气口）、向内向上弯折并在发动机风扇前汇合的 S 形进气道（从正前方看不到风扇面，利于隐身）、升力风扇门后方的辅助进气口及其通往进气道汇合段的短管，和发动机核心机外的外涵道（滚转管路的气源）。升力风扇工作时离合器接合，传动轴随之转动；常规飞行时离合器分离，传动轴静止；滚转喷口工作时管路内显示气流；发动机运转时进气道内始终有气流（随油门加快），辅助进气门打开时辅助进气管内显示气流。</p><p class="f35-notes-ops">操作：空格 播放，1–3 阶段，X 透视，←→ 步进，拖动。</p></div></div></details></div><span class="f35-sr" aria-live="polite" data-live></span></div></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);
    });
    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));
    const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])
                outline.push(pathOf([top[index], bottom[index]]));
        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const [nx, ny] = normals[index];

const V3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],

function newell(pts) {
  let nx = 0, ny = 0, nz = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    nx += (a[1] - b[1]) * (a[2] + b[2]);
    ny += (a[2] - b[2]) * (a[0] + b[0]);
    nz += (a[0] - b[0]) * (a[1] + b[1]);

}

    nx += (a[1] - b[1]) * (a[2] + b[2]);
    ny += (a[2] - b[2]) * (a[0] + b[0]);

// A mesh is { v: [[x,y,z]], f: [[i,j,k,..]] } with faces wound outward. `orient` fixes the winding
// of each face against an inside point.
function orient(mesh, insideOf) {
  mesh.f = mesh.f.map((face) => {
    const pts = face.map((i) => mesh.v[i]);
    const n = newell(pts);
    const c = centroid(pts);
    return V3.dot(n, V3.sub(c, insideOf(c, face))) < 0 ? face.slice().reverse() : face;
  });

}

// closed prism between a polygon (in a plane) and the same polygon offset by `thick` along its normal
function plate(poly, normal, thick) {
  const n = V3.unit(normal);

  const top = poly.map((p) => V3.add(p, V3.mul(n, thick / 2)));
  const bot = poly.map((p) => V3.sub(p, V3.mul(n, thick / 2)));
  const v = [...top, ...bot];
  const k = poly.length;
  const f = [Array.from({ length: k }, (_, i) => i), Array.from({ length: k }, (_, i) => 2 * k - 1 - i)];
  for (let i = 0; i < k; i++) { const j = (i + 1) % k; f.push([i, k + i, k + j, j]); }
  return { v, f };

// closed tube between rings (each ring: centre, axis, radius)
function tube(rings, sides = 16, { capStart = false, capEnd = false } = {}) {
  const v = [], f = [];
  let prevU = null;
  for (const ring of rings) {
    const a = V3.unit(ring.axis);
    let u = prevU ? V3.unit(V3.sub(prevU, V3.mul(a, V3.dot(prevU, a)))) : V3.unit(V3.cross(a, Math.abs(a[2]) > 0.9 ? [1, 0, 0] : [0, 0, 1]));
    prevU = u;
    const w = V3.cross(a, u);
    for (let i = 0; i < sides; i++) {
      const ang = (i / sides) * Math.PI * 2;
      v.push(V3.add(ring.c, V3.add(V3.mul(u, Math.cos(ang) * ring.r), V3.mul(w, Math.sin(ang) * ring.r))));
    }

  for (let r = 0; r < rings.length - 1; r++) for (let i = 0; i < sides; i++) {
    const j = (i + 1) % sides, a = r * sides, b = (r + 1) * sides;
    f.push([a + i, b + i, b + j, a + j]);
  }
  const caps = [];
  if (capStart) { f.push(Array.from({ length: sides }, (_, i) => i)); caps.push(f.length - 1); }
  if (capEnd) { const b = (rings.length - 1) * sides; f.push(Array.from({ length: sides }, (_, i) => b + i)); caps.push(f.length - 1); }
  const mesh = orient({ v, f }, (c, face) => {

    let best = rings[0].c, dist = Infinity;
    for (const ring of rings) { const d = V3.len(V3.sub(ring.c, c)); if (d < dist) { dist = d; best = ring.c; } }

}

function wheel(c, r, width, sides = 14) {

function box(a, b, r) { // a square strut from a to b, half-width r
  const ax = V3.unit(V3.sub(b, a));
  const u = V3.unit(V3.cross(ax, Math.abs(ax[2]) > 0.9 ? [1, 0, 0] : [0, 0, 1]));
  const w = V3.cross(ax, u);

// monotone cubic (PCHIP) through the keys, one column at a time: no overshoot between stations
function pchip(keys, col) {
  const xs = keys.map((k) => k[0]), ys = keys.map((k) => k[col]);
  const n = xs.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  for (let i = 0; i < n; i++) {
    if (i === 0) m.push(d[0]); else if (i === n - 1) m.push(d[n - 2]);
    else m.push(d[i - 1] * d[i] <= 0 ? 0 : 2 / (1 / d[i - 1] + 1 / d[i]));
  }
  return (x) => {
    let i = 0;
    while (i < n - 2 && !((x <= xs[i] && x >= xs[i + 1]) || (x >= xs[i] && x <= xs[i + 1]))) i++;
    const h = xs[i + 1] - xs[i], t = Math.min(1, Math.max(0, (x - xs[i]) / h));
    const t2 = t * t, t3 = t2 * t;

  };

const FUS_F = [1, 2, 3, 4, 5, 6, 7, 8].map((c) => pchip(FUS_KEYS, c));
function sectionAt(x) {
  const [w, zc, zt, zb, au, bu, al, bl] = FUS_F.map((f) => f(x));
  return { x, w, zc, zt, zb, au, bu, al, bl };
}
const upperZ = (st, y) => st.zc + (st.zt - st.zc) * Math.pow(Math.max(0, 1 - Math.pow(Math.min(1, Math.abs(y) / st.w), st.au)), 1 / st.bu);
const lowerZ = (st, y) => st.zc - (st.zc - st.zb) * Math.pow(Math.max(0, 1 - Math.pow(Math.min(1, Math.abs(y) / st.w), st.al)), 1 / st.bl);
// half-width of the skin at height z
function fusY(x, z) {
  const st = sectionAt(x);
  if (z >= st.zc) { const q = Math.min(1, (z - st.zc) / (st.zt - st.zc)); return st.w * Math.pow(Math.max(0, 1 - Math.pow(q, st.bu)), 1 / st.au); }
  const q = Math.min(1, (st.zc - z) / (st.zc - st.zb)); return st.w * Math.pow(Math.max(0, 1 - Math.pow(q, st.bl)), 1 / st.al);
}
function topAt(x) { return sectionAt(Math.min(7.6, Math.max(-6.42, x))).zt; }
function skinZ(x, y, upper = true) { const st = sectionAt(x); return upper ? upperZ(st, y) : lowerZ(st, y); }

// ring around the section, starting at the belly centreline, up the port side, over the top, down starboard
const NU = 10, NL = 7;
const CHINE = [NL, NL + 2 * NU];
function fusRing(st) {
  const port = [];
  for (let k = 0; k <= NL; k++) { const y = st.w * Math.sin((k / NL) * Math.PI / 2); port.push([y, lowerZ(st, y)]); }
  for (let k = 1; k <= NU; k++) { const y = st.w * Math.cos((k / NU) * Math.PI / 2); port.push([k === NU ? 0 : y, upperZ(st, y)]); }
  const stbd = port.slice(1, -1).reverse().map(([y, z]) => [-y, z]);
  return [...port, ...stbd].map(([y, z]) => [st.x, y, z]);
}

// generic loft between rings of equal length. closed: the ring wraps; centres: an inside point per ring.
function loftRings(rings, centres, { tip = null, closed = true, capEnd = false, capStart = false } = {}) {
  const v = [], f = [], n = rings[0].length;
  const base = rings.map((r) => { const b = v.length; v.push(...r); return b; });
  const fc = []; // inside point per face
  let ti = -1;
  if (tip) {
    ti = v.length; v.push(tip);
    for (let j = 0; j < (closed ? n : n - 1); j++) { f.push([ti, base[0] + j, base[0] + ((j + 1) % n)]); fc.push(centres[0]); }
  }
  for (let r = 0; r < rings.length - 1; r++) for (let j = 0; j < (closed ? n : n - 1); j++) {
    const j1 = (j + 1) % n;
    f.push([base[r] + j, base[r + 1] + j, base[r + 1] + j1, base[r] + j1]);
    fc.push(V3.mul(V3.add(centres[r], centres[r + 1]), 0.5));
  }
  const caps = [];
  if (capEnd) { const L = rings.length - 1; f.push(Array.from({ length: n }, (_, j) => base[L] + j)); fc.push(centres[Math.max(0, L - 1)]); caps.push(f.length - 1); }
  if (capStart) { f.push(Array.from({ length: n }, (_, j) => base[0] + j)); fc.push(centres[1]); caps.push(f.length - 1); }
  f.forEach((face, i) => {
    const pts = face.map((k) => v[k]);
    if (V3.dot(newell(pts), V3.sub(centroid(pts), fc[i])) < 0) f[i] = face.slice().reverse();
  });
  return { v, f, base, n, capsFaces: caps };
}
// edge-aligned polyline along ring index j from ring r0 to r1, or along ring r from index j0 to j1
const alongX = (L, j, r0, r1) => { const out = []; const s = r0 < r1 ? 1 : -1; for (let r = r0; r !== r1 + s; r += s) out.push(L.base[r] + j); return out; };
const aroundRing = (L, r, j0, j1) => { const out = []; const s = j0 < j1 ? 1 : -1; for (let j = j0; j !== j1 + s; j += s) out.push(L.base[r] + ((j + L.n) % L.n)); return out; };

function fuselageMesh() {
  // stations: dense where the section changes fast (nose, intakes, tail) plus the seams that need a ring
  const xs = new Set([7.62, 7.45, 7.25, 7.0, 6.75, 6.5, 6.3, 6.05, 5.7, 5.4, 5.05, 4.7, 4.35, 4.0, 3.7, 3.4, 3.1, 2.8, 2.5, 2.2, 1.9, 1.5, 1.1, 0.6, 0.1, -0.4, -0.9, -1.4, -1.9, -2.4, -2.9, -3.4, -3.9, -4.4, -4.85, -5.3, -5.7, -6.05, -6.42]);
  const X = [...xs].sort((a, b) => b - a);
  const secs = X.map(sectionAt);
  const L = loftRings(secs.map(fusRing), secs.map((s) => [s.x, 0, (s.zt + s.zb) / 2]), { tip: NOSE_TIP, capEnd: true });
  const mesh = { v: L.v, f: L.f, caps: [] };
  mesh.crease = new Set();
  for (let r = 0; r < X.length - 1; r++) for (const j of CHINE) { const a = L.base[r] + j, b = L.base[r + 1] + j; mesh.crease.add(a < b ? a + "," + b : b + "," + a); }
  const ri = (x) => X.indexOf(x);
  const loops = [];
  // radome joint: one ring over the top, chine to chine
  loops.push(aroundRing(L, ri(6.3), CHINE[0], CHINE[1]));
  // weapons-bay doors on the belly (F-35B bays are short: the lift fan sits ahead of them), two doors a side
  const bayA = ri(0.6), bayB = ri(-2.9);
  for (const [j0, j1] of [[1, 2], [2, 3], [L.n - 2, L.n - 1], [L.n - 3, L.n - 2]]) {
    loops.push([...alongX(L, j0, bayA, bayB), ...aroundRing(L, bayB, j0, j1).slice(1), ...alongX(L, j1, bayB, bayA).slice(1), ...aroundRing(L, bayA, j1, j0).slice(1)]);
  }
  // nose-gear bay doors
  const ngA = ri(5.7), ngB = ri(4.35);
  loops.push([...alongX(L, 1, ngA, ngB), ...aroundRing(L, ngB, 1, -1).slice(1), ...alongX(L, L.n - 1, ngB, ngA).slice(1), ...aroundRing(L, ngA, -1, 1).slice(1)]);
  // aft access panel on the spine, edge to edge between two rings
  const spA = ri(-2.9), spB = ri(-4.4);
  loops.push([...alongX(L, NL + NU - 2, spA, spB), ...aroundRing(L, spB, NL + NU - 2, NL + NU + 2).slice(1), ...alongX(L, NL + NU + 2, spB, spA).slice(1), ...aroundRing(L, spA, NL + NU + 2, NL + NU - 2).slice(1)]);
  mesh.loops = loops;
  return mesh;
}

// canopy: one-piece bubble on the forebody, abbreviated on the B, with a frame bow and a sill
function canopyMesh() {
  const keys = [[6.0, 0.03, 0.5], [5.75, 0.24, 0.8], [5.35, 0.38, 1.0], [4.95, 0.46, 1.13], [4.55, 0.5, 1.22], [4.1, 0.51, 1.26], [3.65, 0.49, 1.25], [3.3, 0.45, 1.19], [3.02, 0.4, 1.1]];
  const N = 16;
  const rings = [], centres = [];
  for (const [x, w, zt] of keys) {
    const zb = skinZ(x, w) - (x > 5.9 ? 0.0 : 0.012);
    const ring = [];
    for (let i = 0; i <= N; i++) {
      const ph = (i / N) * Math.PI, c = Math.cos(ph), s = Math.sin(ph);
      ring.push([x, w * Math.sign(c) * Math.pow(Math.abs(c), 0.85), zb + (zt - zb) * Math.pow(s, 0.8)]);
    }
    rings.push(ring); centres.push([x, 0, zb]);
  }
  const L = loftRings(rings, centres, { closed: false });
  const mesh = { v: L.v, f: L.f, loops: [aroundRing(L, 4, 0, N)] }; // frame bow at x 4.55
  // highlight: a thin streak on the upper port quarter of the glass
  const at = (x, ph, dz = 0.006) => {
    const k = keys.findIndex((q) => q[0] <= x);
    const a = keys[Math.max(0, k - 1)], b = keys[k];
    const t = (a[0] - x) / (a[0] - b[0] || 1);
    const w = lerp(a[1], b[1], t), zt = lerp(a[2], b[2], t), zb = skinZ(x, w) - 0.012;
    const c = Math.cos(ph), s = Math.sin(ph);
    return [x, (w + dz) * Math.sign(c) * Math.pow(Math.abs(c), 0.85), zb + (zt - zb + dz) * Math.pow(s, 0.8)];
  };
  const glint = [];
  for (const [x0, x1, p0, p1] of [[5.3, 3.75, 0.3, 0.37], [5.45, 4.95, 0.42, 0.46]]) {
    const pts = [];
    for (let i = 0; i <= 6; i++) pts.push(at(lerp(x0, x1, i / 6), lerp(p0, p0 + 0.02, Math.sin((i / 6) * Math.PI)) * Math.PI));
    for (let i = 6; i >= 0; i--) pts.push(at(lerp(x0, x1, i / 6), lerp(p1, p1 - 0.02, Math.sin((i / 6) * Math.PI)) * Math.PI));
    glint.push({ pts, n: [0, Math.cos(((p0 + p1) / 2) * Math.PI), Math.sin(((p0 + p1) / 2) * Math.PI)] });
  }
  mesh.glint = glint;
  return mesh;
}
// the canopy's aft bulkhead: an opaque arch closing the glass, standing on the hump just ahead of the fan door
function canopyAftMesh() {
  const x = 3.02, w = 0.4, zt = 1.1, N = 16;
  const zb = skinZ(x, w) - 0.012;
  const v = [];
  for (let i = 0; i <= N; i++) { const ph = (i / N) * Math.PI, c = Math.cos(ph), s = Math.sin(ph); v.push([x - 0.004, w * Math.sign(c) * Math.pow(Math.abs(c), 0.85), zb + (zt - zb) * Math.pow(s, 0.8)]); }
  let face = v.map((_, i) => i);
  if (V3.dot(newell(v), [-1, 0, 0]) < 0) face = face.reverse();
  return { v, f: [face] };
}
// (unused) the fairing behind the glass
function fairingMesh() {
  const keys = [[3.05, 0.42, 1.11], [2.75, 0.38, 1.04], [2.45, 0.3, 1.0], [2.15, 0.2, 0.99]];
  const N = 12, rings = [], centres = [];
  for (const [x, w, zt] of keys) {
    const zb = skinZ(x, w) - 0.02;
    const ring = [];
    for (let i = 0; i <= N; i++) { const ph = (i / N) * Math.PI, c = Math.cos(ph), s = Math.sin(ph); ring.push([x, w * Math.sign(c) * Math.pow(Math.abs(c), 0.85), zb + (zt - zb) * Math.pow(s, 0.8)]); }
    rings.push(ring); centres.push([x, 0, zb]);
  }
  const L = loftRings(rings, centres, { closed: false, capEnd: true });
  return { v: L.v, f: L.f, hideBoundary: true };
}

// caret (DSI) intake: raked lip, open against the fuselage, merging into the skin at x 2.2
function intakeMesh(side) {
  const ringAt = (x, pts) => pts.map(([y, z, dx = 0]) => [x + dx, side * y, z]);
  // mouth: inner-top on the forebody, outer-top (the new chine), outer side, rounded lower corner, inner-bottom
  const mouth = ringAt(0, [[fusY(3.96, 0.21) - 0.01, 0.21, 3.96], [1.5, 0.14, 3.6], [1.46, -0.13, 3.42], [1.36, -0.42, 3.27], [fusY(3.4, -0.5) - 0.01, -0.5, 3.4]]);
  const r1 = ringAt(3.05, [[fusY(3.05, 0.2) - 0.01, 0.2], [1.6, 0.15], [1.56, -0.13], [1.45, -0.45], [fusY(3.05, -0.55) - 0.01, -0.55]]);
  const r2 = ringAt(2.6, [[fusY(2.6, 0.17) - 0.01, 0.17], [1.63, 0.15], [1.59, -0.14], [1.46, -0.47], [fusY(2.6, -0.6) - 0.01, -0.6]]);
  const s22 = sectionAt(2.2);
  const r3 = ringAt(2.2, [[fusY(2.2, 0.11) - 0.004, 0.11], [s22.w - 0.004, s22.zc], [fusY(2.2, -0.12) - 0.004, -0.12], [fusY(2.2, -0.42) - 0.004, -0.42], [fusY(2.2, -0.5) - 0.004, -0.5]]);
  const rings = [mouth, r1, r2, r3];
  const centres = [[3.6, side * 1.05, -0.2], [3.05, side * 1.2, -0.2], [2.6, side * 1.3, -0.2], [2.2, side * 1.35, -0.2]];
  const L = loftRings(rings, centres, { closed: false });
  // the duct mouth, dark: lip ring closed along the fuselage side
  const mesh = { v: L.v, f: L.f, caps: [] };
  mesh.f.push(Array.from({ length: 5 }, (_, i) => i));
  const mf = mesh.f.length - 1;
  if (V3.dot(newell(mesh.f[mf].map((i) => mesh.v[i])), [1, 0, 0]) < 0) mesh.f[mf] = mesh.f[mf].slice().reverse();
  mesh.caps.push(mf);
  mesh.crease = new Set();
  for (let r = 0; r < 3; r++) { const a = L.base[r] + 1, b = L.base[r + 1] + 1; mesh.crease.add(a < b ? a + "," + b : b + "," + a); }
  // the edges where the cowl meets the fuselage: a light junction line, not an outline
  mesh.softEdges = new Set();
  for (let r = 0; r < 3; r++) for (const j of [0, 4]) { const a = L.base[r] + j, b = L.base[r + 1] + j; mesh.softEdges.add(a < b ? a + "," + b : b + "," + a); }
  return mesh;
}
// the DSI bump: a smooth blister on the forebody side, ahead of and into the mouth
function bumpMesh(side) {
  const v = [], f = [];
  const NA = 10, NB = 8;
  const cx = 3.95, cz = -0.2, ax = 0.62, bz = 0.3, hgt = 0.15;
  for (let i = 0; i <= NA; i++) for (let j = 0; j <= NB; j++) {
    const a = -1 + (2 * i) / NA, b = -1 + (2 * j) / NB;
    const r = Math.max(0, 1 - a * a - b * b);
    const x = cx + a * ax * (a < 0 ? 0.75 : 1), z = cz + b * bz;
    v.push([x, side * (fusY(x, z) - 0.006 + hgt * Math.pow(r, 0.7)), z]);
  }
  const id = (i, j) => i * (NB + 1) + j;
  for (let i = 0; i < NA; i++) for (let j = 0; j < NB; j++) {
    const face = [id(i, j), id(i + 1, j), id(i + 1, j + 1), id(i, j + 1)];
    const pts = face.map((k) => v[k]);
    f.push(V3.dot(newell(pts), [0, side, 0]) < 0 ? face.slice().reverse() : face);
  }
  return { v, f, hideBoundary: true, smooth: true };
}

// a thin lifting surface: root and tip chords (3D), a thickness normal, an airfoil-like section
// us: chord stations (0 = leading edge, 1 = trailing edge); vs: span stations. Root left open (it is buried).
function foilMesh({ rootLE, rootTE, tipLE, tipTE, up, thick: [tr, tt], us, vs, camber = 0.62, rootFix = null }) {
  const n = V3.unit(up);
  const nu = us.length;
  const tdist = (u) => (u <= 0 || u >= 1 ? 0 : (Math.sqrt(u) * (1 - u)) / 0.385);
  const rings = [], centres = [];
  for (const vv of vs) {
    const le = V3.add(V3.mul(rootLE, 1 - vv), V3.mul(tipLE, vv)), te = V3.add(V3.mul(rootTE, 1 - vv), V3.mul(tipTE, vv));
    const th = lerp(tr, tt, vv);
    const mid = (u) => V3.add(V3.mul(le, 1 - u), V3.mul(te, u));
    const ring = [];
    for (let i = 0; i < nu; i++) ring.push(V3.add(mid(us[i]), V3.mul(n, tdist(us[i]) * th * camber)));
    for (let i = nu - 2; i >= 1; i--) ring.push(V3.sub(mid(us[i]), V3.mul(n, tdist(us[i]) * th * (1 - camber))));
    rings.push(vv === 0 && rootFix ? ring.map(rootFix) : ring); centres.push(mid(0.4));
  }
  const L = loftRings(rings, centres, { capEnd: true });
  // faces: fix the winding by which skin they are on (centres lie in the mid-plane, so loftRings' test is weak at the edges)
  const R = rings[0].length;
  L.f.forEach((face, fi) => {
    if (face.length === R) return;
    const pts = face.map((k) => L.v[k]);
    const idx = face.map((k) => (k - L.base[0]) % R);
    const top = idx.every((i) => i <= nu - 1);
    const want = top ? n : V3.mul(n, -1);
    if (V3.dot(newell(pts), want) < 0) L.f[fi] = face.slice().reverse();
  });
  const topLine = (iu, v0 = 0, v1 = vs.length - 1) => alongX(L, iu, v0, v1);
  const botLine = (iu, v0 = 0, v1 = vs.length - 1) => alongX(L, R - iu, v0, v1);
  return { v: L.v, f: L.f, L, R, nu, topLine, botLine, rootBoundary: true };
}

// planform (port side; starboard mirrors y)
const WING = { rootLE: [2.05, 1.66], rootTE: [-3.11, 1.6], tipLE: [-0.56, 5.35], tipTE: [-2.2, 5.35], z0: 0.15, z1: 0.11, thick: [0.24, 0.07] };
const BOOM = { y: 1.08 };
const WING_US = [0, 0.025, 0.08, 0.16, 0.3, 0.45, 0.6, 0.72, 0.8, 0.9, 1];
const WING_VS = [0, 0.15, 0.35, 0.55, 0.75, 0.9, 1];
// Roll posts: bypass air ducted to a downward nozzle in each wing root, just outboard of the main-gear bays
// (body y ±1.0…1.6) and aft of mid-chord, under a door hinged on its outboard edge (issue #2, interactive round 1;
// was y ±3.2, mid-span). x/y is the nozzle centre; the jet starts at z = -0.05.
const POST = { x: -1.75, y: 2.4, r: 0.15, door: [-1.4, -2.1, 2.15, 2.65], hingeY: 2.65 };
function postDoor(side, z) {
  const [x0, x1, y0, y1] = POST.door;
  return plate([[x0, side * y0, z], [x0, side * y1, z], [x1, side * y1, z], [x1, side * y0, z]], [0, 0, 1], 0.03);
}
function postNozzle(side, z) { // from the lower skin down to the jet's origin, where the shader starts it
  return tube([{ c: [POST.x, side * POST.y, z + 0.01], axis: [0, 0, -1], r: POST.r }, { c: [POST.x, side * POST.y, -0.05], axis: [0, 0, -1], r: POST.r * 0.87 }], 16, { capEnd: true });
}
// lower wing skin height at (x, y): for the roll-post door
function wingBottomZ(x, y) {
  const v = (Math.abs(y) - WING.rootLE[1]) / (WING.tipLE[1] - WING.rootLE[1]);
  const le = lerp(WING.rootLE[0], WING.tipLE[0], v), te = lerp(WING.rootTE[0], WING.tipTE[0], v);
  const u = (le - x) / (le - te);
  const th = lerp(WING.thick[0], WING.thick[1], v);
  return lerp(WING.z0, WING.z1, v) - ((Math.sqrt(u) * (1 - u)) / 0.385) * th * 0.38;
}

function boomMesh(side) {
  // aft-first: the loft's tip closes the tail end; the forward ring sits against the aft fuselage's end
  const keys = [[-7.42, 0.09, 0.1, 0.16, 0.03], [-7.1, 0.15, 0.1, 0.24, -0.06], [-6.75, 0.19, 0.1, 0.31, -0.16], [-6.4, 0.2, 0.1, 0.37, -0.25]];
  const NUb = 5, NLb = 4;
  const rings = [], centres = [];
  for (const [x, w, zc, zt, zb] of keys) {
    const st = { x, w, zc, zt, zb, au: 3, bu: 1, al: 3, bl: 1 };
    const pts = [];
    for (let k = 0; k <= NLb; k++) { const y = w * Math.sin((k / NLb) * Math.PI / 2); pts.push([y, lowerZ(st, y)]); }
    for (let k = 1; k <= NUb; k++) { const y = w * Math.cos((k / NUb) * Math.PI / 2); pts.push([k === NUb ? 0 : y, upperZ(st, y)]); }
    const other = pts.slice(1, -1).reverse().map(([y, z]) => [-y, z]);
    rings.push([...pts, ...other].map(([y, z]) => [x, side * BOOM.y + y, z]));
    centres.push([x, side * BOOM.y, (zt + zb) / 2]);
  }
  const L = loftRings(rings, centres, { tip: [-7.66, side * BOOM.y, 0.1] });
  const mesh = { v: L.v, f: L.f, smooth: true, hideBoundary: true };
  mesh.crease = new Set();
  const n = rings[0].length;
  for (let r = 0; r < rings.length - 1; r++) for (const j of [NLb, NLb + 2 * NUb]) { const a = L.base[r] + j, b = L.base[r + 1] + j; mesh.crease.add(a < b ? a + "," + b : b + "," + a); }
  void n;
  return mesh;
}

// ---- Round 3 geometry: fins with rudders, moving stabilators, shell doors, round gear, markings ---------------
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const tdist = (u) => (u <= 0 || u >= 1 ? 0 : (Math.sqrt(u) * (1 - u)) / 0.385);
const ekey = (a, b) => (a < b ? a + "," + b : b + "," + a);

// A lifting surface over a chord range [us[0], us[last]] of a symmetric section (full thickness th at the
// thickest point). A range that stops short of the leading or trailing edge closes with a flat face across the
// thickness (the rudder hinge face). Faces are wound by which skin they lie on; topFace/botFace(r, i) name the
// face of span strip r between chord stations i and i+1 on each skin (for the radar-absorbent edge bands).
function foilRange({ rootLE, rootTE, tipLE, tipTE, up, thick: [tr, tt], us, vs, capRoot = false, camber = 0.5 }) {
  const n = V3.unit(up);
  const nu = us.length;
  const z0 = tdist(us[0]) === 0, z1 = tdist(us[nu - 1]) === 0;
  const tag = [];
  const rings = [], centres = [];
  vs.forEach((vv, r) => {
    const le = lerp3(rootLE, tipLE, vv), te = lerp3(rootTE, tipTE, vv);
    const th = lerp(tr, tt, vv);

// A curved panel with real thickness: outer skin surf(u, v), inner skin offset `thick` along -normal, side walls.

    const e = 1e-3;

    const A0 = opts.pr([0, 0, 0]), AX = opts.pr([1, 0, 0]), AY = opts.pr([0, 1, 0]), AZ = opts.pr([0, 0, 1]);
    const ax = AX[0] - A0[0], bx = AX[1] - A0[1], ay = AY[0] - A0[0], by = AY[1] - A0[1], az = AZ[0] - A0[0], bz = AZ[1] - A0[1];
    const P = (p) => (A0[0] + ax * p[0] + ay * p[1] + az * p[2]).toFixed(1) + " " + (A0[1] + bx * p[0] + by * p[1] + bz * p[2]).toFixed(1);
    for (const dc of mesh.decals) {
      const O = opts.pr(dc.o), U = opts.pr(V3.add(dc.o, dc.u)), ppm = Math.hypot(U[0] - O[0], U[1] - O[1]);
      if (ppm < 7) continue; // under 7 px a metre: too small to read, skip
      for (const gr of dc.groups) {
        if (V3.dot(V3.unit(opts.dW(gr.n)), V) < dc.minDot) continue;
        for (const c of ppm > 60 ? gr.cd : ppm > 30 ? gr.c : gr.cs) { const d = "M" + c.map(P).join("L"); if (gr.line) line += d; else fill += d + "Z"; }
      }
    }
    if (fill) g.push(`<path class="ac-mark" d="${fill}"/>`);
    if (line) g.push(`<path class="ac-mark-line" d="${line}"/>`);
  }
  if (mesh.lines3 && opts.pr && opts.dW) {
    let d = "";
    for (const ln of mesh.lines3) if (V3.dot(V3.unit(opts.dW(ln.n)), V) > 0.05) d += "M" + ln.line.map((p) => { const q = opts.pr(p); return q[0].toFixed(2) + " " + q[1].toFixed(2); }).join("L");
    if (d) g.push(`<path class="ac-mark-line" d="${d}"/>`);
  }
  const key = (a, b) => (a < b ? a + "," + b : b + "," + a);
  const sil = [], crease = [], soft = [];
  for (const e of edgesOf(mesh)) {
    const k = key(e.a, e.b);
    if (e.faces.length === 1) {
      if (!front[e.faces[0]] || mesh.hideBoundary) continue;
      if (mesh.softEdges && mesh.softEdges.has(k)) soft.push(fmtLine(sv[e.a], sv[e.b])); else sil.push(fmtLine(sv[e.a], sv[e.b]));
      continue;
    }
    const [fa, fb] = e.faces;
    if (front[fa] !== front[fb]) { if (!mesh.noSil) sil.push(fmtLine(sv[e.a], sv[e.b])); }
    else if (front[fa] && ((mesh.crease && mesh.crease.has(k)) || (!part.smooth && V3.dot(normals[fa], normals[fb]) < 0.7))) crease.push(fmtLine(sv[e.a], sv[e.b]));
  }
  const panel = [];
  if (mesh.loops) {
    const em = edgeMap(mesh);
    for (const loop of mesh.loops) {
      let cur = null;
      for (let i = 0; i < loop.length - 1; i++) {
        const e = em.get(key(loop[i], loop[i + 1]));
        const vis = e && e.faces.some((fi) => front[fi]) && !(e.faces.length === 2 && front[e.faces[0]] !== front[e.faces[1]]);
        if (vis) { if (!cur) { cur = [sv[loop[i]]]; panel.push(cur); } cur.push(sv[loop[i + 1]]); } else cur = null;
      }
    }
  }
  if (panel.length) g.push(`<path class="iso-line" data-tone="lo" d="${panel.map((pts) => "M" + pts.map((p) => fmtLine(p, p).split("L")[0].slice(1)).join("L")).join("")}"/>`);
  if (mesh.glint && opts.dW) {
    for (const gl of mesh.glint) if (V3.dot(V3.unit(opts.dW(gl.n)), V) > 0.12) g.push(`<path class="ac-glint" d="${fmtPath(gl.pts.map(opts.pr))}"/>`);
  }
  if (soft.length) g.push(`<path class="iso-line" data-tone="lo" d="${soft.join("")}"/>`);
  if (crease.length) g.push(`<path class="iso-line" data-tone="${part.tone === "hi" ? "lo" : "faint"}" d="${crease.join("")}"/>`);
  if (sil.length) g.push(`<path class="iso-line" data-tone="${part.lit ? "lit" : part.tone || "hi"}" d="${sil.join("")}"/>`);
  return g;
}

let STATIC = null;
// outline for the shadow: nose, wing, stabilator and tail, both sides
const PLANFORM = [NOSE_TIP, [3.6, 1.5, 0], [2.05, 1.66, 0], [-0.56, 5.35, 0], [-2.2, 5.35, 0], [-3.11, 1.6, 0], [-4.75, 1.3, 0], [-6.24, 3.33, 0], [-7.05, 3.33, 0], [-7.58, 1.25, 0], [-7.6, 0, 0]]
  .flatMap((p, i, a) => (i === a.length - 1 ? [p] : [p])).concat([[-7.58, -1.25, 0], [-7.05, -3.33, 0], [-6.24, -3.33, 0], [-4.75, -1.3, 0], [-3.11, -1.6, 0], [-2.2, -5.35, 0], [-0.56, -5.35, 0], [2.05, -1.66, 0], [3.6, -1.5, 0]]);

// ---- moving hardware shared by both renderers -------------------------------------------------------------
// Cached rest meshes (topology + smoothing groups computed once), rotated per frame.
let SURF = null;
function surfBases() {
  if (SURF) return SURF;
  SURF = {};
  for (const side of [1, -1]) {
    const k = side > 0 ? "port" : "stbd";
    SURF["stab." + k] = stabBase(side);
    SURF["rudder." + k] = rudderBase(side);
    SURF["door.aux." + k] = auxDoorBase(side);
    SURF["gdoor.main." + k] = mainDoorBase(side);
    SURF["gdoor.nose." + k] = noseDoorBase(side);
    SURF["gdoor.leaf." + k] = mainLeafBase(side);
  }
  SURF["door.liftfan"] = liftDoorBase();
  for (const m of Object.values(SURF)) { edgesOf(m); cornerGroups(m); }
  return SURF;
}
const rotKeep = (m, o, a, ang) => { const r = rotMesh(m, o, a, ang); return r; };

function controlSurfaceParts(s, add) {
  const B = surfBases();
  for (const side of [1, -1]) {
    const k = side > 0 ? "port" : "stbd", sfx = "." + k;
    // stabilator: pitch about the spindle, trailing edge up = positive s.stab
    add("stab" + sfx, rotKeep(B["stab" + sfx], [STAB.pivot, 0, STAB.z], [0, 1, 0], (s.stab || 0) * D2R), { tone: "hi", smooth: true, bias: -0.5 });
    // rudder: about its hinge line, positive s.rud = trailing edge to port
    const r = B["rudder" + sfx];
    add("rudder" + sfx, rotKeep(r, r.hinge.o, r.hinge.a, -(s.rud || 0) * D2R), { tone: "hi", smooth: true, bias: 0.5, id: "rudder" + sfx });
  }
}

// lift-fan upper door: a shell on the spine contour (x 0.78…3.05, y ±0.6), 7 cm thick, hinged at its aft edge
const LIFT = { x0: 0.78, x1: 3.05, w: 0.6, thick: 0.07 };
// spine profile along x, and the cross-curvature of the mid-door station across y, so the shell follows the spine
// without the forebody's narrowing twisting its forward corners
const liftDoorSurf = (u, v) => { const x = lerp(LIFT.x0, LIFT.x1, u), y = lerp(LIFT.w, -LIFT.w, v); return [x, y, topAt(x) + (skinZ(1.9, y) - topAt(1.9)) + 0.014]; };
const liftHingeZ = () => skinZ(LIFT.x0, 0) + 0.014 - LIFT.thick / 2;
function liftDoorBase() {
  const m = shellMesh(liftDoorSurf, [0, 0.045, 0.26, 0.5, 0.74, 0.955, 1], [0, 0.06, 0.3, 0.5, 0.7, 0.94, 1], LIFT.thick, [0, 0, 1]);
  // inner structure: three frames across, two longerons, an edge frame: webs 6 cm deep standing on the inner skin
  const inn = (u, v, d = 0) => { const p = liftDoorSurf(u, v), n = m.nrmAt(u, v); return V3.sub(p, V3.mul(n, LIFT.thick + 0.004 + d)); };
  const webs = [];
  const web = (pts) => webs.push([...pts.map((q) => inn(q[0], q[1])), ...pts.slice().reverse().map((q) => inn(q[0], q[1], 0.06))]);
  for (const u of [0.26, 0.5, 0.74]) web([[u, 0.06], [u, 0.5], [u, 0.94]]);
  for (const v of [0.3, 0.7]) web([[0.045, v], [0.26, v], [0.5, v], [0.74, v], [0.955, v]]);
  m.innerWebs = webs;
  m.innerN = [0, 0, -1];
  return m;
}
// aux inlet doors: two shells behind the fan door (x −0.35…0.55), hinged aft, 4 cm thick
function auxDoorBase(side) {
  const surf = (u, v) => { const x = lerp(-0.35, 0.55, u), y = side * lerp(0.12, 0.5, v); return [x, y, skinZ(x, y) + 0.012]; };
  const m = shellMesh(surf, [0, 0.08, 0.5, 0.92, 1], [0, 0.12, 0.5, 0.88, 1], 0.04, [0, 0, 1]);
  m.hingeZ = skinZ(-0.35, side * 0.3) + 0.012 - 0.02;
  return m;
}
// main-gear door: the lower skin outboard of the well (x −0.75…1.0, |y| 1.0…1.6), hinged on its outer edge
function mainDoorBase(side) {
  const surf = (u, v) => { const x = lerp(1.0, -0.75, u), y = side * lerp(1.6, 1.0, v); return [x, y, skinZ(x, y, false) - 0.004]; };
  const m = shellMesh(surf, [0, 0.06, 0.5, 0.94, 1], [0, 0.08, 0.5, 0.92, 1], 0.03, [0, 0, -1]);
  m.hinge = [0, side * 1.6, skinZ(0.1, side * 1.6, false)];
  m.outline = [];
  for (let i = 0; i <= 8; i++) m.outline.push(surf(i / 8, 1));
  for (let i = 0; i <= 6; i++) m.outline.push(surf(1, 1 - i / 6));
  for (let i = 8; i >= 0; i--) m.outline.push(surf(i / 8, 0));
  return m;
}
// main-gear inboard leaf: the skin between the main door and the bay's inner wall (x −0.6…1.06, |y| 0.66…1.0),
// hinged on its inboard edge; shut with the leg down and stowed, open only while the leg travels
function mainLeafBase(side) {
  const surf = (u, v) => { const x = lerp(1.06, -0.6, u), y = side * lerp(1.0, 0.66, v); return [x, y, skinZ(x, y, false) - 0.004]; };
  const m = shellMesh(surf, [0, 0.06, 0.5, 0.94, 1], [0, 0.1, 0.5, 0.9, 1], 0.03, [0, 0, -1]);
  m.hinge = [0, side * 0.66, skinZ(0.2, side * 0.66, false)];
  m.outline = [];
  for (let i = 0; i <= 8; i++) m.outline.push(surf(i / 8, 0));
  for (let i = 0; i <= 6; i++) m.outline.push(surf(1, i / 6));
  for (let i = 8; i >= 0; i--) m.outline.push(surf(i / 8, 1));
  return m;
}
// nose-gear doors: two leaves either side of the centreline (x 4.4…6.5), hinged on their outer edges
function noseDoorBase(side) {
  const surf = (u, v) => { const x = lerp(6.5, 4.4, u), y = side * lerp(0.24, 0.015, v); return [x, y, skinZ(x, y, false) - 0.004]; };
  const m = shellMesh(surf, [0, 0.06, 0.5, 0.94, 1], [0, 0.15, 0.85, 1], 0.025, [0, 0, -1]);
  m.hinge = [0, side * 0.24, skinZ(5.4, side * 0.24, false)];
  return m;
}

// the door shells, their rams and hinges; the fan bay / well itself stays with each renderer
function doorParts(s, add) {
  const B = surfBases();
  const hz = liftHingeZ();
  const hinge = [LIFT.x0, 0, hz];
  const dAng = -s.door * 68 * D2R;
  const dRot = (p) => rot(p, hinge, [0, 1, 0], dAng);
  const base = B["door.liftfan"];
  const door = rotMesh(base, hinge, [0, 1, 0], dAng);
  door.innerWebs = base.innerWebs.map((w) => w.map(dRot));
  door.innerN = rot(base.innerN, [0, 0, 0], [0, 1, 0], dAng);
  add("door.liftfan", door, { tone: "hi", bias: 9, smooth: true, id: "door.liftfan" });
  // the rams and hinge sit on the door's inner side: in front of it when that side faces the camera, else behind
  const inSide = { to: ["door.liftfan"], d: 0.02, side: door.innerN };
  // hinge barrel along the aft edge
  add("door.hinge", rod([LIFT.x0 - 0.01, 0.5, hz], [LIFT.x0 - 0.01, -0.5, hz], 0.03, 10), { tone: "mid", bias: 8.9 });
  // two actuators: cylinder from the bay's aft frame, chrome rod to a lug on the door's inner skin
  if (s.door > 0.03) {
    for (const y of [0.42, -0.42]) {
      const foot = [1.15, y, hz - 0.2];
      const lug = dRot(V3.sub(liftDoorSurf((1.5 - LIFT.x0) / (LIFT.x1 - LIFT.x0), (LIFT.w - y) / (2 * LIFT.w)), [0, 0, LIFT.thick + 0.004]));
      const ax = V3.unit(V3.sub(lug, foot));
      const cl = Math.min(0.28, 0.6 * V3.len(V3.sub(lug, foot)));
      const mid = V3.add(foot, V3.mul(ax, cl));
      add("door.ram", latheAlong(foot, mid, [[0, 0.05], [0.04, 0.05], [0.04, 0.042], [cl, 0.042]], 10), { tone: "mid", bias: 8.6, rel: inSide });
      add("door.rod", rod(mid, lug, 0.02, 8), { tone: "mid", bias: 8.55, cls: "chrome", rel: { ...inSide, d: 0.03 } });
    }
  }
  // auxiliary inlet doors: hinged aft, 35 deg
  for (const side of [1, -1]) {
    const m = B["door.aux." + (side > 0 ? "port" : "stbd")];
    add("door.aux", rotMesh(m, [-0.35, 0, m.hingeZ], [0, 1, 0], -s.aux * 35 * D2R), { tone: "hi", bias: 8 + side * 0.5, smooth: true });
  }
}

// ---- landing gear: round struts (lathe), chrome oleos, torque links, folding drag braces, torus tyres, hubs ----
// Rest geometry is the loaded (compressed) leg on deck. Each leg is split into an upper group that follows the
// retraction (strut, collars) and a lower group that also slides along the strut axis with the oleo stroke and, on
// the nose leg, turns with the steering angle (piston, axle or fork, tyre, hubs). Torque links, drag braces, the
// main legs' side braces and lock links are solved every frame from their end points, so they scissor and fold.
const GEAR = [
  { id: "ng", top: [5.05, 0, -0.5], wheel: [5.05, 0, -1.78], r: 0.3, wid: 0.2, brace: [5.6, 0, -0.55], side: 0, rs: 0.07, ro: 0.048 },
  { id: "mp", top: [-0.55, 1.22, -0.62], wheel: [-0.55, 1.4, -1.72], r: 0.38, wid: 0.28, brace: [0.25, 1.25, -0.66], side: 1, rs: 0.085, ro: 0.058, sideBrace: [0.1, 1.04, -0.5] },
  { id: "ms", top: [-0.55, -1.22, -0.62], wheel: [-0.55, -1.4, -1.72], r: 0.38, wid: 0.28, brace: [0.25, -1.25, -0.66], side: -1, rs: 0.085, ro: 0.058, sideBrace: [0.1, -1.04, -0.5] },
];
// retraction kinematics: main legs swing forward 90° about a trunnion tilted 7° inboard while the strut twists
// 90° about its own axis, so the wheel lies flat above the strut in the bay; the nose leg swings forward 110° so
// the wheel clears the shallow nose bay.
const GEAR_KIN = { mainFold: 90, mainInb: 7, mainTwist: 90, noseFold: 110 };
let GEAR_REST = null;
function gearRest() {
  if (GEAR_REST) return GEAR_REST;
  GEAR_REST = GEAR.map((g) => {
    const up = [], low = [];
    const P = (arr, name, mesh, opt) => { edgesOf(mesh); cornerGroups(mesh); arr.push({ name, mesh, ...opt }); };
    // strut line: from the trunnion to the axle point (main gear: inboard of the wheel, the axle cantilevers out)
    const axleIn = g.side ? V3.add(g.wheel, [0, -g.side * (g.wid / 2 + 0.07), 0]) : V3.add(g.wheel, [0, 0, 0.36]);
    const ax = V3.unit(V3.sub(axleIn, g.top));
    const Ltot = V3.len(V3.sub(axleIn, g.top));
    const kneeS = Ltot * 0.56;
    const knee = V3.add(g.top, V3.mul(ax, kneeS));
    const id = (n) => g.id + "." + n;
    // outer cylinder with a trunnion collar at the top and a gland nut at its foot
    P(up, "gear.strut", latheAlong(g.top, knee, [[0, g.rs * 1.25], [0.06, g.rs * 1.25], [0.07, g.rs], [kneeS - 0.06, g.rs], [kneeS - 0.05, g.rs * 1.18], [kneeS, g.rs * 1.18]], 12), { tone: "mid", id: id("strut") });
    // chrome piston: starts a full stroke up inside the cylinder so the extended leg shows more chrome, then a
    // lower collar where the torque link and axle attach
    // (the piston itself is built each frame from the gland to the collar, so its exposed length follows the stroke)
    const bot = axleIn;
    if (g.side) { // axle stub out to the wheel
      P(low, "gear.axle", rod(bot, g.wheel, 0.04, 8), { tone: "mid", id: id("axle") });
    } else { // nose fork: two arms from the crown down either side of the wheel
      for (const sd of [1, -1]) P(low, "gear.fork", rod(bot, V3.add(g.wheel, [0, sd * (g.wid / 2 + 0.035), 0]), 0.032, 8), { tone: "mid", id: id("fork" + sd), forkSide: sd });
    }
    // tyre (torus) and hubs on both faces
    const hw = g.wid / 2, rr = g.r * 0.3;
    P(low, "gear.tyre", torus(g.wheel, [0, 1, 0], g.r - rr, rr, hw, 20, 8), { tone: "mid", cls: "tyre", sortFaces: true, smooth: true, id: id("tyre") });
    for (const sd of [1, -1]) {
      const hc = V3.add(g.wheel, [0, sd * hw * 0.62, 0]);
      P(low, "gear.hub", latheAlong(hc, V3.add(hc, [0, sd * 0.05, 0]), [[0, g.r * 0.62], [0.025, g.r * 0.6], [0.03, g.r * 0.26], [0.05, g.r * 0.22]], 14), { tone: "hi", cls: "hub", id: id("hub" + sd), hubSide: sd, cull: [0, sd, 0] });
    }
    // torque-link end lugs on the aft face (upper on the strut, lower on the piston collar); arm length fixed so
    // the apex swings out as the oleo compresses and in as it extends
    const f = [-1, 0, 0];
    const ua = V3.add(V3.add(knee, V3.mul(ax, -0.05)), V3.mul(f, g.rs));
    const la = V3.add(V3.add(bot, V3.mul(ax, -0.04)), V3.mul(f, g.ro * 1.3));
    const lk = Math.hypot(V3.len(V3.sub(la, ua)) / 2, 0.22);
    // drag brace: strut attach point and its two segment lengths (locked nearly straight with the gear down)
    const S0 = V3.add(g.top, V3.mul(ax, kneeS * 0.78));
    const out = { g, up, low, knee, bot, Lo0: Ltot - kneeS, S0, l: (V3.len(V3.sub(S0, g.brace)) / 2) * 1.015, kneeS, ax, ua, la, lk };
    if (g.sideBrace) { // side brace from the bay roof (inboard edge of the open bay) to the strut, and the lock link that keeps its knee over centre
      out.T0 = V3.add(g.top, V3.mul(ax, kneeS * 0.62));
      out.sl = (V3.len(V3.sub(out.T0, g.sideBrace)) / 2) * 1.012;
      const K0 = braceJoint3(g.sideBrace, out.T0, out.sl, [0, 0, 1]);
      out.L0 = [-0.15, g.side * 1.08, -0.42]; // lock-link anchor on the bay roof, above and aft of the knee
      out.ll = (V3.len(V3.sub(out.L0, K0)) / 2) * 1.02;
    }
    return out;
  });
  return GEAR_REST;
}
// knee of a two-bar brace of equal bars l from A to S, bent toward `pref` (perpendicular part of it)
function braceJoint3(A, S, l, pref) {
  const d = V3.sub(S, A), L = Math.max(1e-4, V3.len(d)), u = V3.mul(d, 1 / L);
  const dd = Math.min(L, 2 * l - 1e-4);
  const h = Math.sqrt(Math.max(0, l * l - (dd / 2) * (dd / 2)));
  let n = V3.sub(pref, V3.mul(u, V3.dot(pref, u)));
  n = V3.len(n) < 1e-6 ? [0, 0, -1] : V3.unit(n);
  return V3.add(V3.add(A, V3.mul(u, dd / 2)), V3.mul(n, h));
}
// a bay's dark cavity always sits behind its own leg (a zero side vector never faces the camera, so orderParts
// places it just before the earliest of these parts)
const wellRel = (id) => ({ to: ["strut", "oleo", "tyre", "axle", "fork1", "fork-1", "hub1", "hub-1"].map((n) => id + "." + n), d: 0.02, side: [0, 0, 0] });
// gear sequence inside the timeline's retract window (s.gear 1 → 0): doors open further first, the leg moves,
// then the doors close behind it; extension runs the same sequence backwards.
function gearSeq(gear) {
  const r = 1 - gear;
  const move = smoother((r - 0.1) / 0.72); // 0 down … 1 stowed
  const close = smooth(0.85, 1.0, r);
  const over = smooth(0.0, 0.1, r) * (1 - close);
  return { r, move, close, over };
}
// the transforms of one leg for a state: upper group, lower group (stroke, steering) and directions
function gearXf(R, s, q) {
  const g = R.g, top = g.top, f = q.move;
  const steps = [];
  if (g.side) {
    const tw = g.side * GEAR_KIN.mainTwist * D2R * smoother((f - 0.12) / 0.7);
    if (Math.abs(tw) > 1e-6) steps.push([top, R.ax, tw]);
    steps.push([top, [1, 0, 0], -g.side * GEAR_KIN.mainInb * D2R * f]);
    steps.push([top, [0, 1, 0], -GEAR_KIN.mainFold * D2R * f]);
  } else steps.push([top, [0, 1, 0], -GEAR_KIN.noseFold * D2R * f]);
  // compose the rotations (all about axes through the trunnion) into one matrix
  let Mx = [1, 0, 0, 0, 1, 0, 0, 0, 1];
  for (const [, a, ang] of steps) if (ang) {
    const c = Math.cos(ang), sn = Math.sin(ang), t1 = 1 - c, [x, y, z] = a;
    const Rm = [c + x * x * t1, x * y * t1 - z * sn, x * z * t1 + y * sn, y * x * t1 + z * sn, c + y * y * t1, y * z * t1 - x * sn, z * x * t1 - y * sn, z * y * t1 + x * sn, c + z * z * t1];
    const o = Mx; Mx = [];

function orderParts(drawn, V, dW) {

  for (let pass = 0; pass < 2; pass++) for (const d of drawn) {
    const r = d.part.rel; if (!r) continue;
    const vis = r.side ? V3.dot(dW(r.side), V) > 0 : true;

function movingParts(s) {

function nozzleGeometry(deg) {

  const midC = V3.add(rings[3].c, V3.mul(exitDir, (L[4] - L[3]) * 0.55));

  const over = art.planform.map((p) => groundAt(p[0], p[1]) !== null).filter(Boolean).length / art.planform.length;
  const shade = 0.3 * Math.exp(-Math.max(0, h) / 70) * (1 - sm(60, 120, h)) * sm(0.15, 0.85, over) * show;
  if (shade > 0.01) {
    shadow.setAttribute("d", "M" + art.planform.map((p) => at([p[0], p[1], groundAt(p[0], p[1]) ?? 0]).map((v) => v.toFixed(1)).join(" ")).join("L") + "Z");
    shadow.style.opacity = shade.toFixed(3);
    shadow.style.filter = `blur(${(2.2 + Math.max(0, h) * 0.05).toFixed(1)}px)`;
  } else shadow.style.opacity = "0";

  const stovl = s.mode === "stovl";
  const jetL = stovl ? 70 + 85 * s.power : 46;
  const heat = stovl ? 0.3 + 0.7 * s.power : 0.32;
  const jAmp = (stovl ? 0.25 + 0.75 * s.power : 0.5) * show;
  const fanAmp = s.fan * s.door * s.power * show;
  const fanL = 150;
  const WH = impinge(art.exit, art.exitDir, jetL, jAmp);
  const WC = impinge(art.fanExit, art.fanDir, fanL, fanAmp * 1.0);
  if (layer) {
    if (jAmp + fanAmp > 0.002) {
      layer.draw({
        uJE: art.exit, uJD: art.exitDir, uJ: [jAmp, jetL, art.exitR * 0.92, heat],
        uFE: art.fanExit, uFD: art.fanDir, uF: [fanAmp * 1.05, fanL, 6.4, 0],
        uPL: art.posts[0], uPR: art.posts[1], uP: s.posts * s.power * show * 0.7,
        uWH: WH, uWC: WC, uFade: 1,

    const e = at(art.exit), f = at(V3.add(art.exit, V3.mul(art.exitDir, jetL * 0.7)));
    const dx = f[0] - e[0], dy = f[1] - e[1], l = Math.hypot(dx, dy) || 1;
    const nx = -dy / l, ny = dx / l, r0 = art.exitR * 0.9 * P.scale * 1.26, r1 = r0 * 2.6;

    fbJet.style.opacity = (jAmp * 0.6).toFixed(3);
    fbWash.setAttribute("d", WH[2] > 0.02 ? ring(WH[0], WH[1], WH[3] * 1.4) : "");
    fbWash.style.opacity = Math.min(1, WH[2]).toFixed(3);
  }

  const ph = PHASES[s.phase];
  readout.textContent = `${ph.name} · ${s.word}`;
  cell.phase.textContent = `${s.phase + 1} · ${ph.name}`;
  cell.kt.textContent = fmt(s.kt);
  cell.ft.textContent = fmt(s.ft);
  cell.noz.textContent = `${Math.round(s.nozzle)}°`;
  cell.fan.innerHTML = s.door < 0.03 ? "停转 · 舱门关闭" : s.fan < 0.04 ? "舱门打开中" : `${fmt(s.rpm)}<small>转/分</small>`;
  cell.kn.innerHTML = stovl && s.phase === 2
    ? `${fmt(s.kN)}<small>风扇 ${fmt(s.fanKN)} · 喷管 ${fmt(s.nozKN)} · 滚转喷口 ${fmt(s.postKN)}</small>`
    : stovl ? `${fmt(s.kN)}<small>短距起飞 · 最大干推力</small>` : `${fmt(s.kN)}<small>部分功率</small>`;
  trackFill.style.width = `${((T / CYCLE) * 100).toFixed(2)}%`;
  phaseBtns.forEach((b, i) => b.toggleAttribute("data-on", i === s.phase));
  if (s.phase !== lastPhase) {
    if (lastPhase !== -1) liveRegion.textContent = ph.name;
    lastPhase = s.phase;
  }
}
function ring(x, y, r) {
  const pts = [];
  for (let i = 0; i <= 40; i++) { const a = (i / 40) * Math.PI * 2; pts.push(at([x + Math.cos(a) * r, y + Math.sin(a) * r, 0])); }
  return "M" + pts.map((p) => p.map((v) => v.toFixed(1)).join(" ")).join("L") + "Z";
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  let moving = false;
  if (!calm) {
    moving = settle(fade, fadeTarget, dt, 0.06, false) || moving;
    if (pending !== null && fade.x < 0.02) { T = pending; pending = null; fadeTarget = 1; moving = true; }
  } else { fade.x = 1; }
  if (playing && !calm && pending === null) { T = (T + dt) % CYCLE; moving = true; }
  if (!calm) {
    const s = stateAt(T);
    fanPhase += dt * 4.2 * s.fan * (playing ? 1 : 0);
    clock += dt;
  }
  if (XR.step(dt, stateAt(T), playing)) moving = true;
  if (moving || dirty || playing) { draw(dt); dirty = false; }
  frame = visible && (moving || playing || pending !== null) ? requestAnimationFrame(tick) : 0;
}
function run() { dirty = true; if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } }
const XR = makeXray({ root, stage, run, still }); // 「透视」 toggle (xray.js)
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
addEventListener("resize", () => run());
still.addEventListener?.("change", () => { if (still.matches) { setPlaying(false); T = PHASES[phaseOf(T)].key; } run(); });

playBtn.addEventListener("click", () => setPlaying(!playing));
phaseBtns.forEach((b) => b.addEventListener("click", () => {
  const i = Number(b.dataset.phase);
  jumpTo(still.matches || !playing ? PHASES[i].key : PHASES[i].start);
}));
stage.addEventListener("keydown", (event) => {
  const key = event.key;
  if (key === " " || key === "Enter") { event.preventDefault(); setPlaying(!playing); }
  else if (key === "1" || key === "2" || key === "3") { const i = Number(key) - 1; jumpTo(!playing || still.matches ? PHASES[i].key : PHASES[i].start); }
  else if (key === "ArrowRight" || key === "ArrowLeft") {
    event.preventDefault();
    setPlaying(false);
    T = (T + (key === "ArrowRight" ? 0.5 : -0.5) * (event.shiftKey ? 4 : 1) + CYCLE) % CYCLE;
    run();
  } else if (key === "Home") { event.preventDefault(); jumpTo(0); }
});
// drag across the stage scrubs through the phase on screen
let drag = null;
stage.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  const i = phaseOf(T);
  drag = { id: event.pointerId, i, x: event.clientX, moved: false };
});
stage.addEventListener("pointermove", (event) => {
  if (!drag || event.pointerId !== drag.id) return;
  if (!drag.moved && Math.abs(event.clientX - drag.x) < 4) return;
  if (!drag.moved) { drag.moved = true; try { stage.setPointerCapture(event.pointerId); } catch {} setPlaying(false); }
  const box = stage.getBoundingClientRect();
  const u = Math.min(1, Math.max(0, (event.clientX - box.left) / box.width));
  const ph = PHASES[drag.i];
  T = ph.start + u * (ph.end - ph.start - 0.01);
  run();
});
const endDrag = (event) => { if (drag && event.pointerId === drag.id) { try { stage.releasePointerCapture(event.pointerId); } catch {} drag = null; } };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
setPlaying(playing);
run();

}
// 一屏适配：说明浮层的上下边界、Esc/点外部收起、舞台尺寸变化时让渲染与 WebGL 重新对位
{
  const fig = document.querySelector(".f35-fit");
  const plate = fig && fig.querySelector(".iso-plate");
  const head = fig && fig.querySelector(".iso-plate-corners");
  const controls = fig && fig.querySelector(".f35-controls");
  const strip = fig && fig.querySelector(".f35-strip");
  const notes = fig && fig.querySelector(".f35-notes");
  const stage = fig && fig.querySelector(".f35-stage");
  const box = fig && fig.querySelector(".f35-box");
  if (fig && plate && notes) {
    const place = () => {
      // 浮层的定位容器：桌面为图卡，手机（图卡不定位）为整页，可用图卡上方的空白
      const host = getComputedStyle(plate).position === "static" ? plate.closest(".iso-page") : plate;
      const p = host.getBoundingClientRect();
      const top = host === plate ? head.getBoundingClientRect().bottom - p.top + 4 : 8;
      const below = Math.min(controls.getBoundingClientRect().top, strip.getBoundingClientRect().top);
      host.style.setProperty("--f35-ov-top", `${Math.max(0, top).toFixed(0)}px`);
      host.style.setProperty("--f35-ov-bot", `${Math.max(0, p.bottom - below + 6).toFixed(0)}px`);
      // 不支持容器查询单位的浏览器：用脚本算出舞台宽度
      if (!CSS.supports("width: 1cqh")) {
        const narrow = matchMedia("(max-width: 700px)").matches;
        const w = Math.min(box.clientWidth * (narrow ? 1.28 : 1), box.clientHeight * 1.6);
        stage.style.width = `${Math.floor(w)}px`;
      }
    };
    notes.addEventListener("toggle", place);
    notes.addEventListener("keydown", (e) => { if (e.key === "Escape" && notes.open) { notes.open = false; notes.querySelector("summary").focus(); } });
    document.addEventListener("pointerdown", (e) => { if (notes.open && !notes.contains(e.target)) notes.open = false; });
    let last = "";
    new ResizeObserver(() => {
      place();
      const r = stage.getBoundingClientRect();
      const key = `${r.width.toFixed(1)}x${r.height.toFixed(1)}`;
      if (key !== last) { last = key; dispatchEvent(new Event("resize")); }
    }).observe(box);
    addEventListener("resize", place);
    place();
  }
}
