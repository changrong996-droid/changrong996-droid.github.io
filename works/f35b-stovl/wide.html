/* ---- round 3: low-visibility F-35B scheme ----

.f35-ac, .fc-under-ac, .fc-door-ac {
  --anatomy-top: #b3b7ba; --anatomy-shade-3: #a5a9ad; --anatomy-shade-2: #979ba0; --anatomy-shade-1: #8a8e93; --anatomy-shade-0: #7c8085;

  --f35-glass-0: #6f6b5f; --f35-glass-1: #7b776b; --f35-glass-2: #878377; --f35-glass-3: #949084; --f35-glass-4: #a29e92;
}

  top: var(--f35-ov-top, 40px); bottom: var(--f35-ov-bot, 60px); display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }

35-tick" style="left:25.93%"></span><span class="f35-tick" style="left:44.56%"></span></span><details class="f35-notes"><summary class="f35-btn f35-notes-btn" aria-controls="f35-notes" title="展开或收起图注与说明（Esc 收起）"><span class="f35-notes-chev" aria-hidden="true"></span>说明</summary><div class="f35-notes-body" id="f35-notes"><div class="f35-notes-panel iso-legend" role="region" aria-label="图注与说明"><span class="f35-notes-head">图 1 · F-35B 短距起飞/垂直降落循环</span><p class="f35-notes-ops f35-lite-row"><button type="button" class="f35-btn lite-btn" data-lite aria-pressed="false" aria-label="低配模式：关。按下关闭部分特效以提高流畅度（L）"><span>低配模式<span class="xr-colon">：</span><span data-lite-state>关</span></span><span class="f35-num">L</span></button><span>关闭尾焰与下洗的 WebGL 特效（改为简化尾焰）、甲板细节和雷达转动，适合较慢的电脑；播放时帧率持续低于 30 帧/秒约 2 秒会自动开启，按 L 或此按钮可随时切换。网址加 #lite 直接打开低配模式。</span></p><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>三轴承旋转喷管</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>机体、舱门与起落架</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>的里雅斯特号飞行甲板与 12° 滑跃甲板</span></span><p class="iso-caption" id="f35-caption">F-35B：机长 15.6 米，翼展 10.7 米。短距起飞/垂直降落模式下，F135-PW-600 发动机经传动轴驱动座舱后方直径 50 英寸的两级升力风扇（冷推力约 89 千牛），三轴承旋转喷管 2.5 秒内可下偏至 95°（热推力约 80 千牛），并从外涵引气至两侧机翼内的滚转喷口（每侧约 8.7 千牛）；短距起飞推力为 181 千牛，喷管偏转时不能开加力。本图甲板滑跑 67 米至 12° 滑跃甲板末端，离舰时相对甲板约 48 节，另加 20 节甲板风。垂直降落先在舷侧 40 英尺高度悬停，横移到降落点上方，以约 5 英尺/秒下降，接地前减至 3 英尺/秒。15 米以上的高度按压缩比例绘制，250 节的通场放慢约 6 倍以便观看，空速含 20 节甲板风，传动轴转速为估计值（离合器在最高约 8,500 转/分时接合）。</p><p class="f35-notes-ops">舰船：意大利海军「的里雅斯特号」两栖攻击舰（L 9890，LHD，带坞舱的两栖攻击舰，不是航空母舰）。全长 245 米；全通式飞行甲板长 230 米、宽 36 米（约 7,400 平方米），舰艏左舷为 12° 滑跃甲板；型深 27.7 米、吃水 7.2 米，飞行甲板高出水线约 20.5 米。右舷舰岛分为前后两座：前舰岛是航海舰桥和平台指挥中心（舷号 L 9890），顶部是旋转的 Kronos Power Shield L 波段有源相控阵对空搜索雷达，另有四面固定的 Kronos StarFire X 波段雷达阵面；后舰岛是飞行管制塔，玻璃窗朝向甲板，上面立着通信与电子战桅杆；后舰岛之后两舷各有一部 15 × 15 米的舷侧升降机（展开时全宽 55 米）。甲板左舷 6 个、右舷 3 个起降点（含舰艏右舷的搜救起降点），舰艉是坞舱门。武器为 3 门莱昂纳多 76/62 毫米「超快速」舰炮（舰艏左右舷各 1 门、舰艉 1 门，各配 NA-30S Mk2 火控指挥仪）、3 座 KBA 25 毫米遥控炮和 2 具 ODLS-20 诱饵发射器；右舷预留的垂直发射装置尚未安装，图中不画。舰岛、桅杆、舷台和炮位的位置与高度按照片简化绘制，StarFire 阵面画在前舰岛上层四角、排烟格栅位置均为估计，起降点编号仅为示意。该舰的舰载机包括 AW101、NH90（意大利海军编号 SH90A）、AW129D 直升机和 F-35B 战斗机；甲板上停放了一架 AW101（三台发动机，五片旋翼向后折叠）、一架 SH90A（雷达罩机头、滑动舱门，四片旋翼向后折叠）和一架 AW129D 攻击直升机（串列双座、短翼、机头转塔，旋翼未折叠），后舰岛旁一架 F-35B，以及一辆牵引车、一辆消防车和几名穿不同颜色背心的甲板人员——直升机外形按公开尺寸简化，停放位置、朝向和车辆外观均为示意，全部在右舷后部，避开 F-35B 的滑跑道、悬停点和尾焰。舰艉是铰接在底边的坞舱跳板门；艉部舷侧的舰名「TRIESTE」照片上见于右舷，左舷按对称画出。</p><p class="f35-notes-ops">透视（X）：机体蒙皮半透明，显示升力系统——F135 发动机、传动轴（带两个挠性联轴节）、离合器、锥齿轮箱、升力风扇（两级对转）和两侧滚转管路；以及进气系统——两侧进气道（DSI，无附面层隔道的鼓包进气口）、向内向上弯折并在发动机风扇前汇合的 S 形进气道（从正前方看不到风扇面，利于隐身）、升力风扇门后方的辅助进气口及其通往进气道汇合段的短管，和发动机核心机外的外涵道（滚转管路的气源）。升力风扇工作时离合器接合，传动轴随之转动；常规飞行时离合器分离，传动轴静止；滚转喷口工作时管路内显示气流；发动机运转时进气道内始终有气流（随油门加快），辅助进气门打开时辅助进气管内显示气流。</p><p class="f35-notes-ops">操作：空格 播放，1–3 阶段，X 透视，L 低配模式，←→ 步进，拖动。</p></div></div></details></div><span class="f35-sr" aria-live="polite" data-live></span></div></figure></main><script type="module">const AZIMUTH=45,ELEVATION=30,SHADES=4,RADIANS=Math.PI/180,UNIT=Math.sqrt(1.6);function cameraOf({scale:t,azimuth:o=45,elevation:e=30}){const n=o*RADIANS,a=e*RADIANS;return{sinA:Math.sin(n),cosA:Math.cos(n),sinE:Math.sin(a),cosE:Math.cos(a),k:t*UNIT}}function iso([t,o,e],n){const{origin:a}=n,{sinA:s,cosA:r,sinE:i,cosE:c,k:l}=cameraOf(n);return[a[0]-(t*s-o*r)*l,a[1]+((t*r+o*s)*i-e*c)*l]}function towardViewer(t){const{sinA:o,cosA:e}=cameraOf(t);return[e,o]}function depthOf([t,o,e],n){const{sinA:a,cosA:s,sinE:r,cosE:i}=cameraOf(n);return(t*s+o*a)*i+e*r}const tenth=t=>{const o=(Math.round(10*t)/10).toFixed(1).replace(/\.0$/,"");return"-0"===o?"0":o};function pathOf(t,o=!1){retur
