/* canopy: smoky gold tint (the F-35's indium-tin-oxide coated glass), a highlight streak */

/* ---- round 3: low-visibility F-35B scheme ----

   panel lines and part outlines darker than the skin; darker radar-absorbent edge bands; low-vis grey markings. */
.f35-ac, .fc-under-ac {
  --anatomy-top: #b3b7ba; --anatomy-shade-3: #a5a9ad; --anatomy-shade-2: #979ba0; --anatomy-shade-1: #8a8e93; --anatomy-shade-0: #7c8085;

  --f35-glass-0: #6f6b5f; --f35-glass-1: #7b776b; --f35-glass-2: #878377; --f35-glass-3: #949084; --f35-glass-4: #a29e92;
}

.f35-stage { overflow: hidden; }
/* line weights: the kit draws strokes non-scaling; --anatomy-weight grows gently with the zoom (set per frame) */
.f35-stage .ac-part path[data-s] { stroke-width: calc(var(--anatomy-weight) * .8); }
.fc-mm, .fc-under { --anatomy-weight: .6px; }
.ac-cav { fill: var(--f35-cav); stroke: none; }
.ac-well { fill: #8d8d92; stroke: none; }
.ac-ring { fill: var(--anatomy-shade-1); stroke: var(--anatomy-mid); stroke-width: var(--anatomy-weight); }
.ac-blade { fill: var(--anatomy-shade-3); stroke: var(--anatomy-lo); stroke-width: calc(var(--anatomy-weight) * .8); stroke-linejoin: round; }
.ac-blade2 { fill: #b9b9bd; stroke: #8a8a8f; stroke-width: calc(var(--anatomy-weight) * .6); stroke-linejoin: round; }
.ac-blur { fill: var(--anatomy-shade-2); stroke: none; }
.ac-hub { fill: var(--anatomy-shade-2); stroke: var(--anatomy-mid); stroke-width: var(--anatomy-weight); }
.ac-spinner { fill: var(--anatomy-top); stroke: var(--anatomy-mid); stroke-width: var(--anatomy-weight); }
.ac-blade { stroke: var(--anatomy-lo) !important; }
.ac-part.hub path[data-s="c"] { fill: #6b6f74; stroke: #6b6f74; }
.ac-part.petals path[data-s="c"] { fill: #3f4246; stroke: #3f4246; }

/* minimap: the wide framing in miniature, with the follow view and the jet */
.fc-mm { position: absolute; left: 10px; bottom: 10px; width: 210px; padding: 6px 6px 18px; background: color-mix(in srgb, var(--anatomy-card) 92%, transparent); box-shadow: 0 0 0 1px var(--anatomy-faint); border-radius: 3px; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .5s var(--anatomy-ease), transform .5s var(--anatomy-ease); }
.f35-stage[data-follow] .fc-mm { opacity: 1; transform: none; }
.fc-mm-svg { display: block; width: 100%; height: auto; overflow: hidden; }
.fc-mm-svg path, .fc-mm-svg rect { vector-effect: non-scaling-stroke; }
.fc-mm-svg .iso-line, .fc-mm-svg .iso-solid path { stroke-width: .6px; }
.fc-mm-ramp { fill: var(--anatomy-shade-2); stroke: var(--anatomy-lo); stroke-width: .6px; }
.fc-mm-frame { fill: none; stroke: var(--anatomy-faint); stroke-width: .8px; stroke-dasharray: 3 3; }
.fc-mm-view { fill: color-mix(in srgb, var(--anatomy-hi) 6%, transparent); stroke: var(--anatomy-hi); stroke-width: 1.1px; }
.fc-mm-ac { fill: var(--anatomy-hi); stroke: var(--anatomy-card); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.fc-mm-label { white-space: nowrap; position: absolute; left: 8px; bottom: 4px; font: 9px/1 var(--anatomy-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--anatomy-muted); }
.fc-view-icon { width: 10px; height: 8px; box-shadow: inset 0 0 0 1px currentColor; border-radius: 1px; position: relative; }
.fc-view-icon::after { content: ""; position: absolute; left: 3px; top: 2px; width: 4px; height: 4px; background: currentColor; }
.fc-view[aria-pressed="false"] .fc-view-icon::after { left: 1px; top: 1px; width: 8px; height: 6px; background: none; box-shadow: inset 0 0 0 1px currentColor; }
.fc-view[aria-pressed="true"] { color: var(--anatomy-strong); box-shadow: var(--anatomy-lift), inset 0 0 0 1px var(--anatomy-mid); }
@media (max-width: 700px) { .fc-mm { width: 92px; left: calc(11% + 6px); bottom: 6px; padding: 3px; } .fc-mm .fc-mm-label { display: none; } }

/* underside inset */
.fc-under { position: absolute; right: 10px; bottom: 10px; width: 400px; padding: 4px 4px 18px; background: color-mix(in srgb, var(--anatomy-card) 94%, transparent); box-shadow: 0 0 0 1px var(--anatomy-faint); border-radius: 3px; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .6s var(--anatomy-ease), transform .6s var(--anatomy-ease); }
.fc-under[data-on] { opacity: 1; transform: none; }
.fc-under-svg { display: block; width: 100%; height: auto; }
.fc-under .fc-mm-label { left: 8px; }
/* the follow view is a window onto the scene: a hairline frame where the drawing is cut */
.f35-stage::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px var(--anatomy-faint); opacity: 0; transition: opacity .5s var(--anatomy-ease); pointer-events: none; }
.f35-stage[data-follow]::after { opacity: 1; }
@media (max-width: 700px) { .fc-under { display: none; } }
@media (prefers-reduced-motion: reduce) { .fc-mm, .fc-under, .f35-stage::after { transition: none; } }
.fc-halo path { vector-effect: none; fill: var(--anatomy-halo); stroke: var(--anatomy-halo); stroke-linejoin: round; opacity: calc(var(--anatomy-halo-opacity) * .09); }

/* ---- 一屏适配（fit-viewport）：整页恰好一屏，无页面滚动；图形按宽高同时等比缩放 ---- */
html, body.iso { height: 100%; overflow: hidden; }
body.iso .iso-page { width: 100%; max-width: 1640px; height: 100vh; height: 100dvh; margin: 0 auto; padding: 10px 14px; display: flex; flex-direction: column; }
.f35-fit.iso-figure { margin: 0; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.f35-fit .iso-plate { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 9px 14px 10px; overflow: hidden; }

/* 标题行：图号、标题、操作提示、实时读数排成一行（不再绝对定位到四角） */
.f35-fit .iso-plate-corners { position: static; inset: auto; display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 14px; margin: 0 0 7px; flex: none; }
.f35-fit .iso-plate-corner { position: static; white-space: nowrap; }
.f35-fit .iso-plate-corner[data-corner="hint"] { margin-left: auto; max-width: none; }
.f35-fit .iso-plate-corner[data-corner="readout"] { min-width: 9em; text-align: right; }

/* 图形区：占满剩余高度；舞台保持 1280:800，取宽、高两者中较紧的一边 */
.f35-box { position: relative; flex: 1 1 auto; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.f35-fit .f35-stage { flex: none; width: 100%; aspect-ratio: 1280 / 800; margin: 0; }
@supports (width: 1cqh) { .f35-fit .f35-stage { width: min(100cqw, 160cqh); } }
.f35-fit .fc-mm { width: clamp(96px, 16.4%, 210px); }
.f35-fit .fc-under { width: clamp(180px, 31.25%, 400px); }

/* 读数条与控件：紧凑 */
.f35-fit .f35-strip { margin: 8px 0 0; flex: none; }
.f35-fit .f35-cell { padding: 4px 9px 5px; gap: 2px; }
.f35-fit .f35-cell-k { font-size: 10.5px; }
.f35-fit .f35-cell-v { font-size: 14px; line-height: 1.2; }
.f35-fit .f35-controls { margin-top: 8px; gap: 6px; flex: none; }
.f35-fit .f35-btn { padding: 6px 11px; }

/* 图注与说明：默认收起，展开时浮在图形上方，不推动布局 */
.f35-notes { display: block; flex: none; }
.f35-notes > summary { list-style: none; }
.f35-notes > summary::-webkit-details-marker { display: none; }
.f35-notes > summary::marker { content: ""; }
.f35-notes-chev { width: 6px; height: 6px; border-right: 1.2px solid currentColor; border-bottom: 1.2px solid currentColor; transform: translateY(1px) rotate(-135deg); transition: transform .25s var(--anatomy-ease); }
.f35-notes[open] > summary { color: var(--anatomy-strong); box-shadow: var(--anatomy-lift), inset 0 0 0 1px var(--anatomy-mid); }
.f35-notes[open] .f35-notes-chev { transform: translateY(-2px) rotate(45deg); }
.f35-notes-body { position: absolute; z-index: 6; left: 0; right: 0; margin: 0 auto; width: min(780px, 100% - 28px);
  top: var(--f35-ov-top, 40px); bottom: var(--f35-ov-bot, 60px); display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
.f35-notes-panel { pointer-events: auto; max-height: 100%; overflow: auto; overscroll-behavior: contain; background: color-mix(in srgb, var(--anatomy-card) 96%, transparent); box-shadow: 0 0 0 1px var(--anatomy-faint), 0 8px 24px -10px #0000002e; border-radius: 4px; padding: 12px 16px 13px; }
.f35-fit .f35-notes-panel.iso-legend { margin: 0; gap: 7px; font-size: 12.5px; line-height: 1.65; }
.f35-notes-panel .iso-caption { margin: 0; }
.f35-notes-ops { margin: 0; color: var(--anatomy-muted); font-size: 11.5px; }
.f35-notes-head { font-size: 11.5px; letter-spacing: .06em; color: var(--anatomy-text); }
@media (prefers-reduced-motion: reduce) { .f35-notes-chev { transition: none; } }

/* 中等宽度：读数条两行三列也可 */
@media (max-width: 860px) and (min-width: 701px) { .f35-fit .f35-cell-v { font-size: 13px; } }

/* 手机：上下堆叠；舞台按原设计放大到 128% 并在图形区内裁切；整组内容垂直居中 */
@media (max-width: 700px) {
  body.iso .iso-page { padding: 8px; justify-content: center; position: relative; }
  .f35-fit.iso-figure { flex: 0 1 auto; }
  .f35-fit .iso-plate { flex: 0 1 auto; padding: 8px 10px 9px; position: static; }
  .f35-fit .iso-plate-corner[data-corner="hint"] { display: none; }
  .f35-fit .iso-plate-corner[data-corner="title"] { margin-right: auto; }
  .f35-fit .iso-plate-corner[data-corner="readout"] { min-width: 0; flex: 1 0 100%; text-align: left; }
  .f35-box { flex: 0 1 auto; height: calc((100vw - 36px) * .8); }
  .f35-fit .f35-stage { width: 128%; margin-left: 0; }
  @supports (width: 1cqh) { .f35-fit .f35-stage { width: min(128cqw, 160cqh); } }
  .f35-fit .f35-cell { padding: 5px 7px 6px; }
  .f35-fit .f35-btn { padding: 6px 9px; }
  .f35-notes-body { width: calc(100% - 16px); }
  .f35-notes-panel { box-shadow: 0 0 0 1px var(--anatomy-mid), 0 8px 24px -10px #0000003a; }
}
@media (max-height: 560px) { .f35-fit .f35-cell { padding: 3px 8px 4px; } .f35-fit .f35-controls, .f35-fit .f35-strip { margin-top: 5px; } }
.f35-fit .f35-stage:focus-visible { outline-offset: -2px; }

pan class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>三轴承旋转喷管</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>机体、舱门与起落架</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>飞行甲板与 12° 滑跃甲板</span></span><p class="iso-caption" id="f35-caption">F-35B：机长 15.6 米，翼展 10.7 米。短距起飞/垂直降落模式下，F135-PW-600 发动机经传动轴驱动座舱后方直径 50 英寸的两级升力风扇（冷推力约 89 千牛），三轴承旋转喷管 2.5 秒内可下偏至 95°（热推力约 80 千牛），并从外涵引气至两侧机翼内的滚转喷口（每侧约 8.7 千牛）；短距起飞推力为 181 千牛，喷管偏转时不能开加力。本图甲板滑跑 67 米至 12° 滑跃甲板末端，离舰时相对甲板约 48 节，另加 20 节甲板风。垂直降落先在舷侧 40 英尺高度悬停，横移到降落点上方，以约 5 英尺/秒下降，接地前减至 3 英尺/秒。15 米以上的高度按压缩比例绘制，250 节的通场放慢约 6 倍以便观看，空速含 20 节甲板风，传动轴转速为估计值（离合器在最高约 8,500 转/分时接合）。</p><p class="f35-notes-ops">操作：空格 播放，1–3 阶段，V 视角，←→ 步进，拖动。</p></div></div></details></div><span class="f35-sr" aria-live="polite" data-live></span></div></figure></main><script type="module">const AZIMUTH = 45;

function surfacesAt(t) {
  t = ((t % CYCLE) + CYCLE) % CYCLE;
  let stab = 0, rud = 0;
  if (t < A.end) {
    stab = 3 * smooth(A.toe - 1.0, A.toe + 0.3, t) + 9 * bumpW(A.exit - 0.45, A.exit, A.exit + 0.3, A.exit + 1.6, t);
    stab = lerp(stab, 2, smooth(A.exit + 1.0, A.end, t));
    rud = 1.5 * Math.sin((t - A.exit) * 2.1) * bumpW(A.exit + 0.2, A.exit + 1.0, A.end - 1.0, A.end, t);
  } else if (t < B.end) {
    const env = bumpW(B.start, B.start + 1, B.end - 1, B.end, t);
    stab = 2 + 0.5 * Math.sin((t - B.start) * 2.7) * env;
    rud = 0.8 * Math.sin((t - B.start) * 1.9 + 0.5) * env;
  } else {
    const tau = t - C.start;
    const env = bumpW(C.start + 0.8, C.start + 2.5, C.tTouch - 0.3, C.tTouch + 0.5, t);
    stab = lerp(2, 1, smooth(C.start, C.tHold, t)) + 1.4 * (Math.sin(tau * 1.7) + 0.6 * Math.sin(tau * 3.1 + 1)) * env;
    stab = lerp(stab, 0, smooth(C.tTouch, C.tTouch + 1.5, t));

}

// ---- Aircraft geometry (body frame, metres: x forward, y to port, z up) ----------------------
const V3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: (a) => Math.hypot(a[0], a[1], a[2]),
  unit: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
};


function newell(pts) {
  let nx = 0, ny = 0, nz = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    nx += (a[1] - b[1]) * (a[2] + b[2]);
    ny += (a[2] - b[2]) * (a[0] + b[0]);
    nz += (a[0] - b[0]) * (a[1] + b[1]);
  }
  return [nx, ny, nz];
}
// newell() over a face given as vertex indices, without building the point list (same arithmetic)
function newellIdx(face, v) {
  let nx = 0, ny = 0, nz = 0;
  const n = face.length;
  for (let i = 0; i < n; i++) {
    const a = v[face[i]], b = v[face[(i + 1) % n]];
    nx += (a[1] - b[1]) * (a[2] + b[2]);
    ny += (a[2] - b[2]) * (a[0] + b[0]);
    nz += (a[0] - b[0]) * (a[1] + b[1]);
  }
  return [nx, ny, nz];
}
const centroid = (pts) => V3.mul(pts.reduce((s, p) => V3.add(s, p), [0, 0, 0]), 1 / pts.length);

// A mesh is { v: [[x,y,z]], f: [[i,j,k,..]] } with faces wound outward. `orient` fixes the winding
// of each face against an inside point.
function orient(mesh, insideOf) {
  mesh.f = mesh.f.map((face) => {
    const pts = face.map((i) => mesh.v[i]);
    const n = newell(pts);
    const c = centroid(pts);
    return V3.dot(n, V3.sub(c, insideOf(c, face))) < 0 ? face.slice().reverse() : face;
  });
  return mesh;
}

// closed prism between a polygon (in a plane) and the same polygon offset by `thick` along its normal
function plate(poly, normal, thick) {
  const n = V3.unit(normal);
  if (V3.dot(newell(poly), n) < 0) poly = poly.slice().reverse();
  const top = poly.map((p) => V3.add(p, V3.mul(n, thick / 2)));
  const bot = poly.map((p) => V3.sub(p, V3.mul(n, thick / 2)));
  const v = [...top, ...bot];
  const k = poly.length;
  const f = [Array.from({ length: k }, (_, i) => i), Array.from({ length: k }, (_, i) => 2 * k - 1 - i)];
  for (let i = 0; i < k; i++) { const j = (i + 1) % k; f.push([i, k + i, k + j, j]); }
  return { v, f };
}

// closed tube between rings (each ring: centre, axis, radius)
function tube(rings, sides = 16, { capStart = false, capEnd = false } = {}) {
  const v = [], f = [];
  let prevU = null;
  for (const ring of rings) {
    const a = V3.unit(ring.axis);
    let u = prevU ? V3.unit(V3.sub(prevU, V3.mul(a, V3.dot(prevU, a)))) : V3.unit(V3.cross(a, Math.abs(a[2]) > 0.9 ? [1, 0, 0] : [0, 0, 1]));
    prevU = u;
    const w = V3.cross(a, u);
    for (let i = 0; i < sides; i++) {
      const ang = (i / sides) * Math.PI * 2;
      v.push(V3.add(ring.c, V3.add(V3.mul(u, Math.cos(ang) * ring.r), V3.mul(w, Math.sin(ang) * ring.r))));
    }
  }
  for (let r = 0; r < rings.length - 1; r++) for (let i = 0; i < sides; i++) {
    const j = (i + 1) % sides, a = r * sides, b = (r + 1) * sides;
    f.push([a + i, b + i, b + j, a + j]);
  }
  const caps = [];
  if (capStart) { f.push(Array.from({ length: sides }, (_, i) => i)); caps.push(f.length - 1); }
  if (capEnd) { const b = (rings.length - 1) * sides; f.push(Array.from({ length: sides }, (_, i) => b + i)); caps.push(f.length - 1); }
  const mesh = orient({ v, f }, (c, face) => {
    // nearest ring centre
    let best = rings[0].c, dist = Infinity;
    for (const ring of rings) { const d = V3.len(V3.sub(ring.c, c)); if (d < dist) { dist = d; best = ring.c; } }
    if (face.length === sides) { // cap: inside is toward the neighbouring ring
      const idx = face[0] < sides ? 1 : rings.length - 2;
      return rings[idx].c;
    }
    return best;
  });
  mesh.caps = caps;
  return mesh;
}

function wheel(c, r, width, sides = 14) {
  return tube([{ c: V3.add(c, [0, -width / 2, 0]), axis: [0, 1, 0], r }, { c: V3.add(c, [0, width / 2, 0]), axis: [0, 1, 0], r }], sides, { capStart: true, capEnd: true });
}

function box(a, b, r) { // a square strut from a to b, half-width r
  const ax = V3.unit(V3.sub(b, a));
  const u = V3.unit(V3.cross(ax, Math.abs(ax[2]) > 0.9 ? [1, 0, 0] : [0, 0, 1]));
  const w = V3.cross(ax, u);
  const sq = [[1, 1], [-1, 1], [-1, -1], [1, -1]].map(([p, q]) => V3.add(V3.mul(u, p * r), V3.mul(w, q * r)));
  const v = [...sq.map((o) => V3.add(a, o)), ...sq.map((o) => V3.add(b, o))];
  const f = [[0, 1, 2, 3], [4, 5, 6, 7], [0, 1, 5, 4], [1, 2, 6, 5], [2, 3, 7, 6], [3, 0, 4, 7]];
  const c = V3.mul(V3.add(a, b), 0.5);
  return orient({ v, f }, () => c);
}

// rotate p about the axis through `o` along unit `a` by `ang` radians (Rodrigues)
function rot(p, o, a, ang) {
  const q = V3.sub(p, o);
  const c = Math.cos(ang), s = Math.sin(ang);
  const r = V3.add(V3.add(V3.mul(q, c), V3.mul(V3.cross(a, q), s)), V3.mul(a, V3.dot(a, q) * (1 - c)));
  return V3.add(r, o);
}
const rotMesh = (mesh, o, a, ang) => ({ ...mesh, v: mesh.v.map((p) => rot(p, o, a, ang)) });

// ---- Airframe (body metres) ------------------------------------------------------------------
// Proportions from the F-35B three-view: length 15.6 m (nose tip 8.0 to the stabilator root trailing edge −7.58),
// span 10.7 m, wing leading edge swept ~35°, trailing edge swept forward ~14°, stabilator edges parallel to the
// wing's (planform alignment), twin fins canted out 25°, single-wheel nose gear (only the F-35C has two).
//
// Fuselage section at a station: knife chine at (±w, zc), centreline top zt, belly zb.
//   upper skin  z = zc + (zt − zc)·(1 − |y/w|^au)^(1/bu)
//   lower skin  z = zc − (zc − zb)·(1 − |y/w|^al)^(1/bl)
// b = 1 leaves a finite slope at y = w, so the two skins meet in a crease (the chine); b = 2 is an ellipse.
//           x      w     zc     zt     zb    au   bu   al   bl
const FUS_KEYS = [
  [7.62, 0.13, -0.07, 0.04, -0.15, 2.0, 1.0, 2.0, 1.0],
  [7.0, 0.32, -0.07, 0.24, -0.31, 2.0, 1.0, 2.2, 1.0],
  [6.2, 0.5, -0.06, 0.45, -0.45, 2.0, 1.0, 2.6, 1.0],
  [5.4, 0.64, -0.04, 0.6, -0.56, 2.2, 1.0, 3.0, 1.0],
  [4.6, 0.76, -0.01, 0.69, -0.64, 2.4, 1.0, 3.5, 1.0],
  [3.9, 0.88, 0.03, 0.77, -0.7, 2.6, 1.0, 4.0, 1.0],
  [3.0, 1.25, 0.1, 0.95, -0.78, 3.2, 1.0, 5.0, 1.0],
  [2.2, 1.63, 0.14, 0.985, -0.81, 4.0, 1.0, 6.0, 1.0],
  [1.2, 1.79, 0.15, 0.99, -0.82, 4.5, 1.0, 6.0, 1.0],
  [0.0, 1.82, 0.15, 0.97, -0.82, 4.5, 1.0, 6.0, 1.0],
  [-1.2, 1.79, 0.15, 0.92, -0.8, 4.0, 1.0, 6.0, 1.0],
  [-2.4, 1.7, 0.15, 0.85, -0.76, 3.6, 1.0, 5.5, 1.0],
  [-3.6, 1.5, 0.14, 0.77, -0.7, 3.4, 1.05, 5.0, 1.05],
  [-4.6, 1.36, 0.13, 0.72, -0.64, 3.4, 1.1, 4.5, 1.1],
  [-5.5, 1.31, 0.12, 0.69, -0.6, 3.2, 1.15, 4.0, 1.15],
  [-6.0, 1.29, 0.11, 0.68, -0.6, 3.0, 1.2, 3.6, 1.2],
  [-6.42, 1.28, 0.1, 0.68, -0.6, 3.0, 1.2, 3.4, 1.2],
];
const NOSE_TIP = [8.0, 0, -0.07];

// monotone cubic (PCHIP) through the keys, one column at a time: no overshoot between stations
function pchip(keys, col) {
  const xs = keys.map((k) => k[0]), ys = keys.map((k) => k[col]);
  const n = xs.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  for (let i = 0; i < n; i++) {
    if (i === 0) m.push(d[0]); else if (i === n - 1) m.push(d[n - 2]);
    else m.push(d[i - 1] * d[i] <= 0 ? 0 : 2 / (1 / d[i - 1] + 1 / d[i]));
  }
  return (x) => {
    let i = 0;
    while (i < n - 2 && !((x <= xs[i] && x >= xs[i + 1]) || (x >= xs[i] && x <= xs[i + 1]))) i++;
    const h = xs[i + 1] - xs[i], t = Math.min(1, Math.max(0, (x - xs[i]) / h));
    const t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
const FUS_F = [1, 2, 3, 4, 5, 6, 7, 8].map((c) => pchip(FUS_KEYS, c));
function sectionAt(x) {
  const [w, zc, zt, zb, au, bu, al, bl] = FUS_F.map((f) => f(x));
  return { x, w, zc, zt, zb, au, bu, al, bl };
}
const upperZ = (st, y) => st.zc + (st.zt - st.zc) * Math.pow(Math.max(0, 1 - Math.pow(Math.min(1, Math.abs(y) / st.w), st.au)), 1 / st.bu);
const lowerZ = (st, y) => st.zc - (st.zc - st.zb) * Math.pow(Math.max(0, 1 - Math.pow(Math.min(1, Math.abs(y) / st.w), st.al)), 1 / st.bl);
// half-width of the skin at height z
function fusY(x, z) {
  const st = sectionAt(x);
  if (z >= st.zc) { const q = Math.min(1, (z - st.zc) / (st.zt - st.zc)); return st.w * Math.pow(Math.max(0, 1 - Math.pow(q, st.bu)), 1 / st.au); }
  const q = Math.min(1, (st.zc - z) / (st.zc - st.zb)); return st.w * Math.pow(Math.max(0, 1 - Math.pow(q, st.bl)), 1 / st.al);
}
function topAt(x) { return sectionAt(Math.min(7.6, Math.max(-6.42, x))).zt; }
function skinZ(x, y, upper = true) { const st = sectionAt(x); return upper ? upperZ(st, y) : lowerZ(st, y); }

// ring around the section, starting at the belly centreline, up the port side, over the top, down starboard
const NU = 10, NL = 7;
const CHINE = [NL, NL + 2 * NU];
function fusRing(st) {
  const port = [];
  for (let k = 0; k <= NL; k++) { const y = st.w * Math.sin((k / NL) * Math.PI / 2); port.push([y, lowerZ(st, y)]); }
  for (let k = 1; k <= NU; k++) { const y = st.w * Math.cos((k / NU) * Math.PI / 2); port.push([k === NU ? 0 : y, upperZ(st, y)]); }
  const stbd = port.slice(1, -1).reverse().map(([y, z]) => [-y, z]);
  return [...port, ...stbd].map(([y, z]) => [st.x, y, z]);
}

// generic loft between rings of equal length. closed: the ring wraps; centres: an inside point per ring.
function loftRings(rings, centres, { tip = null, closed = true, capEnd = false, capStart = false } = {}) {
  const v = [], f = [], n = rings[0].length;
  const base = rings.map((r) => { const b = v.length; v.push(...r); return b; });
  const fc = []; // inside point per face
  let ti = -1;
  if (tip) {
    ti = v.length; v.push(tip);
    for (let j = 0; j < (closed ? n : n - 1); j++) { f.push([ti, base[0] + j, base[0] + ((j + 1) % n)]); fc.push(centres[0]); }
  }
  for (let r = 0; r < rings.length - 1; r++) for (let j = 0; j < (closed ? n : n - 1); j++) {
    const j1 = (j + 1) % n;
    f.push([base[r] + j, base[r + 1] + j, base[r + 1] + j1, base[r] + j1]);
    fc.push(V3.mul(V3.add(centres[r], centres[r + 1]), 0.5));
  }
  const caps = [];
  if (capEnd) { const L = rings.length - 1; f.push(Array.from({ length: n }, (_, j) => base[L] + j)); fc.push(centres[Math.max(0, L - 1)]); caps.push(f.length - 1); }
  if (capStart) { f.push(Array.from({ length: n }, (_, j) => base[0] + j)); fc.push(centres[1]); caps.push(f.length - 1); }
  f.forEach((face, i) => {
    const pts = face.map((k) => v[k]);
    if (V3.dot(newell(pts), V3.sub(centroid(pts), fc[i])) < 0) f[i] = face.slice().reverse();
  });
  return { v, f, base, n, capsFaces: caps };
}
// edge-aligned polyline along ring index j from ring r0 to r1, or along ring r from index j0 to j1
const alongX = (L, j, r0, r1) => { const out = []; const s = r0 < r1 ? 1 : -1; for (let r = r0; r !== r1 + s; r += s) out.push(L.base[r] + j); return out; };
const aroundRing = (L, r, j0, j1) => { const out = []; const s = j0 < j1 ? 1 : -1; for (let j = j0; j !== j1 + s; j += s) out.push(L.base[r] + ((j + L.n) % L.n)); return out; };

function fuselageMesh() {
  // stations: dense where the section changes fast (nose, intakes, tail) plus the seams that need a ring
  const xs = new Set([7.62, 7.45, 7.25, 7.0, 6.75, 6.5, 6.3, 6.05, 5.7, 5.4, 5.05, 4.7, 4.35, 4.0, 3.7, 3.4, 3.1, 2.8, 2.5, 2.2, 1.9, 1.5, 1.1, 0.6, 0.1, -0.4, -0.9, -1.4, -1.9, -2.4, -2.9, -3.4, -3.9, -4.4, -4.85, -5.3, -5.7, -6.05, -6.42]);
  const X = [...xs].sort((a, b) => b - a);
  const secs = X.map(sectionAt);
  const L = loftRings(secs.map(fusRing), secs.map((s) => [s.x, 0, (s.zt + s.zb) / 2]), { tip: NOSE_TIP, capEnd: true });
  const mesh = { v: L.v, f: L.f, caps: [] };
  mesh.crease = new Set();
  for (let r = 0; r < X.length - 1; r++) for (const j of CHINE) { const a = L.base[r] + j, b = L.base[r + 1] + j; mesh.crease.add(a < b ? a + "," + b : b + "," + a); }
  const ri = (x) => X.indexOf(x);
  const loops = [];
  // radome joint: one ring over the top, chine to chine
  loops.push(aroundRing(L, ri(6.3), CHINE[0], CHINE[1]));
  // weapons-bay doors on the belly (F-35B bays are short: the lift fan sits ahead of them), two doors a side
  const bayA = ri(0.6), bayB = ri(-2.9);
  for (const [j0, j1] of [[1, 2], [2, 3], [L.n - 2, L.n - 1], [L.n - 3, L.n - 2]]) {
    loops.push([...alongX(L, j0, bayA, bayB), ...aroundRing(L, bayB, j0, j1).slice(1), ...alongX(L, j1, bayB, bayA).slice(1), ...aroundRing(L, bayA, j1, j0).slice(1)]);
  }
  // nose-gear bay doors
  const ngA = ri(5.7), ngB = ri(4.35);
  loops.push([...alongX(L, 1, ngA, ngB), ...aroundRing(L, ngB, 1, -1).slice(1), ...alongX(L, L.n - 1, ngB, ngA).slice(1), ...aroundRing(L, ngA, -1, 1).slice(1)]);
  // aft access panel on the spine, edge to edge between two rings
  const spA = ri(-2.9), spB = ri(-4.4);
  loops.push([...alongX(L, NL + NU - 2, spA, spB), ...aroundRing(L, spB, NL + NU - 2, NL + NU + 2).slice(1), ...alongX(L, NL + NU + 2, spB, spA).slice(1), ...aroundRing(L, spA, NL + NU + 2, NL + NU - 2).slice(1)]);
  mesh.loops = loops;
  return mesh;
}

// canopy: one-piece bubble on the forebody, abbreviated on the B, with a frame bow and a sill
function canopyMesh() {
  const keys = [[6.0, 0.03, 0.5], [5.75, 0.24, 0.8], [5.35, 0.38, 1.0], [4.95, 0.46, 1.13], [4.55, 0.5, 1.22], [4.1, 0.51, 1.26], [3.65, 0.49, 1.25], [3.3, 0.45, 1.19], [3.02, 0.4, 1.1]];
  const N = 16;
  const rings = [], centres = [];
  for (const [x, w, zt] of keys) {
    const zb = skinZ(x, w) - (x > 5.9 ? 0.0 : 0.012);
    const ring = [];
    for (let i = 0; i <= N; i++) {
      const ph = (i / N) * Math.PI, c = Math.cos(ph), s = Math.sin(ph);
      ring.push([x, w * Math.sign(c) * Math.pow(Math.abs(c), 0.85), zb + (zt - zb) * Math.pow(s, 0.8)]);
    }
    rings.push(ring); centres.push([x, 0, zb]);
  }
  const L = loftRings(rings, centres, { closed: false });
  const mesh = { v: L.v, f: L.f, loops: [aroundRing(L, 4, 0, N)] }; // frame bow at x 4.55
  // highlight: a thin streak on the upper port quarter of the glass
  const at = (x, ph, dz = 0.006) => {
    const k = keys.findIndex((q) => q[0] <= x);
    const a = keys[Math.max(0, k - 1)], b = keys[k];
    const t = (a[0] - x) / (a[0] - b[0] || 1);
    const w = lerp(a[1], b[1], t), zt = lerp(a[2], b[2], t), zb = skinZ(x, w) - 0.012;
    const c = Math.cos(ph), s = Math.sin(ph);
    return [x, (w + dz) * Math.sign(c) * Math.pow(Math.abs(c), 0.85), zb + (zt - zb + dz) * Math.pow(s, 0.8)];
  };
  const glint = [];
  for (const [x0, x1, p0, p1] of [[5.3, 3.75, 0.3, 0.37], [5.45, 4.95, 0.42, 0.46]]) {
    const pts = [];
    for (let i = 0; i <= 6; i++) pts.push(at(lerp(x0, x1, i / 6), lerp(p0, p0 + 0.02, Math.sin((i / 6) * Math.PI)) * Math.PI));
    for (let i = 6; i >= 0; i--) pts.push(at(lerp(x0, x1, i / 6), lerp(p1, p1 - 0.02, Math.sin((i / 6) * Math.PI)) * Math.PI));
    glint.push({ pts, n: [0, Math.cos(((p0 + p1) / 2) * Math.PI), Math.sin(((p0 + p1) / 2) * Math.PI)] });
  }
  mesh.glint = glint;
  return mesh;
}
// the canopy's aft bulkhead: an opaque arch closing the glass, standing on the hump just ahead of the fan door
function canopyAftMesh() {
  const x = 3.02, w = 0.4, zt = 1.1, N = 16;
  const zb = skinZ(x, w) - 0.012;
  const v = [];
  for (let i = 0; i <= N; i++) { const ph = (i / N) * Math.PI, c = Math.cos(ph), s = Math.sin(ph); v.push([x - 0.004, w * Math.sign(c) * Math.pow(Math.abs(c), 0.85), zb + (zt - zb) * Math.pow(s, 0.8)]); }
  let face = v.map((_, i) => i);
  if (V3.dot(newell(v), [-1, 0, 0]) < 0) face = face.reverse();
  return { v, f: [face] };
}

function shellMesh(surf, us, vs, thick, outward) {

    SURF["gdoor.main." + k] = mainDoorBase(side);
    SURF["gdoor.nose." + k] = noseDoorBase(side);
  }
  SURF["door.liftfan"] = liftDoorBase();
  for (const m of Object.values(SURF)) { edgesOf(m); cornerGroups(m); }
  return SURF;
}
const rotKeep = (m, o, a, ang) => { const r = rotMesh(m, o, a, ang); return r; };

function controlSurfaceParts(s, add) {
  const B = surfBases();
  for (const side of [1, -1]) {
    const k = side > 0 ? "port" : "stbd", sfx = "." + k;
    // stabilator: pitch about the spindle, trailing edge up = positive s.stab
    add("stab" + sfx, rotKeep(B["stab" + sfx], [STAB.pivot, 0, STAB.z], [0, 1, 0], (s.stab || 0) * D2R), { tone: "hi", smooth: true, bias: -0.5 });
    // rudder: about its hinge line, positive s.rud = trailing edge to port
    const r = B["rudder" + sfx];
    add("rudder" + sfx, rotKeep(r, r.hinge.o, r.hinge.a, -(s.rud || 0) * D2R), { tone: "hi", smooth: true, bias: 0.5, id: "rudder" + sfx });
  }
}

// lift-fan upper door: a shell on the spine contour (x 0.78…3.05, y ±0.6), 7 cm thick, hinged at its aft edge
const LIFT = { x0: 0.78, x1: 3.05, w: 0.6, thick: 0.07 };
// spine profile along x, and the cross-curvature of the mid-door station across y, so the shell follows the spine
// without the forebody's narrowing twisting its forward corners
const liftDoorSurf = (u, v) => { const x = lerp(LIFT.x0, LIFT.x1, u), y = lerp(LIFT.w, -LIFT.w, v); return [x, y, topAt(x) + (skinZ(1.9, y) - topAt(1.9)) + 0.014]; };
const liftHingeZ = () => skinZ(LIFT.x0, 0) + 0.014 - LIFT.thick / 2;
function liftDoorBase() {
  const m = shellMesh(liftDoorSurf, [0, 0.045, 0.26, 0.5, 0.74, 0.955, 1], [0, 0.06, 0.3, 0.5, 0.7, 0.94, 1], LIFT.thick, [0, 0, 1]);
  // inner structure: three frames across, two longerons, an edge frame: webs 6 cm deep standing on the inner skin
  const inn = (u, v, d = 0) => { const p = liftDoorSurf(u, v), n = m.nrmAt(u, v); return V3.sub(p, V3.mul(n, LIFT.thick + 0.004 + d)); };
  const webs = [];
  const web = (pts) => webs.push([...pts.map((q) => inn(q[0], q[1])), ...pts.slice().reverse().map((q) => inn(q[0], q[1], 0.06))]);
  for (const u of [0.26, 0.5, 0.74]) web([[u, 0.06], [u, 0.5], [u, 0.94]]);
  for (const v of [0.3, 0.7]) web([[0.045, v], [0.26, v], [0.5, v], [0.74, v], [0.955, v]]);
  m.innerWebs = webs;
  m.innerN = [0, 0, -1];
  return m;
}
// aux inlet doors: two shells behind the fan door (x −0.35…0.55), hinged aft, 4 cm thick
function auxDoorBase(side) {
  const surf = (u, v) => { const x = lerp(-0.35, 0.55, u), y = side * lerp(0.12, 0.5, v); return [x, y, skinZ(x, y) + 0.012]; };
  const m = shellMesh(surf, [0, 0.08, 0.5, 0.92, 1], [0, 0.12, 0.5, 0.88, 1], 0.04, [0, 0, 1]);
  m.hingeZ = skinZ(-0.35, side * 0.3) + 0.012 - 0.02;
  return m;
}
// main-gear door: the lower skin outboard of the well (x −0.75…1.0, |y| 1.0…1.6), hinged on its outer edge
function mainDoorBase(side) {
  const surf = (u, v) => { const x = lerp(1.0, -0.75, u), y = side * lerp(1.6, 1.0, v); return [x, y, skinZ(x, y, false) - 0.004]; };
  const m = shellMesh(surf, [0, 0.06, 0.5, 0.94, 1], [0, 0.08, 0.5, 0.92, 1], 0.03, [0, 0, -1]);
  m.hinge = [0, side * 1.6, skinZ(0.1, side * 1.6, false)];
  m.outline = [];
  for (let i = 0; i <= 8; i++) m.outline.push(surf(i / 8, 1));
  for (let i = 0; i <= 6; i++) m.outline.push(surf(1, 1 - i / 6));
  for (let i = 8; i >= 0; i--) m.outline.push(surf(i / 8, 0));
  return m;
}
// nose-gear doors: two leaves either side of the centreline (x 4.4…6.5), hinged on their outer edges
function noseDoorBase(side) {
  const surf = (u, v) => { const x = lerp(6.5, 4.4, u), y = side * lerp(0.24, 0.015, v); return [x, y, skinZ(x, y, false) - 0.004]; };
  const m = shellMesh(surf, [0, 0.06, 0.5, 0.94, 1], [0, 0.15, 0.85, 1], 0.025, [0, 0, -1]);
  m.hinge = [0, side * 0.24, skinZ(5.4, side * 0.24, false)];
  return m;
}

// the door shells, their rams and hinges; the fan bay / well itself stays with each renderer
function doorParts(s, add) {
  const B = surfBases();
  const hz = liftHingeZ();
  const hinge = [LIFT.x0, 0, hz];
  const dAng = -s.door * 68 * D2R;
  const dRot = (p) => rot(p, hinge, [0, 1, 0], dAng);
  const base = B["door.liftfan"];
  const door = rotMesh(base, hinge, [0, 1, 0], dAng);
  door.innerWebs = base.innerWebs.map((w) => w.map(dRot));
  door.innerN = rot(base.innerN, [0, 0, 0], [0, 1, 0], dAng);
  add("door.liftfan", door, { tone: "hi", bias: 9, smooth: true, id: "door.liftfan" });
  // the rams and hinge sit on the door's inner side: in front of it when that side faces the camera, else behind
  const inSide = { to: ["door.liftfan"], d: 0.02, side: door.innerN };
  // hinge barrel along the aft edge
  add("door.hinge", rod([LIFT.x0 - 0.01, 0.5, hz], [LIFT.x0 - 0.01, -0.5, hz], 0.03, 10), { tone: "mid", bias: 8.9 });
  // two actuators: cylinder from the bay's aft frame, chrome rod to a lug on the door's inner skin
  if (s.door > 0.03) {
    for (const y of [0.42, -0.42]) {
      const foot = [1.15, y, hz - 0.2];
      const lug = dRot(V3.sub(liftDoorSurf((1.5 - LIFT.x0) / (LIFT.x1 - LIFT.x0), (LIFT.w - y) / (2 * LIFT.w)), [0, 0, LIFT.thick + 0.004]));
      const ax = V3.unit(V3.sub(lug, foot));
      const cl = Math.min(0.28, 0.6 * V3.len(V3.sub(lug, foot)));
      const mid = V3.add(foot, V3.mul(ax, cl));
      add("door.ram", latheAlong(foot, mid, [[0, 0.05], [0.04, 0.05], [0.04, 0.042], [cl, 0.042]], 10), { tone: "mid", bias: 8.6, rel: inSide });
      add("door.rod", rod(mid, lug, 0.02, 8), { tone: "mid", bias: 8.55, cls: "chrome", rel: { ...inSide, d: 0.03 } });
    }
  }
  // auxiliary inlet doors: hinged aft, 35 deg
  for (const side of [1, -1]) {
    const m = B["door.aux." + (side > 0 ? "port" : "stbd")];
    add("door.aux", rotMesh(m, [-0.35, 0, m.hingeZ], [0, 1, 0], -s.aux * 35 * D2R), { tone: "hi", bias: 8 + side * 0.5, smooth: true });
  }
}

// ---- landing gear: round struts (lathe), chrome oleos, torque links, folding drag braces, torus tyres, hubs ----
const GEAR = [
  { id: "ng", top: [5.05, 0, -0.5], wheel: [5.05, 0, -1.78], r: 0.3, wid: 0.2, brace: [5.6, 0, -0.55], side: 0, rs: 0.07, ro: 0.048 },
  { id: "mp", top: [-0.55, 1.22, -0.62], wheel: [-0.55, 1.4, -1.72], r: 0.38, wid: 0.28, brace: [0.25, 1.25, -0.66], side: 1, rs: 0.085, ro: 0.058 },
  { id: "ms", top: [-0.55, -1.22, -0.62], wheel: [-0.55, -1.4, -1.72], r: 0.38, wid: 0.28, brace: [0.25, -1.25, -0.66], side: -1, rs: 0.085, ro: 0.058 },
];
let GEAR_REST = null;
function gearRest() {
  if (GEAR_REST) return GEAR_REST;
  GEAR_REST = GEAR.map((g) => {
    const parts = [];
    const P = (name, mesh, opt) => { edgesOf(mesh); cornerGroups(mesh); parts.push({ name, mesh, ...opt }); };
    // strut line: from the trunnion to the axle point (main gear: inboard of the wheel, the axle cantilevers out)
    const axleIn = g.side ? V3.add(g.wheel, [0, -g.side * (g.wid / 2 + 0.07), 0]) : V3.add(g.wheel, [0, 0, 0.36]);
    const ax = V3.unit(V3.sub(axleIn, g.top));
    const Ltot = V3.len(V3.sub(axleIn, g.top));
    const kneeS = Ltot * 0.56;
    const knee = V3.add(g.top, V3.mul(ax, kneeS));
    const id = (n) => g.id + "." + n;
    // outer cylinder with a trunnion collar at the top and a gland nut at its foot
    P("gear.strut", latheAlong(g.top, knee, [[0, g.rs * 1.25], [0.06, g.rs * 1.25], [0.07, g.rs], [kneeS - 0.06, g.rs], [kneeS - 0.05, g.rs * 1.18], [kneeS, g.rs * 1.18]], 12), { tone: "mid", id: id("strut") });
    // chrome oleo piston, then a lower collar where the torque link and axle attach
    const bot = axleIn;
    P("gear.oleo", latheAlong(knee, bot, [[0, g.ro], [Ltot - kneeS - 0.07, g.ro], [Ltot - kneeS - 0.06, g.ro * 1.35], [Ltot - kneeS, g.ro * 1.35]], 12), { tone: "hi", cls: "chrome", id: id("oleo") });
    // torque links on the aft face: two arms meeting at an apex
    const f = [-1, 0, 0];
    const ua = V3.add(V3.add(knee, V3.mul(ax, -0.05)), V3.mul(f, g.rs));
    const la = V3.add(V3.add(bot, V3.mul(ax, -0.04)), V3.mul(f, g.ro * 1.3));
    const apex = V3.add(lerp3(ua, la, 0.5), V3.mul(f, 0.16));
    P("gear.link", rod(ua, apex, 0.02, 6), { tone: "mid", id: id("link1") });
    P("gear.link", rod(apex, la, 0.02, 6), { tone: "mid", id: id("link2") });
    if (g.side) { // axle stub out to the wheel
      P("gear.axle", rod(bot, g.wheel, 0.04, 8), { tone: "mid", id: id("axle") });
    } else { // nose fork: two arms from the crown down either side of the wheel
      for (const sd of [1, -1]) P("gear.fork", rod(bot, V3.add(g.wheel, [0, sd * (g.wid / 2 + 0.035), 0]), 0.032, 8), { tone: "mid", id: id("fork" + sd), forkSide: sd });
    }
    // tyre (torus) and hubs on both faces
    const hw = g.wid / 2, rr = g.r * 0.3;
    P("gear.tyre", torus(g.wheel, [0, 1, 0], g.r - rr, rr, hw, 20, 8), { tone: "mid", cls: "tyre", sortFaces: true, id: id("tyre") });
    for (const sd of [1, -1]) {
      const hc = V3.add(g.wheel, [0, sd * hw * 0.62, 0]);
      P("gear.hub", latheAlong(hc, V3.add(hc, [0, sd * 0.05, 0]), [[0, g.r * 0.62], [0.025, g.r * 0.6], [0.03, g.r * 0.26], [0.05, g.r * 0.22]], 14), { tone: "hi", cls: "hub", id: id("hub" + sd), hubSide: sd, cull: [0, sd, 0] });
    }
    // drag brace: strut attach point and its two segment lengths (locked nearly straight with the gear down)
    const S0 = V3.add(g.top, V3.mul(ax, kneeS * 0.78));
    const d0 = Math.hypot(S0[0] - g.brace[0], S0[2] - g.brace[2]);
    return { g, parts, S0, l: (d0 / 2) * 1.015, kneeS, ax };
  });

}
function braceJoint(A, S, l) {
  const dx = S[0] - A[0], dz = S[2] - A[2], d = Math.max(1e-4, Math.hypot(dx, dz));
  const dd = Math.min(d, 2 * l - 1e-4);
  const h = Math.sqrt(Math.max(0, l * l - (dd / 2) * (dd / 2)));
  const ux = dx / d, uz = dz / d;
  const px = A[0] + ux * dd / 2, pz = A[2] + uz * dd / 2;
  // bend downward/outward of the line (the side away from the fuselage)
  const c1 = [px - uz * h, pz + ux * h], c2 = [px + uz * h, pz - ux * h];
  const c = c1[1] < c2[1] ? c1 : c2;
  return [c[0], lerp(A[1], S[1], 0.5), c[1]];
}
function gearParts(s, add) {
  const open = smooth(0.0, 0.12, s.gear); // the doors close only over the last 12 % of the fold
  const B = surfBases();
  if (s.gear > 0.06) {
    const fold = (1 - s.gear) * 95 * D2R;
    for (const R of gearRest()) {
      const g = R.g;
      const sd = (p) => rot(p, g.top, [0, 1, 0], -fold);
      const ids = R.parts.filter((p) => !/tyre|hub/.test(p.name)).map((p) => p.id);
      for (const p of R.parts) {
        const mesh = rotMesh(p.mesh, g.top, [0, 1, 0], -fold);
        const opt = { ...p, mesh, bias: -45 };
        if (p.name === "gear.tyre") opt.rel = { to: ids, d: 0.05, side: g.side ? [0, g.side, 0] : [0, 0, -1] };
        if (p.name === "gear.hub") opt.rel = { to: [g.id + ".tyre"], d: 0.02, side: [0, p.hubSide, 0] };
        if (p.name === "gear.fork") opt.rel = { to: [g.id + ".tyre"], d: 0.03, side: [0, p.forkSide, 0] };
        if (p.name === "gear.link") opt.rel = { to: [g.id + ".oleo", g.id + ".strut"], d: 0.01, side: [-1, 0, 0] };
        add(p.name, mesh, opt);
      }
      // drag brace: fixed airframe end, strut end moves with the fold, the knee joint folds between them
      const S = sd(R.S0);
      const J = braceJoint(g.brace, S, R.l);
      add("gear.brace", rod(g.brace, J, 0.034, 8), { tone: "mid", bias: -45, rel: { to: [g.id + ".strut"], d: 0.02, side: [1, 0, 0] } });
      add("gear.brace", rod(J, S, 0.03, 8), { tone: "mid", bias: -45, rel: { to: [g.id + ".strut"], d: 0.02, side: [1, 0, 0] } });
    }
  }
  if (open > 0.002) {
    for (const side of [1, -1]) {
      const k = side > 0 ? "port" : "stbd";
      const md = B["gdoor.main." + k];
      add("gear.door", rotMesh(md, md.hinge, [1, 0, 0], side * open * 62 * D2R), { tone: "mid", bias: -45, smooth: true, rel: { to: ["m" + (side > 0 ? "p" : "s") + ".tyre", "m" + (side > 0 ? "p" : "s") + ".strut"], d: 0.06, side: [0, side, 0] } });
      const nd = B["gdoor.nose." + k];
      add("gear.door", rotMesh(nd, nd.hinge, [1, 0, 0], side * open * 84 * D2R), { tone: "mid", bias: -45, smooth: true, rel: { to: ["ng.tyre", "ng.strut"], d: 0.06, side: [0, side, 0] } });
      // the well behind each open door: dark, on the lower skin, only from a camera that sees the belly
      const outline = md.outline.map((p) => V3.add(p, [0, 0, 0.006]));
      add("gear.well", { v: [], f: [], custom: (ctx) => {
        const nW = V3.unit(ctx.dW([0, side * 0.45, -1]));
        if (V3.dot(nW, ctx.V) <= 0.02) return "";
        return `<g class="ac-part" opacity="${smooth(0.0, 0.5, open).toFixed(2)}"><path class="ac-cav" d="${ctx.path(outline.map(ctx.pr))}"/></g>`;
      } }, { bias: -45.5, at: [0.12, side * 1.3, -0.7] });
    }
    const nOut = [];
    for (let i = 0; i <= 8; i++) { const x = lerp(6.5, 4.4, i / 8); nOut.push([x, 0.235, skinZ(x, 0.235, false) - 0.002]); }
    for (let i = 8; i >= 0; i--) { const x = lerp(6.5, 4.4, i / 8); nOut.push([x, -0.235, skinZ(x, -0.235, false) - 0.002]); }
    add("gear.well", { v: [], f: [], custom: (ctx) => {
      if (V3.dot(V3.unit(ctx.dW([0, 0, -1])), ctx.V) <= 0.02) return "";
      return `<g class="ac-part" opacity="${smooth(0.0, 0.5, open).toFixed(2)}"><path class="ac-cav" d="${ctx.path(nOut.map(ctx.pr))}"/></g>`;
    } }, { bias: -45.5, at: [5.4, 0, -0.5] });
  }
}

// depth order: centroid along the view + bias, then parts that hang on others (fillets, wheels, hubs, links,
// braces, gear doors) are placed just after the parts they name when their own side faces the camera, else just
// before. One rule for both renderers and for the underside camera.
function orderParts(drawn, V, dW) {
  const by = new Map();
  for (const d of drawn) if (d.part.id) by.set(d.part.id, d);
  for (let pass = 0; pass < 2; pass++) for (const d of drawn) {
    const r = d.part.rel; if (!r) continue;
    const vis = r.side ? V3.dot(dW(r.side), V) > 0 : true;
    const pool = (vis || !r.hidTo ? r.to : r.hidTo).map((id) => by.get(id)).filter(Boolean);
    if (!pool.length) continue;
    d.key = vis ? Math.max(...pool.map((b) => b.key)) + r.d : Math.min(...pool.map((b) => b.key)) - r.d;
  }
  drawn.sort((a, b) => a.key - b.key);
  return drawn;
}

// moving parts for a state, in body metres
function movingParts(s) {
  const parts = [];
  const add = (name, mesh, opt = {}) => parts.push({ name, mesh, ...opt });
  // lift-fan upper door (shell, rams, hinge) and aux inlet doors: shared with the follow view
  doorParts(s, add);
  // the fan well and blades under it
  const doorZ = topAt(1.9) + 0.02;
  if (s.door > 0.02) add("fan.well", fanWell(s, doorZ - 0.03), { bias: 7, flat: true, alpha: smooth(0.02, 0.35, s.door) });
  // lower lift-fan doors: hinged on their outer edges, swing down 80 deg
  for (const side of [1, -1]) {
    const z = -0.8;
    const low = plate([[2.75, side * 0.12, z], [2.75, side * 0.62, z], [0.95, side * 0.62, z], [0.95, side * 0.12, z]], [0, 0, 1], 0.04);
    add("door.lower", rotMesh(low, [0, side * 0.62, z], [1, 0, 0], side * s.door * 82 * D2R), { tone: "mid", bias: -40 });
  }
  // roll-post doors under each wing
  for (const side of [1, -1]) {
    const z = wingBottomZ(-1.9, 3.2) - 0.018;
    const d = plate([[-1.55, side * 2.95, z], [-1.55, side * 3.45, z], [-2.25, side * 3.45, z], [-2.25, side * 2.95, z]], [0, 0, 1], 0.03);
    add("door.post", rotMesh(d, [0, side * 3.45, z], [1, 0, 0], side * s.posts * 70 * D2R), { tone: "mid", bias: -20 });
  }
  // landing gear, gear doors and wells; stabilators and rudders
  gearParts(s, add);
  controlSurfaceParts(s, add);
  // three-bearing swivel module: three segments on a bend of s.nozzle degrees, then the exit petals
  const noz = nozzleGeometry(s.nozzle);
  noz.segments.forEach((seg, i) => add(`nozzle.${i}`, seg, { tone: "hi", lit: true, bias: 3 + i * 0.01, seams: true, smooth: true }));
  return { parts, noz };
}

function nozzleGeometry(deg) {
  const th = Math.max(1e-4, deg * D2R);
  const base = [-6.42, 0, 0.04];
  const L = [0, 0.42, 0.82, 1.22, 1.45];
  const radius = [0.62, 0.6, 0.57, 0.54, 0.47];
  const Ltot = L[3];
  const R = Ltot / th;
  const at = (s) => { const f = s / R; return [V3.add(base, [-R * Math.sin(f), 0, -R * (1 - Math.cos(f))]), [-Math.cos(f), 0, -Math.sin(f)]]; };
  const rings = [];
  for (let i = 0; i < 4; i++) { const [c, d] = at(L[i]); rings.push({ c, axis: d, r: radius[i] }); }
  const exitDir = rings[3].axis;
  const exitC = V3.add(rings[3].c, V3.mul(exitDir, L[4] - L[3]));
  const segs = [];
  const SIDES = 28;
  for (let i = 0; i < 3; i++) segs.push(tube([rings[i], rings[i + 1]], SIDES));
  // exit petals: converging, with the sawtooth (serrated) trailing edge of the production nozzle
  const midC = V3.add(rings[3].c, V3.mul(exitDir, (L[4] - L[3]) * 0.55));
  const petals = tube([rings[3], { c: midC, axis: exitDir, r: (radius[3] + radius[4]) / 2 + 0.01 }, { c: exitC, axis: exitDir, r: radius[4] }], SIDES, { capEnd: true });
  for (let i = 0; i < SIDES; i++) if (i % 2) { const k = 2 * SIDES + i; petals.v[k] = V3.sub(petals.v[k], V3.mul(exitDir, 0.1)); }
  segs.push(petals);
  return { segments: segs, exit: exitC, dir: exitDir, r: radius[4] };
}

function fanWell(s, z) {
  // an elliptical opening (the fan face) with blades, flat in the door's plane
  const c = [1.92, 0, z], r = 0.56;
  const v = [], f = [[]];
  const N = 28;
  for (let i = 0; i < N; i++) { const a = (i / N) * Math.PI * 2; v.push([c[0] + Math.cos(a) * r * 1.02, Math.sin(a) * r, z]); f[0].push(i); }
  return { v, f, fan: { c, r, phase: s.fanPhase || 0 } };
}

// ---- Projection and rendering --------------------------------------------------------------
function camera(P) {
  const a = (P.azimuth ?? 45) * D2R, e = (P.elevation ?? 30) * D2R;
  const k = P.scale * Math.sqrt(1.6); // the kit's UNIT
  return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k, o: P.origin };
}
const project = (p, C) => [C.o[0] + (p[0] * C.sinA - p[1] * C.cosA) * C.k, C.o[1] + ((p[0] * C.cosA + p[1] * C.sinA) * C.sinE - p[2] * C.cosE) * C.k];

// ---- impingement: where an axis meets the deck, and how much of the jet is left when it does ----
function impinge(E, Dir, L, strength) {

{
