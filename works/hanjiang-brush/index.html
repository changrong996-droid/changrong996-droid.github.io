<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>寒江独钓 · 一笔一笔</title>
<style>
html,body{margin:0;height:100%;background:#17120e;overflow:hidden;font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;flex:none;width:1400px;height:860px;transform-origin:50% 50%;transition:transform 1.1s cubic-bezier(.4,0,.2,1)}
#stage canvas{position:absolute;left:0;top:0}
#ui{position:fixed;left:16px;bottom:14px;display:flex;gap:8px;z-index:5}
#ui button{background:rgba(255,255,255,.06);color:#d8cbb4;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
#ui button.on{background:rgba(255,255,255,.2)}
#status{position:fixed;right:18px;bottom:16px;color:rgba(220,205,180,.55);font-size:13px;letter-spacing:.08em;z-index:5}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="bg"></canvas><canvas id="ink"></canvas><canvas id="fx"></canvas>
</div></div>
<div id="ui">
  <button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
  <button id="snd">开声音</button><button id="again">重画一幅</button>
</div>
<div id="status"></div>
<script>
'use strict';
/* ---------- 画布 ---------- */
const W=1400,H=860,DPR=Math.min(2,window.devicePixelRatio||1);
const PX=60,PY=60,PW=1100,PH=740;                 // 宣纸
const REST={x:1262,y:408};                         // 笔山
const WELL_DARK={x:1282,y:612}, WELL_LIGHT={x:1282,y:210}; // 砚池 / 淡墨盂
const stage=document.getElementById('stage'), statusEl=document.getElementById('status');
function setup(id){const c=document.getElementById(id);c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);return g;}
const bg=setup('bg'), ink=setup('ink'), fx=setup('fx');
ink.save(); ink.beginPath(); ink.rect(PX,PY,PW,PH); ink.clip();

/* ---------- 随机与噪声 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let R=mulberry32(1);
const rnd=(a=0,b=1)=>a+(b-a)*R();
const rn=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v);};
function makeNoise(seed){const r=mulberry32(seed),t=new Float32Array(1024);for(let i=0;i<1024;i++)t[i]=r();
  return x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return t[i&1023]*(1-u)+t[(i+1)&1023]*u;};}
const nX=makeNoise(11),nY=makeNoise(23),nB=makeNoise(37);
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x));}
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
const minjerk=u=>u*u*u*(10-15*u+6*u*u);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- 桌面、宣纸、砚台 ---------- */
function drawBackground(){
  const r=mulberry32(7), g=bg;
  let gr=g.createLinearGradient(0,0,W,H); gr.addColorStop(0,'#2f2319'); gr.addColorStop(1,'#1a130d');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  for(let i=0;i<240;i++){ // 木纹
    const y0=r()*H*1.2-H*0.1, amp=r()*7, fq=0.002+r()*0.008, ph=r()*6, sl=(r()-.5)*0.04, a=0.02+r()*0.05;
    g.strokeStyle=r()<.5?`rgba(255,215,160,${a})`:`rgba(0,0,0,${a*1.4})`; g.lineWidth=0.3+r()*1.6;
    g.beginPath(); for(let x=0;x<=W;x+=16){const y=y0+Math.sin(x*fq+ph)*amp+x*sl; x?g.lineTo(x,y):g.moveTo(x,y);} g.stroke();
  }
  // 宣纸
  g.save(); g.shadowColor='rgba(0,0,0,.6)'; g.shadowBlur=28*DPR; g.shadowOffsetY=10*DPR;
  g.fillStyle='#ece2cb'; g.fillRect(PX,PY,PW,PH); g.restore();
  const ix=Math.round(PX*DPR),iy=Math.round(PY*DPR),iw=Math.round(PW*DPR),ih=Math.round(PH*DPR);
  const img=g.getImageData(ix,iy,iw,ih),d=img.data;
  for(let i=0;i<d.length;i+=4){const n=(r()-.5)*9;d[i]+=n;d[i+1]+=n;d[i+2]+=n*.85;}
  g.putImageData(img,ix,iy);
  g.save(); g.beginPath(); g.rect(PX,PY,PW,PH); g.clip();
  for(let i=0;i<70;i++){const x=PX+r()*PW,y=PY+r()*PH,rad=40+r()*200;const rg=g.createRadialGradient(x,y,0,x,y,rad);
    rg.addColorStop(0,`rgba(150,118,70,${0.012+r()*0.03})`); rg.addColorStop(1,'rgba(150,118,70,0)'); g.fillStyle=rg; g.fillRect(x-rad,y-rad,rad*2,rad*2);}
  for(let i=0;i<900;i++){const x=PX+r()*PW,y=PY+r()*PH,l=3+r()*16,a=r()*6.28,c=(r()-.5)*6;
    g.strokeStyle=r()<.6?'rgba(120,95,60,.08)':'rgba(255,255,248,.3)'; g.lineWidth=.45;
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+Math.cos(a)*l/2-Math.sin(a)*c,y+Math.sin(a)*l/2+Math.cos(a)*c,x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke();}
  const edges=[[PX,0,PX+45,0],[PX+PW,0,PX+PW-45,0],[0,PY,0,PY+45],[0,PY+PH,0,PY+PH-45]];
  for(const [x0,y0,x1,y1] of edges){const lg=g.createLinearGradient(x0,y0,x1,y1);lg.addColorStop(0,'rgba(110,80,40,.13)');lg.addColorStop(1,'rgba(110,80,40,0)');g.fillStyle=lg;g.fillRect(PX,PY,PW,PH);}
  g.restore();
  // 镇纸
  for(const x of [PX+40,PX+PW-270]){g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=10*DPR;g.shadowOffsetY=4*DPR;
    const lg=g.createLinearGradient(0,PY-10,0,PY+14);lg.addColorStop(0,'#5a3e28');lg.addColorStop(1,'#2e1f14');g.fillStyle=lg;
    g.beginPath();g.roundRect(x,PY-10,230,22,5);g.fill();g.restore();
    g.fillStyle='rgba(255,230,190,.12)';g.fillRect(x+6,PY-8,218,2);}
  // 淡墨盂
  g.save();g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=16*DPR;g.shadowOffsetY=6*DPR;
  gr=g.createRadialGradient(1270,195,8,1282,210,54);gr.addColorStop(0,'#fbf8f1');gr.addColorStop(1,'#bdb7aa');g.fillStyle=gr;
  g.beginPath();g.arc(WELL_LIGHT.x,WELL_LIGHT.y,54,0,7);g.fill();g.restore();
  gr=g.createRadialGradient(1272,200,4,1282,212,42);gr.addColorStop(0,'rgba(150,152,155,.55)');gr.addColorStop(1,'rgba(95,98,102,.6)');
  g.fillStyle=gr;g.beginPath();g.arc(WELL_LIGHT.x,WELL_LIGHT.y+2,41,0,7);g.fill();
  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1.5;g.beginPath();g.arc(WELL_LIGHT.x,WELL_LIGHT.y+2,36,3.6,4.6);g.stroke();
  // 笔山
  g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=8*DPR;g.shadowOffsetY=3*DPR;g.fillStyle='#3a2a1c';
  g.beginPath();g.moveTo(1222,438);g.quadraticCurveTo(1232,420,1240,414);g.quadraticCurveTo(1250,424,1258,410);g.quadraticCurveTo(1268,398,1278,412);
  g.quadraticCurveTo(1290,422,1300,416);g.quadraticCurveTo(1308,428,1312,438);g.closePath();g.fill();g.restore();
  // 砚台
  g.save();g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=18*DPR;g.shadowOffsetY=7*DPR;
  gr=g.createLinearGradient(1215,560,1350,770);gr.addColorStop(0,'#3a3530');gr.addColorStop(1,'#1b1917');g.fillStyle=gr;
  g.beginPath();g.roundRect(1215,560,134,206,16);g.fill();g.restore();
  g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=2;g.beginPath();g.roundRect(1222,567,120,192,12);g.stroke();
  gr=g.createRadialGradient(1272,602,2,1282,612,46);gr.addColorStop(0,'#000');gr.addColorStop(1,'#141210');g.fillStyle=gr;
  g.beginPath();g.ellipse(WELL_DARK.x,WELL_DARK.y,46,30,0,0,7);g.fill();
  g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=1.4;g.beginPath();g.ellipse(WELL_DARK.x-6,WELL_DARK.y-4,26,13,0,3.5,4.9);g.stroke();
  g.fillStyle='#24211d';g.beginPath();g.ellipse(1282,702,50,44,0,0,7);g.fill();
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(1278,708,30,24,.4,0,7);g.fill();
  // 墨锭
  g.save();g.translate(1366,700);g.rotate(.25);g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=8*DPR;g.fillStyle='#0d0c0b';g.fillRect(-9,-48,18,96);g.restore();
}

/* ---------- 笔画：几何 → 运动 → 压力 ---------- */
function sampleCR(pts,step){
  const out=[],P=[pts[0],...pts,pts[pts.length-1]];
  for(let i=1;i<P.length-2;i++){const p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2];
    const n=Math.max(2,Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/step));
    for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t,f=(a,b,c,d)=>0.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      out.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])]);}}
  out.push(pts[pts.length-1]); return out;
}
function buildStroke(o){
  const st=Object.assign({w:2,tone:.85,speed:250,end:'press',dry:0,vref:2600},o);st.w*=1.55;
  if(st.end==='press'&&!st.noHide&&st.w>=2.4&&st.pts.length>=2){ // 逆锋起笔、回锋收笔
    const P0=st.pts[0],P1=st.pts[1];let dx=P1[0]-P0[0],dy=P1[1]-P0[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    if(l>8){const hk=Math.min(5,st.w*1.2+1.5);
      const pts=[[P0[0]+dx*hk*.9-dy*hk*.5,P0[1]+dy*hk*.9+dx*hk*.5],[P0[0]-dx*hk*.3,P0[1]-dy*hk*.3],...st.pts.slice(1)];
      const n=pts.length,E=pts[n-1],E1=pts[n-2];let ex=E[0]-E1[0],ey=E[1]-E1[1];const el=Math.hypot(ex,ey)||1;ex/=el;ey/=el;
      pts.push([E[0]-ex*hk*.6+ey*hk*.4,E[1]-ey*hk*.6-ex*hk*.4]);st.pts=pts;}}
  const P=sampleCR(st.pts,1.0),L=[0];
  for(let i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
  st.P=P;st.L=L;st.Ltot=Math.max(1,L[L.length-1]);
  // 拐点处切分子运动（人手在拐角处减速）
  const hd=[];for(let i=0;i<P.length-1;i++)hd.push(Math.atan2(P[i+1][1]-P[i][1],P[i+1][0]-P[i][0]));
  const k=4,turn=new Array(hd.length).fill(0);
  for(let i=k;i<hd.length-k;i++){const a=hd[i+k]-hd[i-k];turn[i]=Math.abs(Math.atan2(Math.sin(a),Math.cos(a)));}
  const splits=[0];
  for(let i=1;i<turn.length-1;i++) if(turn[i]>0.7&&turn[i]>=turn[i-1]&&turn[i]>=turn[i+1]&&L[i]-splits[splits.length-1]>5&&st.Ltot-L[i]>4) splits.push(L[i]);
  splits.push(st.Ltot);
  const seg=[];for(let j=0;j<splits.length-1;j++){const l=splits[j+1]-splits[j],n=Math.max(1,Math.ceil(l/190));for(let m=0;m<n;m++)seg.push(l/n);}
  // sigma-lognormal 速度曲线：每个子运动是一个对数正态的钟形速度
  st.mv=[];let t0=0;
  seg.forEach((li,idx)=>{const D=0.09+li/(st.speed*rnd(.85,1.2)),sg=rnd(.24,.36),mu=Math.log(D)-1.9*sg;
    if(idx===0)t0=-Math.exp(mu-2.0*sg)*0.7; st.mv.push({l:li,t0,mu,sg,D}); t0+=D*rnd(.62,.8);});
  const last=st.mv[st.mv.length-1]; st.T=Math.max(0.08,last.t0+last.D*1.1);
  const raw=t=>{let s=0;for(const m of st.mv){const dt=t-m.t0;if(dt>0)s+=m.l*Phi((Math.log(dt)-m.mu)/m.sg);}return s;};
  const r0=raw(0),r1=raw(st.T);
  st.sAt=t=>st.Ltot*clamp((raw(t)-r0)/(r1-r0),0,1);
  st.posAt=s=>{if(s<=0)return P[0];if(s>=st.Ltot)return P[P.length-1];let lo=0,hi=L.length-1;
    while(hi-lo>1){const m=(lo+hi)>>1;if(L[m]<=s)lo=m;else hi=m;}const f=(s-L[lo])/((L[hi]-L[lo])||1);
    return [P[lo][0]+(P[hi][0]-P[lo][0])*f,P[lo][1]+(P[hi][1]-P[lo][1])*f];};
  // 提按：起笔顿一下，行笔微微起伏，收笔或出锋或回顿
  st.att=Math.min(.3,9/st.Ltot); st.rel=st.end==='taper'?rnd(.25,.45):Math.min(.4,16/st.Ltot);
  st.wob=rnd(.04,.1); st.wf=6.283*st.Ltot/rnd(50,110); st.wp=rnd(0,6.28);
  st.prAt=p=>{let pr=1;if(p<st.att){const q=p/st.att;pr=.3+.7*q+.25*Math.sin(Math.PI*q);}
    pr*=1+st.wob*Math.sin(p*st.wf+st.wp);
    if(p>1-st.rel){const q=(p-(1-st.rel))/st.rel;if(st.end==='taper')pr*=Math.pow(1-q,.9);else pr*=q<.7?1+.25*q/.7:1.25-(q-.7)/.3*.95;}
    return Math.max(0,pr);};
  // 笔毫
  st.N=clamp(Math.round(st.w*1.6)+2,3,16); st.br=[];
  for(let j=0;j<st.N;j++)st.br.push({o:((j+.5)/st.N)*2-1+rn()*.06,k:rnd(.75,1.1),seed:rnd(0,500)});
  st.color=st.tone>=.55?'#141110':'#23211e'; st._v=0;
  return st;
}

/* ---------- 一幅画的构图（每次随机） ---------- */
function scene(){
  const S=[],cx=PX+PW*rnd(.42,.5),cy=PY+PH*rnd(.55,.6);
  const add=(pts,o)=>S.push(Object.assign({pts:pts.map(p=>[p[0]+rn()*.8,p[1]+rn()*.8])},o));
  // 渔翁
  add([[cx+20,cy-64],[cx+33,cy-73],[cx+45,cy-80],[cx+57,cy-72],[cx+70,cy-62]],{w:1.8,speed:120,group:'fig'});
  add([[cx+19,cy-63],[cx+44,cy-60],[cx+71,cy-61]],{w:1.6,speed:150,end:'taper',group:'fig'});
  add([[cx+35,cy-59],[cx+33,cy-53],[cx+39,cy-49]],{w:1.4,speed:90,tone:.75,group:'fig'});
  add([[cx+60,cy-60],[cx+72,cy-50],[cx+80,cy-34],[cx+78,cy-14]],{w:2.2,speed:140,group:'fig'});
  add([[cx+38,cy-48],[cx+31,cy-36],[cx+34,cy-22],[cx+44,cy-13]],{w:2.0,speed:140,group:'fig'});
  for(let i=0;i<5;i++){const x0=cx+45+i*7+rn(),y0=cy-47+i*1.5+rn();
    add([[x0,y0],[x0+2,y0+9],[x0+3.5,y0+17+rnd(0,6)]],{w:1.3,speed:320,end:'taper',tone:.7,dry:.2,quick:1,group:'fig'});}
  add([[cx+40,cy-40],[cx+28,cy-36],[cx+18,cy-34]],{w:1.8,speed:120,group:'fig'});
  // 小舟
  add([[cx-142,cy-26],[cx-100,cy-10],[cx-30,cy-3],[cx+40,cy-4],[cx+100,cy-9],[cx+130,cy-20]],{w:2.4,speed:230,group:'boat'});
  add([[cx-142,cy-26],[cx-118,cy+2],[cx-60,cy+16],[cx+20,cy+19],[cx+90,cy+10],[cx+130,cy-20]],{w:2.8,speed:210,group:'boat'});
  add([[cx-124,cy-11],[cx-60,cy+3],[cx+10,cy+7],[cx+90,cy+1],[cx+118,cy-10]],{w:1.4,tone:.6,speed:280,end:'taper',dry:.15,group:'boat'});
  add([[cx+128,cy-20],[cx+134,cy-29]],{w:1.8,speed:70,group:'boat'});
  add([[cx-142,cy-26],[cx-151,cy-34]],{w:1.8,speed:70,group:'boat'});
  // 钓竿、钓丝、入水涟漪
  const tip=[cx-200+rn()*8,cy-158+rn()*8];
  add([[cx+16,cy-35],[cx-60,cy-90],[cx-140,cy-134],tip],{w:1.5,speed:600,end:'taper',group:'rod'});
  add([[tip[0],tip[1]+2],[tip[0]-5,cy-80],[tip[0]-3,cy+12],[tip[0],cy+30]],{w:.6,tone:.55,speed:110,end:'taper',group:'rod'});
  add([[tip[0]-14,cy+32],[tip[0]-4,cy+35],[tip[0]+6,cy+33]],{w:1.1,tone:.4,speed:160,end:'taper',group:'rod'});
  add([[tip[0]-24,cy+38],[tip[0]-4,cy+42],[tip[0]+16,cy+39]],{w:1.1,tone:.35,speed:200,end:'taper',dry:.2,group:'rod'});
  // 船下水纹
  add([[cx-100,cy+24],[cx-40,cy+31],[cx+40,cy+30],[cx+100,cy+22]],{w:1.3,tone:.42,speed:300,end:'taper',dry:.2,group:'water'});
  for(let i=0;i<5;i++){const y=cy+38+i*8+rn()*3,x=cx-60+rnd(-80,130),l=30+rnd(0,60);
    add([[x-l/2,y],[x,y+rnd(-2,2)],[x+l/2,y+rnd(-1,1)]],{w:1.3,tone:.38,speed:340,end:'taper',dry:.25,quick:1,group:'water'});}
  // 岸边芦苇（从根部向上出锋）
  const by=PY+PH-6;
  for(let i=0;i<9;i++){const bx=PX+30+i*19+rn()*8,Lr=rnd(110,250),lean=rnd(.15,.55),curl=rnd(-.1,.25),b=[bx,by];
    const tp=[bx+lean*Lr*(.8+curl),by-Lr+curl*Lr*.3];
    add([b,[bx+lean*Lr*.15,by-Lr*.35],[bx+lean*Lr*.45,by-Lr*.7],tp],{w:rnd(3,4.6),speed:rnd(700,1000),end:'taper',tone:rnd(.6,.85),dry:.08,quick:1,group:'reed'});
    if(i%3===1)add([tp,[tp[0]+8,tp[1]+6],[tp[0]+12,tp[1]+18]],{w:2.2,tone:.7,speed:200,end:'taper',dry:.5,quick:1,group:'reed'});}
  // 远水（淡墨、枯笔）
  let n=0;
  for(let a=0;a<80&&n<9;a++){const y=PY+110+R()*(PH-200),x=PX+60+R()*(PW-120),l=80+R()*180;
    if(x+l>PX+PW-40)continue; if(x<cx+180&&x+l>cx-270&&y>cy-190&&y<cy+80)continue; if(x<PX+280&&y>PY+PH-300)continue;
    if(x+l>PX+PW*.8&&y>PY+PH*.62)continue;
    add([[x,y],[x+l*.35,y+rnd(-3,3)],[x+l*.7,y+rnd(-2,2)],[x+l,y+rnd(-3,3)]],{w:1.1,tone:.22,speed:420,end:'taper',dry:.45,quick:1,group:'far'});n++;}
  // 远岸
  const y0=PY+140+rnd(0,40);
  add([[PX+PW*.6,y0+22],[PX+PW*.68,y0+2],[PX+PW*.75,y0+12],[PX+PW*.86,y0+4],[PX+PW-30,y0+20]],{w:1.3,tone:.2,speed:200,dry:.35,end:'taper',group:'shore'});
  add([[PX+PW*.63,y0+30],[PX+PW*.8,y0+28],[PX+PW-40,y0+30]],{w:1,tone:.16,speed:260,dry:.45,end:'taper',group:'shore'});
  // 复笔：回头把船底和渔翁背线压重
  add([[cx-141,cy-25],[cx-117,cy+3],[cx-60,cy+17],[cx-10,cy+19]],{w:2.1,tone:.95,speed:260,end:'taper',group:'rev'});
  add([[cx+71,cy-50],[cx+79,cy-34]],{w:2.4,tone:.95,speed:100,end:'taper',group:'rev'});
  return S;

/* ---------- 时间线：移动、悬停、落笔、蘸墨、端详 ---------- */
let segs=[],T=0,cur,inkLv,cls;
function add(dur,kind,fn,extra){segs.push(Object.assign({t0:T,dur,kind,fn},extra||{}));T+=dur;}
function moveTo(x,y,h1,o={}){
  const a={...cur},dx=x-a.x,dy=y-a.y,d=Math.hypot(dx,dy);
  const dur=o.dur||(0.18+d/((o.v||1200)*rnd(.8,1.25))),bend=rn()*.12*d,nx=d?-dy/d:0,ny=d?dx/d:0;
  const lift=o.lift!=null?o.lift:Math.min(.5,d/900);
  add(dur,'move',u=>{const m=minjerk(u),b=Math.sin(Math.PI*m)*bend;
    return{x:a.x+dx*m+nx*b,y:a.y+dy*m+ny*b,h:a.h+(h1-a.h)*m+lift*Math.sin(Math.PI*m),pr:0};});
  cur={x,y,h:h1};
}
function hover(dur,kind='hover',extra){const a={...cur};
  add(dur,kind,(u,t)=>{const e=Math.sin(Math.PI*u);return{x:a.x+(nX(t*1.3)-.5)*4*e,y:a.y+(nY(t*1.3)-.5)*4*e,h:a.h+(nX(t*.7+50)-.5)*.05*e,pr:0};},extra);}
function look(dur,zoom){moveTo(cur.x+rnd(40,90),cur.y+rnd(60,120),.9,{v:700});hover(dur,'look',{zoom});}
function dip(c){
  const w=c==='dark'?WELL_DARK:WELL_LIGHT,wx=w.x+rn()*6,wy=w.y+rn()*4;
  moveTo(wx,wy,.25,{v:1500});
  let a={...cur};add(.1,'dip',u=>({x:a.x,y:a.y,h:.25*(1-u),pr:.4*u}),{label:c});
  const turns=rnd(1.2,2.2),rad=rnd(5,9),dd=rnd(.6,1);
  add(dd,'dip',u=>{const g=u*turns*6.2832;return{x:wx+Math.cos(g)*rad-rad,y:wy+Math.sin(g)*rad*.6,h:0,pr:.55+.15*Math.sin(g*2)};});
  cur={x:wx+Math.cos(turns*6.2832)*rad-rad,y:wy+Math.sin(turns*6.2832)*rad*.6,h:0};
  moveTo(w.x-14,w.y-(c==='dark'?34:40),.12,{v:900,lift:.1});        // 在砚边掭笔
  for(let k=0;k<2;k++){const b={...cur},tx=(k%2?-1:1)*26;
    add(.22,'dip',u=>{const m=minjerk(u);return{x:b.x+tx*m,y:b.y-3*Math.sin(Math.PI*m),h:0,pr:.15+.5*Math.sin(Math.PI*m)};});cur={x:b.x+tx,y:b.y,h:0};}
  inkLv=1;cls=c;
}
function doStroke(st){
  const p0=st.posAt(0),a={...cur};
  add(.07+rnd(0,.05),'down',u=>{const m=minjerk(u);return{x:a.x+(p0[0]-a.x)*m,y:a.y+(p0[1]-a.y)*m,h:a.h*(1-m),pr:0};});
  add(st.T,'stroke',(u,t)=>{const s=st.sAt(u*st.T),p=st.posAt(s);return{x:p[0]+(nX(t*7)-.5)*.7,y:p[1]+(nY(t*7)-.5)*.7,h:0,pr:st.prAt(s/st.Ltot),s};},{st});
  const e=st.posAt(st.Ltot);
  if(st.end==='taper'){const e2=st.posAt(Math.max(0,st.Ltot-4));let tx=e[0]-e2[0],ty=e[1]-e2[1];const tl=Math.hypot(tx,ty)||1;tx/=tl;ty/=tl;const ft=rnd(10,22);
    add(.09,'move',u=>{const m=1-(1-u)*(1-u);return{x:e[0]+tx*ft*m,y:e[1]+ty*ft*m,h:.3*m,pr:0};});cur={x:e[0]+tx*ft,y:e[1]+ty*ft,h:.3};}
  else{add(.08,'move',u=>({x:e[0],y:e[1]-u*1.5,h:.28*minjerk(u),pr:0}));cur={x:e[0],y:e[1]-1.5,h:.28};}
}
function plan(seed){
  R=mulberry32(seed);const strokes=scene();
  segs=[];T=0;cur={x:REST.x,y:REST.y,h:1};inkLv=0;cls=null;
  hover(1.4,'look');                                   // 先对着白纸想一想
  let prevG=null;const back=new Set(['fig','rod','reed']);
  strokes.forEach((o,idx)=>{
    const g=idx/strokes.length;                        // 越画越松快
    o.speed=(o.speed||250)*(.85+.45*g);
    const st=buildStroke(o);
    if(o.group!==prevG&&prevG){back.has(prevG)?look(rnd(1.2,2),.92):look(rnd(.4,.9));}
    prevG=o.group;
    let parts=[st];
    if(!o.quick&&(o.group==='fig'||o.group==='boat')&&st.Ltot>70&&R()<.2){   // 这一笔没走到头，停一下再补
      const cut=rnd(.72,.85),sub=(a,b)=>{const out=[];for(let i=0;i<=8;i++)out.push(st.posAt(st.Ltot*(a+(b-a)*i/8)));return out;};
      parts=[buildStroke(Object.assign({},o,{pts:sub(0,cut),end:'taper',noHide:1})),
             buildStroke(Object.assign({},o,{pts:sub(cut-.05,1),noHide:1,speed:o.speed*.8}))];
    }
    parts.forEach((p,k)=>{
      if(k===1)hover(rnd(.5,.9),'look');
      const c=p.tone>=.55?'dark':'light',need=p.Ltot*p.w*(.25+p.tone)/1700;
      if(cls!==c||inkLv-need<.08)dip(c);
      p.inkStart=inkLv;p.cons=need/p.Ltot;inkLv-=need;
      const p0=p.posAt(0);
      moveTo(p0[0]+rn()*2,p0[1]-3+rn()*2,.22,{v:(o.quick?1700:1150)*(.9+.4*g)});
      hover((o.quick?rnd(.04,.12):rnd(.12,.4))*(1.3-.6*g));
      doStroke(p);
    });
  });
  look(1.6,.92);
  moveTo(REST.x,REST.y,1,{v:1000});hover(.6);
  add(.7,'seal',()=>({x:REST.x,y:REST.y,h:1,pr:0}));
  hover(3,'look',{zoom:.9});
}

/* ---------- 落墨 ---------- */
function deposit(a,b,st,dt){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),v=d/Math.max(dt,1e-4);
  st._v+=(v-st._v)*.25;
  const sm=(a.s+b.s)/2,q1=st.posAt(Math.min(st.Ltot,sm+1.5)),q0=st.posAt(Math.max(0,sm-1.5));
  let tx=q1[0]-q0[0],ty=q1[1]-q0[1];const tl=Math.hypot(tx,ty)||1;const nx=-ty/tl,ny=tx/tl;
  const n=Math.max(1,Math.ceil(d/.6));
  ink.fillStyle=st.color;
  for(let k=1;k<=n;k++){const f=k/n,x=a.x+dx*f,y=a.y+dy*f,pr=a.pr+(b.pr-a.pr)*f,s=a.s+(b.s-a.s)*f;
    const w=st.w*pr/(1+st._v/st.vref);if(w<.15)continue;
    const lv=clamp(st.inkStart-st.cons*s,0,1);
    const amt=(d/n)/.6+(dt/n)*6;                       // 走得慢、停得久，墨就多
    stamp(x,y,w,nx,ny,s,st,amt,lv,ny,-nx);}
}
const HALO=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const rg=g.createRadialGradient(32,32,0,32,32,32);rg.addColorStop(0,'rgba(20,17,15,1)');rg.addColorStop(.5,'rgba(20,17,15,.35)');rg.addColorStop(1,'rgba(20,17,15,0)');
  g.fillStyle=rg;g.fillRect(0,0,64,64);return c;})();
function stamp(x,y,w,nx,ny,s,st,amt,lv,tx,ty){
  const N=st.N,r=Math.max(.3,w/N*.8+.22),cov=Math.max(1,N*2*r/(w+2*r)),neff=cov*(2*r/.6);
  const O=clamp(st.tone*1.12*(.6+.4*lv),0,.97);
  const dry=st.dry+Math.max(0,.5-lv)*1.4+Math.max(0,st._v-350)/1800;   // 墨少、笔快 → 飞白
  for(const b of st.br){
    if(dry>0&&nB(s*.07+b.seed*1.7)<dry*(.45+.9*Math.pow(Math.abs(b.o),1.5)))continue;
    const off=b.o*w*.5*(1+(nB(s*.25+b.seed)-.5)*.3);
    const back=(1-b.o*b.o)*w*.5;                       // 笔肚拖在笔尖后面
    const a=1-Math.pow(1-clamp(O*b.k,0,.97),amt/neff);if(a<.002)continue;
    ink.globalAlpha=a;ink.beginPath();ink.arc(x+nx*off-tx*back,y+ny*off-ty*back,r,0,6.2832);ink.fill();}
  const ha=.012*lv*lv*(.4+st.tone)*amt/(1+st._v/300);   // 湿笔慢行，墨在宣纸上晕开
  if(ha>.0015){const Rr=w*.8+2.5;ink.globalAlpha=Math.min(.2,ha);ink.drawImage(HALO,x-Rr-tx*w*.25,y-Rr-ty*w*.25,Rr*2,Rr*2);}
  ink.globalAlpha=1;
}
function bleed(st,x,y){
  if(st.inkStart<.75||st.tone<.5)return;
  const rad=st.w*1.9,g=ink.createRadialGradient(x,y,0,x,y,rad);
  g.addColorStop(0,`rgba(20,17,16,${.12*st.tone})`);g.addColorStop(1,'rgba(20,17,16,0)');
  ink.fillStyle=g;ink.fillRect(x-rad,y-rad,rad*2,rad*2);

/* ---------- 印章 ---------- */
let sealC,SEAL={x:PX+PW*.86,y:PY+PH*.7,s:52};
function makeSeal(){
  const S=SEAL.s,c=document.createElement('canvas');c.width=c.height=S*DPR;const g=c.getContext('2d');g.scale(DPR,DPR);
  const r=mulberry32(99);g.fillStyle='#ad3328';g.beginPath();
  const pts=[];for(let i=0;i<=12;i++)pts.push([i/12*S,r()*1.5]);for(let i=0;i<=12;i++)pts.push([S-r()*1.5,i/12*S]);
  for(let i=12;i>=0;i--)pts.push([i/12*S,S-r()*1.5]);for(let i=12;i>=0;i--)pts.push([r()*1.5,i/12*S]);
  pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.fill();
  g.globalCompositeOperation='destination-out';
  g.font=`${S*.4}px "STKaiti","KaiTi","Kaiti SC","STSong","Songti SC","Noto Serif CJK SC",serif`;g.textAlign='center';g.textBaseline='middle';
  g.fillText('昌',S*.72,S*.28);g.fillText('荣',S*.72,S*.73);g.fillText('之',S*.28,S*.28);g.fillText('印',S*.28,S*.73);
  for(let i=0;i<160;i++){g.globalAlpha=.2+r()*.7;g.beginPath();g.arc(r()*S,r()*S,.3+r()*1.1,0,7);g.fill();}
  return c;
}

/* ---------- 毛笔 ---------- */
let lean=0;
function drawBrush(x,y,h,pr){
  const g=fx,hl=40*(1-.2*pr),hw=3.4+3*pr,L=300;
  g.save();g.translate(x,y);g.rotate(-1+lean);const sc=1+h*.07;g.scale(sc,sc);
  g.shadowColor='rgba(20,10,0,.38)';g.shadowBlur=(5+h*16)*DPR;g.shadowOffsetX=(3+h*40)*DPR;g.shadowOffsetY=(3+h*26)*DPR;
  g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(hl*.3,-hw*1.1,hl,-hw);g.lineTo(hl+11,-5.2);g.lineTo(L,-4.2);g.quadraticCurveTo(L+5,0,L,4.2);
  g.lineTo(hl+11,5.2);g.lineTo(hl,hw);g.quadraticCurveTo(hl*.3,hw*1.1,0,0);g.closePath();g.fillStyle='#b48a52';g.fill();
  g.shadowColor='transparent';
  let gr=g.createLinearGradient(0,-5,0,5);gr.addColorStop(0,'#e3c792');gr.addColorStop(.45,'#c39a5d');gr.addColorStop(1,'#7a5830');
  g.beginPath();g.moveTo(hl+11,-5.2);g.lineTo(L,-4.2);g.quadraticCurveTo(L+5,0,L,4.2);g.lineTo(hl+11,5.2);g.closePath();g.fillStyle=gr;g.fill();
  g.strokeStyle='rgba(80,52,25,.55)';g.lineWidth=1;for(const k of [128,212,276]){g.beginPath();g.moveTo(k,-4.6);g.lineTo(k,4.6);g.stroke();}
  g.strokeStyle='rgba(255,245,220,.35)';g.lineWidth=1.2;g.beginPath();g.moveTo(hl+14,-2.4);g.lineTo(L-4,-2);g.stroke();
  gr=g.createLinearGradient(0,-6,0,6);gr.addColorStop(0,'#7a5636');gr.addColorStop(1,'#35231a');g.fillStyle=gr;g.fillRect(hl,-5.4,12,10.8);
  gr=g.createLinearGradient(0,0,hl,0);gr.addColorStop(0,'#050403');gr.addColorStop(.7,'#1c1713');gr.addColorStop(1,'#3a3029');
  g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(hl*.3,-hw*1.1,hl+1,-hw);g.lineTo(hl+1,hw);g.quadraticCurveTo(hl*.3,hw*1.1,0,0);g.fillStyle=gr;g.fill();
  g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=.8;g.beginPath();g.moveTo(hl*.25,-hw*.45);g.quadraticCurveTo(hl*.6,-hw*.8,hl*.95,-hw*.7);g.stroke();
  g.restore();
}

/* ---------- 声音：全部实时合成 ---------- */
const Snd={ctx:null,on:false,v:0};
function initSound(){
  if(Snd.ctx)return;const C=new(window.AudioContext||window.webkitAudioContext)();Snd.ctx=C;
  const buf=C.createBuffer(1,C.sampleRate*2,C.sampleRate),d=buf.getChannelData(0);let b0=0,b1=0,b2=0;
  for(let i=0;i<d.length;i++){const w=Math.random()*2-1;b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.0526;d[i]=(b0+b1+b2+w*.1848)*.25;}
  const src=C.createBufferSource();src.buffer=buf;src.loop=true;
  const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2000;bp.Q.value=.7;
  const hs=C.createBiquadFilter();hs.type='highshelf';hs.frequency.value=4000;hs.gain.value=0;
  const g=C.createGain();g.gain.value=0;
  const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=450;const g2=C.createGain();g2.gain.value=0;
  const master=C.createGain();master.gain.value=0;const comp=C.createDynamicsCompressor();
  src.connect(bp);bp.connect(hs);hs.connect(g);g.connect(master);src.connect(lp);lp.connect(g2);g2.connect(master);
  master.connect(comp);comp.connect(C.destination);src.start();
  Object.assign(Snd,{bp,hs,g,lp,g2,master,buf});
}
function burst({f=1500,q=3,dur=.06,gain=.3,delay=0,type='bandpass'}){
  if(!Snd.on)return;const C=Snd.ctx,t=C.currentTime+delay,s=C.createBufferSource();s.buffer=Snd.buf;
  const bf=C.createBiquadFilter();bf.type=type;bf.frequency.value=f;bf.Q.value=q;const g=C.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(bf);bf.connect(g);g.connect(Snd.master);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);
}
function tone({f0,f1,dur,gain,delay=0}){
  if(!Snd.on)return;const C=Snd.ctx,t=C.currentTime+delay,o=C.createOscillator(),g=C.createGain();
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(Snd.master);o.start(t);o.stop(t+dur+.05);
}
function sndEvent(sg){
  if(!Snd.on)return;
  if(sg.kind==='dip'&&sg.label==='dark')burst({f:1700,q:5,dur:.07,gain:.25,delay:.1/speed});            // 笔碰砚台
  else if(sg.kind==='dip'&&sg.label==='light'){tone({f0:1100,f1:1700,dur:.08,gain:.07,delay:.1/speed});tone({f0:2650,f1:2600,dur:.5,gain:.025,delay:.1/speed});}
  else if(sg.kind==='stroke')burst({f:700,q:1,dur:.05,gain:.05,type:'lowpass'});                      // 落笔
  else if(sg.kind==='seal'){tone({f0:120,f1:55,dur:.3,gain:.35});burst({f:350,q:1,dur:.15,gain:.25,type:'lowpass'});}
}
function sndUpdate(){
  if(!Snd.on)return;const C=Snd.ctx,t=C.currentTime,sg=segs[segIdx];let paper=0,body=0,f=1800,hi=0;
  if(sg&&!finished&&state.h<.01){const v=Snd.v*speed,pr=state.pr||0;
    if(sg.kind==='stroke'){const st=sg.st,lv=clamp(st.inkStart-st.cons*(state.s||0),0,1);
      paper=pr*(.12+Math.min(1,v/700))*.55;body=pr*.22*Math.max(0,1-v/350);f=800+Math.min(v,2500)*1.8;hi=(st.dry+Math.max(0,.5-lv))*14;}
    else if(sg.kind==='dip'){paper=.1*pr*(.3+Math.min(1,v/150));f=500;body=.04;}}
  Snd.g.gain.setTargetAtTime(paper,t,.015);Snd.bp.frequency.setTargetAtTime(f,t,.03);
  Snd.g2.gain.setTargetAtTime(body,t,.04);Snd.hs.gain.setTargetAtTime(Math.min(12,hi),t,.05);
}

/* ---------- 运行 ---------- */
let simT=0,segIdx=0,prevS=null,prevT=0,state,speed=1,count=0,finished=false,zoomNow=1,fit=1,seed;
const SUB=1/240;
function applyZoom(){stage.style.transitionDuration=(1.1/speed)+'s';stage.style.transform=`scale(${fit*zoomNow})`;}
function onResize(){fit=Math.min(innerWidth/W,innerHeight/H)*.98;applyZoom();}
function setStatus(t){statusEl.textContent=t;}
function enterSeg(sg){
  sndEvent(sg);
  const z=sg.zoom||1;if(z!==zoomNow){zoomNow=z;applyZoom();}
  if(sg.kind==='stroke'){prevS=sg.fn(0,sg.t0);prevT=sg.t0;count++;bleed(sg.st,prevS.x,prevS.y);setStatus(`第 ${count} 笔`);}
  else if(sg.kind==='dip'&&sg.label)setStatus(sg.label==='dark'?'蘸墨':'调淡墨');
  else if(sg.kind==='look')setStatus('端详');
  else if(sg.kind==='seal')setStatus('钤印');
}
function exitSeg(sg){
  if(sg.kind==='stroke'&&prevS){const e=sg.fn(1,sg.t0+sg.dur);deposit(prevS,e,sg.st,Math.max(1e-3,sg.t0+sg.dur-prevT));prevS=null;}
  if(sg.kind==='seal'){ink.save();ink.globalAlpha=.9;ink.drawImage(sealC,SEAL.x,SEAL.y,SEAL.s,SEAL.s);ink.restore();}
}
function step(t){
  while(segIdx<segs.length&&t>=segs[segIdx].t0+segs[segIdx].dur){exitSeg(segs[segIdx]);segIdx++;if(segIdx<segs.length)enterSeg(segs[segIdx]);}
  if(segIdx>=segs.length){if(!finished){finished=true;setStatus(`共 ${count} 笔 · ${Math.round(T)} 秒 · #${seed}`);}return;}
  const sg=segs[segIdx],s=sg.fn(clamp((t-sg.t0)/sg.dur,0,1),t);
  if(sg.kind==='stroke'){deposit(prevS,s,sg.st,t-prevT);prevS=s;prevT=t;}
  Snd.v+=(Math.hypot(s.x-state.x,s.y-state.y)/SUB-Snd.v)*.05;const vx=(s.x-state.x)/SUB;lean+=(clamp(-vx/2500,-.3,.3)-lean)*.03;
  state=s;
}
function render(){
  fx.clearRect(0,0,W,H);
  const sg=segs[segIdx];
  if(sg&&sg.kind==='seal'){const u=clamp((simT-sg.t0)/sg.dur,0,1),k=1.08-.08*minjerk(u),S=SEAL.s*k;
    fx.save();fx.globalAlpha=.9*Math.sqrt(u);fx.drawImage(sealC,SEAL.x+SEAL.s/2-S/2,SEAL.y+SEAL.s/2-S/2,S,S);fx.restore();}
  drawBrush(state.x,state.y,state.h,state.pr||0);
}
function start(sd){
  seed=sd;ink.clearRect(PX,PY,PW,PH);plan(sd);sealC=makeSeal();
  simT=0;segIdx=0;prevS=null;count=0;finished=false;lean=0;state={x:REST.x,y:REST.y,h:1,pr:0};
  zoomNow=1;applyZoom();enterSeg(segs[0]);
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000)*speed;last=now;
  const target=simT+dt;while(simT<target){simT=Math.min(target,simT+SUB);step(simT);}
  render();sndUpdate();requestAnimationFrame(frame);}
document.querySelectorAll('#ui button[data-s]').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;
  document.querySelectorAll('#ui button[data-s]').forEach(x=>x.classList.toggle('on',x===b));applyZoom();});
document.getElementById('snd').onclick=e=>{initSound();Snd.ctx.resume();Snd.on=!Snd.on;
  Snd.master.gain.setTargetAtTime(Snd.on?.9:0,Snd.ctx.currentTime,.05);e.target.textContent=Snd.on?'关声音':'开声音';e.target.classList.toggle('on',Snd.on);};
window.__snd=()=>{sndUpdate();return !!Snd.ctx;};
